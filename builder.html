        // ==================== QR 导入（使用 jsQR） ====================
        function setupQRImportExport() {
            const qrImportBtn = document.getElementById('qrImportBtn');
            const qrFileInput = document.getElementById('qrFileInput');
            if (qrImportBtn && qrFileInput) {
                qrImportBtn.addEventListener('click', () => qrFileInput.click());
                qrFileInput.addEventListener('change', async function() {
                    if (!this.files || !this.files[0]) return;
                    const file = this.files[0];
                    const status = document.getElementById('imageStatus');

                    try {
                        if (status) status.textContent = '⏳ 正在解码二维码...';

                        const img = await createImageBitmap(file);
                        const canvas = document.createElement('canvas');
                        let width = img.width,
                            height = img.height;
                        const MAX_SIZE = 1200;
                        if (width > MAX_SIZE || height > MAX_SIZE) {
                            const ratio = Math.min(MAX_SIZE / width, MAX_SIZE / height);
                            width = Math.floor(width * ratio);
                            height = Math.floor(height * ratio);
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const imageData = ctx.getImageData(0, 0, width, height);

                        let code = jsQR(imageData.data, imageData.width, imageData.height, {
                            inversionAttempts: "attemptBoth",
                        });

                        if (!code) {
                            throw new Error('未检测到二维码');
                        }

                        const decodedText = code.data;
                        if (decodedText && decodedText.startsWith('%%')) {
                            importDeckFromCode(decodedText);
                            if (status) status.textContent = '✅ 二维码解码成功！';
                        } else {
                            throw new Error('未识别到卡组代码（内容不以 %% 开头）');
                        }
                    } catch (e) {
                        if (status) status.textContent = '❌ 二维码解码失败: ' + e.message;
                        alert('二维码解码失败: ' + e.message);
                    }
                    this.value = '';
                });
            }

            // 桌面端 QR 导出
            const qrExportBtn = document.getElementById('qrExportBtn');
            if (qrExportBtn) {
                qrExportBtn.addEventListener('click', async function() {
                    const code = exportDeckCode();
                    if (!code) { alert('卡组为空'); return; }

                    const title = prompt('请输入二维码卡的标题：', '卡组二维码');
                    if (title === null) return;
                    const finalTitle = title.trim() || '卡组二维码';

                    const cardW = 500,
                        cardH = 702;
                    const canvas = document.createElement('canvas');
                    canvas.width = cardW;
                    canvas.height = cardH;
                    const ctx = canvas.getContext('2d');
                    const radius = 15;
                    ctx.beginPath();
                    ctx.moveTo(radius, 0);
                    ctx.lineTo(cardW - radius, 0);
                    ctx.quadraticCurveTo(cardW, 0, cardW, radius);
                    ctx.lineTo(cardW, cardH - radius);
                    ctx.quadraticCurveTo(cardW, cardH, cardW - radius, cardH);
                    ctx.lineTo(radius, cardH);
                    ctx.quadraticCurveTo(0, cardH, 0, cardH - radius);
                    ctx.lineTo(0, radius);
                    ctx.quadraticCurveTo(0, 0, radius, 0);
                    ctx.closePath();
                    ctx.fillStyle = '#1a1c12';
                    ctx.fill();
                    ctx.strokeStyle = '#c9aa5b';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#ffefbf';
                    ctx.font = 'bold 36px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText(finalTitle, cardW / 2, 60);

                    const qrSize = Math.min(cardW * 0.65, cardH * 0.5);
                    const qrUrl =
                        `https://api.qrserver.com/v1/create-qr-code/?size=${Math.floor(qrSize)}x${Math.floor(qrSize)}&data=${encodeURIComponent(code)}&bgcolor=1a1c12&color=f5c542&format=png`;
                    const img = new Image();
                    img.crossOrigin = 'Anonymous';
                    await new Promise((r) => { img.onload = r;
                        img.onerror = r;
                        img.src = qrUrl; });
                    const qrX = (cardW - qrSize) / 2;
                    const qrY = 90;
                    ctx.drawImage(img, qrX, qrY, qrSize, qrSize);

                    const maxLineWidth = qrSize * 0.9;
                    const fontSize = 16;
                    ctx.font = `${fontSize}px monospace`;
                    ctx.fillStyle = '#c9b06b';
                    ctx.textAlign = 'center';

                    let lines = [];
                    let currentLine = '';
                    for (let i = 0; i < code.length; i++) {
                        const char = code[i];
                        const testLine = currentLine + char;
                        if (ctx.measureText(testLine).width > maxLineWidth && currentLine.length > 0) {
                            lines.push(currentLine);
                            currentLine = char;
                        } else {
                            currentLine = testLine;
                        }
                    }
                    if (currentLine) lines.push(currentLine);

                    const lineHeight = fontSize * 1.5;
                    const startY = qrY + qrSize + 20;
                    for (let i = 0; i < lines.length; i++) {
                        const lineY = startY + i * lineHeight;
                        if (lineY > cardH - 10) break;
                        ctx.fillText(lines[i], cardW / 2, lineY);
                    }

                    const link = document.createElement('a');
                    link.download = `qr_card_${new Date().toISOString().slice(0,19)}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                });
            }

            // 移动端同步
            const mobileQrImportBtn = document.getElementById('mobileQrImportBtn');
            const mobileQrFileInput = document.getElementById('mobileQrFileInput');
            if (mobileQrImportBtn && mobileQrFileInput) {
                mobileQrImportBtn.addEventListener('click', () => mobileQrFileInput.click());
                mobileQrFileInput.addEventListener('change', function() {
                    if (this.files && this.files[0]) {
                        const dt = new DataTransfer();
                        dt.items.add(this.files[0]);
                        qrFileInput.files = dt.files;
                        qrFileInput.dispatchEvent(new Event('change'));
                        this.value = '';
                    }
                });
            }

            const mobileQrExportBtn = document.getElementById('mobileQrExportBtn');
            if (mobileQrExportBtn) {
                mobileQrExportBtn.addEventListener('click', function() {
                    qrExportBtn.click();
                });
            }
        }

        // 绘制统计卡（修正条形图顺序：自下至上 单位→指令→反制）
        async function drawStatsCard(ctx, x, y, w, h, radius, customTitle) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + w - radius, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
            ctx.lineTo(x + w, y + h - radius);
            ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            ctx.lineTo(x + radius, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fillStyle = "#1a1c12";
            ctx.fill();
            ctx.strokeStyle = "#c9aa5b";
            ctx.lineWidth = 2;
            ctx.stroke();

            const title = customTitle || "卡组统计";
            let mainCount = 0,
                allyCount = 0,
                otherCount = 0;
            let rarityCounts = { Standard: 0, Limited: 0, Special: 0, Elite: 0 };
            let costMap = { 0: { unit: 0, order: 0, counter: 0 }, 1: { unit: 0, order: 0, counter: 0 }, 2: { unit: 0,
                    order: 0, counter: 0 }, 3: { unit: 0, order: 0, counter: 0 }, 4: { unit: 0, order: 0,
                    counter: 0 }, 5: { unit: 0, order: 0, counter: 0 }, 6: { unit: 0, order: 0, counter: 0 },
                7: { unit: 0, order: 0, counter: 0 } };
            let unitTotal = 0,
                orderTotal = 0,
                counterTotal = 0,
                totalCostSum = 0,
                totalCardsCount = 0;
            for (let { card, count } of deckMap.values()) {
                if (card.faction === mainNation) mainCount += count;
                else if (card.faction === allyNation) allyCount += count;
                else otherCount += count;
                if (rarityCounts.hasOwnProperty(card.rarity)) rarityCounts[card.rarity] += count;
                const effectiveCost = cardCostMap.get(card.cardId) ?? card.cost;
                const cat = effectiveCost >= 7 ? 7 : effectiveCost;
                const typeCat = card.type === "order" ? "order" : card.type === "countermeasure" ? "counter" : "unit";
                if (typeCat === "unit") { costMap[cat].unit += count;
                    unitTotal += count; } else if (typeCat === "order") { costMap[cat].order += count;
                    orderTotal += count; } else { costMap[cat].counter += count;
                    counterTotal += count; }
                totalCostSum += effectiveCost * count;
                totalCardsCount += count;
            }
            const avgCost = totalCardsCount > 0 ? (totalCostSum / totalCardsCount) : 0;
            const totalCards = Array.from(deckMap.values()).reduce((s, e) => s + e.count, 0);

            ctx.fillStyle = "#ffefbf";
            ctx.font = `bold ${Math.floor(h * 0.08)}px "Segoe UI"`;
            ctx.textAlign = "center";
            ctx.fillText(title, x + w / 2, y + h * 0.10);

            ctx.font = `${Math.floor(h * 0.05)}px "Segoe UI"`;
            ctx.textAlign = "left";
            const startY = y + h * 0.22;
            const lineH = h * 0.075;
            const iconSize = Math.floor(h * 0.06);

            const mainIcon = new Image();
            mainIcon.crossOrigin = "Anonymous";
            mainIcon.src = `${mainNation}.svg`;
            await new Promise(r => { mainIcon.onload = r;
                mainIcon.onerror = r; });
            ctx.drawImage(mainIcon, x + w * 0.05, startY - iconSize * 0.7, iconSize, iconSize);
            ctx.fillStyle = factionColor[mainNation] || "#c9aa5b";
            ctx.fillText(`${factionNames[mainNation]}: ${mainCount}`, x + w * 0.05 + iconSize + 5, startY + 2);

            const allyIcon = new Image();
            allyIcon.crossOrigin = "Anonymous";
            allyIcon.src = `${allyNation}.svg`;
            await new Promise(r => { allyIcon.onload = r;
                allyIcon.onerror = r; });
            ctx.drawImage(allyIcon, x + w * 0.05, startY + lineH - iconSize * 0.7, iconSize, iconSize);
            ctx.fillStyle = factionColor[allyNation] || "#c9aa5b";
            ctx.fillText(`${factionNames[allyNation].slice(0,2)}: ${allyCount}`, x + w * 0.05 + iconSize + 5, startY +
                lineH + 2);

            let lineOffset = 2;
            if (otherCount > 0) {
                ctx.fillStyle = "#a0a0a0";
                ctx.fillText(`其他: ${otherCount}`, x + w * 0.05 + iconSize + 5, startY + lineH * 2 + 2);
                lineOffset = 3;
            }
            ctx.fillStyle = "#e9dbbd";
            ctx.fillText(`总计: ${totalCards}`, x + w * 0.05 + iconSize + 5, startY + lineH * lineOffset + 2);

            const rarityY = startY;
            const col2X = x + w * 0.52;
            ctx.textAlign = "left";

            ctx.fillText(`普通: ${rarityCounts.Standard}`, col2X, rarityY + 2);

            ctx.fillStyle = "#ffefb9";
            ctx.font = `${Math.floor(h * 0.045)}px "Segoe UI"`;
            ctx.textAlign = "center";
            ctx.fillText(`平均费用: ${avgCost.toFixed(2)}`, x + w / 2, rarityY + lineH * 4 + 10);

            // 条形图：自下至上 单位→指令→反制
            const barAreaY = y + h * 0.68;
            const barAreaH = h * 0.28;
            const barStartX = x + w * 0.06;
            const barWidth = (w * 0.88) / 8;
            const barMaxHeight = barAreaH * 0.75;
            const barGap = 2;

            let maxCount = 1;
            for (let i = 0; i <= 7; i++) {
                const total = costMap[i].unit + costMap[i].order + costMap[i].counter;
                if (total > maxCount) maxCount = total;
            }

            for (let i = 0; i <= 7; i++) {
                const bx = barStartX + i * barWidth;
                const unit = costMap[i].unit || 0;
                const order = costMap[i].order || 0;
                const counter = costMap[i].counter || 0;
                const total = unit + order + counter;

                const unitH = maxCount > 0 ? (unit / maxCount) * barMaxHeight : 0;
                const orderH = maxCount > 0 ? (order / maxCount) * barMaxHeight : 0;
                const counterH = maxCount > 0 ? (counter / maxCount) * barMaxHeight : 0;

                // 从底部开始：单位(浅色) → 指令(黄色) → 反制(灰色)
                let currentY = barAreaY + barMaxHeight;

                // 单位（底部）
                if (unit > 0) {
                    ctx.fillStyle = '#e8e4d0';
                    ctx.fillRect(bx, currentY - unitH, barWidth - barGap, unitH);
                    currentY -= unitH;
                }
                // 指令（中间）
                if (order > 0) {
                    ctx.fillStyle = '#f5c542';
                    ctx.fillRect(bx, currentY - orderH, barWidth - barGap, orderH);
                    currentY -= orderH;
                }
                // 反制（顶部）
                if (counter > 0) {
                    ctx.fillStyle = '#5a5a5a';
                    ctx.fillRect(bx, currentY - counterH, barWidth - barGap, counterH);
                    currentY -= counterH;
                }

                // 标签
                ctx.fillStyle = "#f5eaca";
                ctx.font = `${Math.floor(h * 0.035)}px "Segoe UI"`;
                ctx.textAlign = "center";
                ctx.fillText(i === 7 ? "7K+" : `${i}K`, bx + (barWidth - barGap) / 2, barAreaY + barMaxHeight + h * 0.045);

                if (total > 0) {
                    ctx.fillStyle = "#ffefb9";
                    ctx.font = `${Math.floor(h * 0.03)}px "Segoe UI"`;
                    // 总数值显示在顶部（反制之上）
                    ctx.fillText(total, bx + (barWidth - barGap) / 2, barAreaY + barMaxHeight - unitH - orderH - counterH -
                        h * 0.025);
                } else {
                    ctx.fillStyle = "#ffefb9";
                    ctx.font = `${Math.floor(h * 0.03)}px "Segoe UI"`;
                    ctx.fillText("0", bx + (barWidth - barGap) / 2, barAreaY + barMaxHeight - h * 0.025);
                }
            }
            ctx.restore();
        }

        // 绘制二维码卡
        async function drawQrCard(ctx, x, y, w, h, radius, qrCodeData, customTitle) {
            if (!qrCodeData) return;
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + w - radius, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
            ctx.lineTo(x + w, y + h - radius);
            ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            ctx.lineTo(x + radius, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fillStyle = "#1a1c12";
            ctx.fill();
            ctx.strokeStyle = "#c9aa5b";
            ctx.lineWidth = 2;
            ctx.stroke();

            const title = customTitle || "卡组二维码";
            ctx.fillStyle = "#ffefbf";
            ctx.font = `bold ${Math.floor(h * 0.08)}px "Segoe UI"`;
            ctx.textAlign = "center";
            ctx.fillText(title, x + w / 2, y + h * 0.10);

            const qrSize = Math.min(w * 0.7, h * 0.5);
            const qrUrl =
                `https://api.qrserver.com/v1/create-qr-code/?size=${Math.floor(qrSize)}x${Math.floor(qrSize)}&data=${encodeURIComponent(qrCodeData)}&bgcolor=1a1c12&color=f5c542&format=png`;
            const img = new Image();
            img.crossOrigin = "Anonymous";
            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = reject;
                img.src = qrUrl;
            });
            const qrX = x + (w - qrSize) / 2;
            const qrY = y + h * 0.18;
            ctx.drawImage(img, qrX, qrY, qrSize, qrSize);

            // 自动换行
            const maxLineWidth = qrSize * 0.9;
            const fontSize = Math.floor(h * 0.035);
            ctx.font = `${fontSize}px monospace`;
            ctx.fillStyle = "#c9b06b";
            ctx.textAlign = "center";

            let lines = [];
            let currentLine = '';
            for (let i = 0; i < qrCodeData.length; i++) {
                const char = qrCodeData[i];
                const testLine = currentLine + char;
                if (ctx.measureText(testLine).width > maxLineWidth && currentLine.length > 0) {
                    lines.push(currentLine);
                    currentLine = char;
                } else {
                    currentLine = testLine;
                }
            }
            if (currentLine) lines.push(currentLine);

            const lineHeight = fontSize * 1.5;
            const startY = qrY + qrSize + 20;
            for (let i = 0; i < lines.length; i++) {
                const lineY = startY + i * lineHeight;
                if (lineY > y + h - 10) break;
                ctx.fillText(lines[i], x + w / 2, lineY);
            }
            ctx.restore();
        }

        // ==================== 生成卡组图片（标签逻辑修改） ====================
        async function generateDeckImageWithOptions(cols, quality, lang, addStatsCard, bgColor, cardsWithVersion, foldEnabled,
            qrEnabled, statsTitle, qrTitle) {
            if (!cardsWithVersion || cardsWithVersion.length === 0) throw new Error("卡组为空");

            cardsWithVersion.sort((a, b) => {
                if (a.card.isHeadquarter) return -1;
                if (b.card.isHeadquarter) return 1;
                const costA = cardCostMap.get(a.card.cardId) ?? a.card.cost;
                const costB = cardCostMap.get(b.card.cardId) ?? b.card.cost;
                if (costA !== costB) return costA - costB;
                return a.card.cardId.localeCompare(b.card.cardId, undefined, { numeric: true, sensitivity: 'base' });
            });

            const cardCountMap = {};
            for (const item of cardsWithVersion) {
                const key = item.card.cardId;
                cardCountMap[key] = (cardCountMap[key] || 0) + 1;
            }
            const starredSet = new Set();
            for (const [cardId, starred] of cardStarMap) {
                if (starred) starredSet.add(cardId);
            }

            let displayCards = cardsWithVersion;
            if (foldEnabled) {
                const uniqueMap = new Map();
                for (const item of cardsWithVersion) {
                    const key = item.card.cardId;
                    if (!uniqueMap.has(key)) {
                        uniqueMap.set(key, { card: item.card, version: item.version, count: 1 });
                    } else {
                        uniqueMap.get(key).count++;
                    }
                }
                displayCards = Array.from(uniqueMap.values()).map(item => ({
                    card: item.card,
                    version: item.version,
                    count: item.count
                }));
                displayCards.sort((a, b) => {
                    if (a.card.isHeadquarter) return -1;
                    if (b.card.isHeadquarter) return 1;
                    const costA = cardCostMap.get(a.card.cardId) ?? a.card.cost;
                    const costB = cardCostMap.get(b.card.cardId) ?? b.card.cost;
                    if (costA !== costB) return costA - costB;
                    return a.card.cardId.localeCompare(b.card.cardId, undefined, { numeric: true, sensitivity: 'base' });
                });
            }

            let extraCount = 0;
            if (addStatsCard) extraCount++;
            if (qrEnabled) extraCount++;

            const cardW = 500,
                cardH = 702,
                radius = 15;
            let totalCards = displayCards.length + extraCount;
            const rows = Math.ceil(totalCards / cols);
            const canvas = document.createElement('canvas');
            canvas.width = cols * cardW;
            canvas.height = rows * cardH;
            const ctx = canvas.getContext('2d');

            if (bgColor && bgColor !== 'transparent') {
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (bgColor === 'transparent') {
                // 透明
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 标签绘制辅助：折叠模式下每张卡只绘制一次标签，非折叠每张卡独立
            const drawnFoldSet = new Set();
            const drawnStarSet = new Set();

            // 绘制带尖角的标签
            const drawTagWithArrow = (text, x, y, color, bgColorTag = 'rgba(0,0,0,0.85)') => {
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 4;
                ctx.font = 'bold 28px "Segoe UI"';
                const metrics = ctx.measureText(text);
                const textWidth = metrics.width;
                const pad = 12;
                const rectW = textWidth + pad * 2;
                const rectH = 60;
                const arrowSize = 14; // 尖角宽度
                const posX = x;
                const posY = y;

                // 绘制矩形（左圆角，右直角，右侧带尖角）
                ctx.beginPath();
                ctx.moveTo(posX + 8, posY);
                ctx.lineTo(posX + rectW, posY);
                ctx.lineTo(posX + rectW + arrowSize, posY + rectH / 2);
                ctx.lineTo(posX + rectW, posY + rectH);
                ctx.lineTo(posX + 8, posY + rectH);
                ctx.quadraticCurveTo(posX, posY + rectH, posX, posY + rectH - 8);
                ctx.lineTo(posX, posY + 8);
                ctx.quadraticCurveTo(posX, posY, posX + 8, posY);
                ctx.closePath();

                ctx.fillStyle = bgColorTag;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = color;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, posX + pad, posY + rectH / 2);
                ctx.restore();
            };

            let cardIdx = 0;
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const x = col * cardW,
                        y = row * cardH;
                    if (cardIdx < displayCards.length) {
                        const item = displayCards[cardIdx];
                        const card = item.card;
                        let ver = item.version || DEFAULT_VERSION;
                        if (!await probeImageExists(card.image, lang, ver)) {
                            ver = DEFAULT_VERSION;
                        }
                        const imgUrl = getCardImageUrl(card.image, lang, ver, quality);
                        const img = new Image();
                        img.crossOrigin = "Anonymous";
                        await new Promise((resolve, reject) => { img.onload = resolve;
                            img.onerror = reject;
                            img.src = imgUrl; });

                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(x + radius, y);
                        ctx.lineTo(x + cardW - radius, y);
                        ctx.quadraticCurveTo(x + cardW, y, x + cardW, y + radius);
                        ctx.lineTo(x + cardW, y + cardH - radius);
                        ctx.quadraticCurveTo(x + cardW, y + cardH, x + cardW - radius, y + cardH);
                        ctx.lineTo(x + radius, y + cardH);
                        ctx.quadraticCurveTo(x, y + cardH, x, y + cardH - radius);
                        ctx.lineTo(x, y + radius);
                        ctx.quadraticCurveTo(x, y, x + radius, y);
                        ctx.closePath();
                        ctx.clip();

                        if (cropTemplate) {
                            ctx.drawImage(img,
                                cropTemplate.left, cropTemplate.top, cropTemplate.width, cropTemplate.height,
                                x, y, cardW, cardH
                            );
                        } else {
                            ctx.drawImage(img, x, y, cardW, cardH);
                        }
                        ctx.restore();

                        // 数量标签：仅折叠模式下显示，且每张卡只显示一次
                        if (foldEnabled) {
                            const count = cardCountMap[card.cardId] || 0;
                            if (count > 1 && !drawnFoldSet.has(card.cardId)) {
                                drawTagWithArrow('×' + (count > 99 ? '99+' : count), x, y + 99, '#ffffff');
                                drawnFoldSet.add(card.cardId);
                            }
                        }

                        // 星标：非折叠时每张卡都显示，折叠时每张卡只显示一次
                        if (starredSet.has(card.cardId)) {
                            if (!foldEnabled || (foldEnabled && !drawnStarSet.has(card.cardId))) {
                                const starY = y + 99 + (foldEnabled ? 0 : 0); // 若折叠且数量标签存在，则星标在数量标签下方
                                // 如果折叠且已有数量标签，则星标下移
                                let offset = 0;
                                if (foldEnabled && drawnFoldSet.has(card.cardId)) {
                                    offset = 64; // 数量标签高度60 + 间距4
                                }
                                drawTagWithArrow('★', x, y + 99 + offset, '#ffd700');
                                if (foldEnabled) drawnStarSet.add(card.cardId);
                            }
                        }

                        cardIdx++;
                    } else if (addStatsCard && cardIdx === displayCards.length) {
                        await drawStatsCard(ctx, x, y, cardW, cardH, radius, statsTitle);
                        cardIdx++;
                    } else if (qrEnabled && cardIdx === displayCards.length + (addStatsCard ? 1 : 0)) {
                        const deckCode = exportDeckCode();
                        if (deckCode) {
                            await drawQrCard(ctx, x, y, cardW, cardH, radius, deckCode, qrTitle);
                        }
                        cardIdx++;
                    }
                }
            }

            return canvas;
        }

        let currentPreviewCanvas = null;

        async function updateImgPreview() {
            const cols = parseInt(document.getElementById('imgCols').value);
            const quality = parseInt(document.getElementById('imgQuality').value);
            const lang = document.getElementById('imgLang').value;
            const addStatsCard = document.getElementById('statsCardToggle').checked && !document.getElementById(
                'statsCardToggle').disabled;
            const foldEnabled = document.getElementById('foldToggle').checked;
            const qrEnabled = document.getElementById('qrToggle').checked;
            const statsTitle = document.getElementById('statsCardTitle').value.trim() || null;
            const qrTitle = document.getElementById('qrCardTitle').value.trim() || null;

            const bgSelect = document.getElementById('bgColorSelect');
            const bgCustom = document.getElementById('bgColorCustom');
            let bgColor = bgSelect.value;
            if (bgColor === 'custom') {
                bgColor = bgCustom.value;
            }

            if (!cropTemplate) {
                await generateCropTemplate();
            }

            const hqToggle = document.getElementById('headquarterToggle');
            const hqName = document.getElementById('headquarterNameInput').value.trim();
            let hqCard = null;
            if (hqToggle.checked && hqName) {
                hqCard = await fetchHeadquarterCard(hqName, lang);
                if (!hqCard) {
                    alert(`总部图片 "${hqName}" 不存在，请检查名称`);
                    return;
                }
            }

            const entries = Array.from(deckMap.entries());
            entries.sort((a, b) => {
                const cardA = a[1].card,
                    cardB = b[1].card;
                return (cardA._index || 0) - (cardB._index || 0);
            });
            const cardsWithVersion = [];
            if (hqCard) {
                cardsWithVersion.push({ card: hqCard, version: DEFAULT_VERSION });
            }
            for (let [cardId, entry] of entries) {
                const card = entry.card;
                let ver = cardVersionMap.get(card.cardId) || DEFAULT_VERSION;
                for (let i = 0; i < entry.count; i++) {
                    cardsWithVersion.push({ card, version: ver });
                }
            }

            if (cardsWithVersion.length === 0) {
                alert("卡组为空");
                return;
            }

            const previewDiv = document.getElementById('imgGenPreview');
            previewDiv.innerHTML = '<div style="color:#e9dbbd; padding:20px;">生成中...</div>';
            try {
                currentPreviewCanvas = await generateDeckImageWithOptions(cols, quality, lang, addStatsCard, bgColor,
                    cardsWithVersion, foldEnabled, qrEnabled, statsTitle, qrTitle);
                previewDiv.innerHTML = '';
                previewDiv.appendChild(currentPreviewCanvas);
            } catch (e) {
                previewDiv.innerHTML = `<div style="color:#ff8888;">生成失败: ${e.message}</div>`;
            }
        }

        async function showImgGenModal() {
            if (deckMap.size === 0) {
                const hqToggle = document.getElementById('headquarterToggle');
                if (!hqToggle.checked) {
                    alert("卡组为空");
                    return;
                }
                const hqName = document.getElementById('headquarterNameInput').value.trim();
                if (!hqName) {
                    alert("请输入总部名称");
                    return;
                }
            }
            const modal = document.getElementById('imgGenModal');
            modal.style.display = 'flex';
            updateCardVersionList();
            document.getElementById('generatePreviewBtn').onclick = updateImgPreview;
            document.getElementById('downloadImgBtn').onclick = () => {
                if (currentPreviewCanvas) {
                    const link = document.createElement('a');
                    link.download = `deck_${new Date().toISOString().slice(0,19)}.png`;
                    link.href = currentPreviewCanvas.toDataURL();
                    link.click();
                }
            };
            document.getElementById('closeImgModal').onclick = () => { modal.style.display = 'none'; };
            const qualitySlider = document.getElementById('imgQuality');
            const qualityVal = document.getElementById('qualityVal');
            qualitySlider.oninput = () => { qualityVal.innerText = qualitySlider.value; };
        }

        // ==================== 开关与输入框联动 ====================
        function setupSwitchInputs() {
            const hqToggle = document.getElementById('headquarterToggle');
            const hqInputDiv = document.getElementById('headquarterInputDiv');
            if (hqToggle && hqInputDiv) {
                hqToggle.addEventListener('change', function() {
                    hqInputDiv.classList.toggle('show', this.checked);
                });
                hqInputDiv.classList.toggle('show', hqToggle.checked);
            }

            const statsToggle = document.getElementById('statsCardToggle');
            const statsInputDiv = document.getElementById('statsCardInputDiv');
            if (statsToggle && statsInputDiv) {
                statsToggle.addEventListener('change', function() {
                    statsInputDiv.classList.toggle('show', this.checked);
                });
                statsInputDiv.classList.toggle('show', statsToggle.checked);
            }

            const qrToggle = document.getElementById('qrToggle');
            const qrInputDiv = document.getElementById('qrCardInputDiv');
            if (qrToggle && qrInputDiv) {
                qrToggle.addEventListener('change', function() {
                    qrInputDiv.classList.toggle('show', this.checked);
                });
                qrInputDiv.classList.toggle('show', qrToggle.checked);
            }
        }

        // ==================== 启动 ====================
        function initSidebars() {
            const toggle = document.getElementById('mobileDeckToggle');
            const panel = document.getElementById('mobileDeckPanel');
            const overlay = document.getElementById('mobileOverlay');
            const close = document.getElementById('mobileCloseDeck');
            toggle?.addEventListener('click', () => { panel.classList.add('open');
                overlay.classList.add('show'); });
            close?.addEventListener('click', () => { panel.classList.remove('open');
                overlay.classList.remove('show'); });
            overlay?.addEventListener('click', () => { panel.classList.remove('open');
                overlay.classList.remove('show'); });
            document.getElementById('mobileClearDeck')?.addEventListener('click', clearDeck);
            document.getElementById('statsBtn')?.addEventListener('click', showStatsModal);
            document.getElementById('mobileStatsBtn')?.addEventListener('click', showStatsModal);
            document.getElementById('statsModalClose')?.addEventListener('click', closeStatsModal);
            document.getElementById('statsModal')?.addEventListener('click', (e) => {
                if (e.target === document.getElementById('statsModal')) closeStatsModal();
            });
            document.getElementById('genImgBtn')?.addEventListener('click', showImgGenModal);
            document.getElementById('mobileGenImgBtn')?.addEventListener('click', showImgGenModal);
            setupQRImportExport();
            setupSwitchInputs();
        }

        function initNav() {
            const menuBtn = document.getElementById('menuToggleBtn');
            const menuDiv = document.getElementById('navMenu');
            menuBtn.onclick = (e) => { e.stopPropagation();
                menuDiv.classList.toggle('open'); };
            document.addEventListener('click', (e) => {
                if (!menuBtn.contains(e.target) && !menuDiv.contains(e.target)) menuDiv.classList.remove('open');
            });
            document.getElementById('clearDeckBtn')?.addEventListener('click', clearDeck);
        }

        function bindImportExportEvents() {
            document.getElementById('importBtn').onclick = () => {
                const code = document.getElementById('importCode').value.trim();
                if (code) importDeckFromCode(code);
                else alert('请输入卡组代码');
            };
            document.getElementById('mobileImportBtn').onclick = () => {
                const code = document.getElementById('mobileImportCode').value.trim();
                if (code) importDeckFromCode(code);
                else alert('请输入卡组代码');
            };
            document.getElementById('exportBtn').onclick = exportAndCopy;
            document.getElementById('mobileExportBtn').onclick = exportAndCopy;
        }

        window.addEventListener('load', () => {
            loadData();
            initNav();
            initSidebars();
            bindImportExportEvents();
        });
    </script>
