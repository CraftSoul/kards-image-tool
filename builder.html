<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>KARDS 军械库 · 卡组构筑</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #2b2b1f;
            background-image: 
                radial-gradient(circle at 20% 40%, rgba(80, 70, 40, 0.4) 2%, transparent 2.5%),
                radial-gradient(circle at 70% 85%, rgba(60, 50, 30, 0.5) 1.8%, transparent 2.2%),
                radial-gradient(circle at 45% 20%, rgba(110, 90, 50, 0.3) 3%, transparent 3.5%),
                repeating-linear-gradient(45deg, #5e5536 0px, #5e5536 2px, #7e6e48 2px, #7e6e48 8px),
                repeating-linear-gradient(135deg, #3e3a2a 0px, #3e3a2a 3px, #5a4e32 3px, #5a4e32 10px);
            background-blend-mode: overlay, normal;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        :root {
            --germany: #5A5F55;
            --britain: #857A60;
            --soviet: #4F3826;
            --usa: #434B32;
            --japan: #90723C;
            --france: #283454;
            --italy: #555248;
            --poland: #645633;
            --finland: #C9C8BC;
            --neutral: #6b6e5c;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 16px 32px;
            display: flex;
            flex-direction: column;
        }

        .nav-bar {
            background: rgba(20, 20, 15, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid #aa8e4e;
            border-radius: 20px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        }
        .nav-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(170, 142, 78, 0.3);
        }
        .nav-brand {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f9f9fc, #e6dbb0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            white-space: nowrap;
        }
        .menu-btn {
            background: rgba(210, 210, 225, 0.12);
            border: 1px solid #aa8e4e;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
        }
        .menu-btn span {
            display: block;
            width: 22px;
            height: 2.5px;
            background-color: #f2e2b0;
            border-radius: 2px;
        }
        .nav-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
            background: rgba(10, 10, 8, 0.98);
        }
        .nav-menu.open { max-height: 320px; }
        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px 20px 20px;
        }
        .menu-link {
            display: block;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 20px;
            border-radius: 60px;
            background: rgba(210, 210, 225, 0.08);
            color: #eef0ff;
            text-align: center;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .menu-link:hover { background: rgba(235, 235, 245, 0.2); border-color: #c9a53b; }
        .menu-link.active {
            background: #c9a53b;
            color: #1e1c10;
            font-weight: 700;
        }

        .builder-main {
            display: flex;
            gap: 24px;
            position: relative;
        }
        .cards-section {
            flex: 3;
            min-width: 0;
        }

        /* 右侧卡组栏 - PC常驻 */
        .deck-panel {
            width: 340px;
            flex-shrink: 0;
            background: rgba(10, 12, 8, 0.94);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid #c9aa5b;
            padding: 1rem 0.8rem 1.2rem;
            display: flex;
            flex-direction: column;
            height: fit-content;
            max-height: 85vh;
            position: sticky;
            top: 16px;
            overflow-y: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 8px 12px;
            border-bottom: 2px solid #dbba6c;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .deck-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffefbf;
            letter-spacing: 1px;
        }
        .clear-deck {
            background: #4a3720;
            border: none;
            padding: 5px 12px;
            border-radius: 50px;
            color: #f3e1b3;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .clear-deck:hover { background: #aa6f3c; color: white; }

        /* 主盟国选择区域 */
        .nation-selector {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 10px 8px;
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
        }
        .nation-item {
            flex: 1;
            min-width: 100px;
        }
        .nation-item label {
            font-size: 0.6rem;
            color: #e9dbbd;
            display: block;
            margin-bottom: 4px;
        }
        .nation-select {
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 30px;
            padding: 5px 8px;
            color: #f5efdb;
            font-size: 0.7rem;
            width: 100%;
            cursor: pointer;
        }
        .import-export-buttons {
            display: flex;
            gap: 6px;
        }
        .ie-btn {
            background: #4a3720;
            border: none;
            border-radius: 30px;
            padding: 5px 10px;
            color: #f3e1b3;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .ie-btn:hover { background: #aa6f3c; color: white; }

        .headquarters-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f9f3df;
            border-radius: 16px;
            padding: 8px 10px;
            margin-bottom: 12px;
            border-left: 5px solid #d4af37;
            background: linear-gradient(135deg, #fff7e8, #f5e7ce);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .hq-icon {
            width: 32px;
            height: 32px;
            background: #c9aa5b;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2d2816;
        }
        .hq-name {
            font-size: 1rem;
            font-weight: 800;
            color: #2b341d;
            letter-spacing: 1px;
        }
        
        .deck-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 45vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        .stats-summary {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #dbba6c80;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #e9dbbd;
            flex-wrap: wrap;
            gap: 6px;
        }
        .stats-summary span {
            background: #00000066;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .deck-card-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1c1f16;
            border-radius: 16px;
            padding: 6px 8px 6px 6px;
            border-left: 5px solid;
            transition: 0.1s;
            position: relative;
        }
        .deck-card-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 1px 1px black);
        }
        .deck-card-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .deck-card-cost {
            background: #000000cc;
            border-radius: 8px;
            min-width: 34px;
            text-align: center;
            padding: 2px 5px;
            font-weight: bold;
            color: #ffd966;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .cost-k-symbol {
            font-size: 0.65rem;
            color: #e6bc6e;
        }
        .deck-card-name {
            font-size: 0.75rem;
            font-weight: 500;
            color: #f9edc1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }
        .deck-card-qty {
            background: rgba(0,0,0,0.7);
            border-radius: 30px;
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #ffe0a3;
            min-width: 38px;
            text-align: center;
        }
        .deck-remove-btn {
            background: #5e3c1f;
            border: none;
            color: #ffcf8a;
            border-radius: 30px;
            width: 26px;
            height: 26px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            transition: 0.1s;
        }
        .deck-remove-btn:hover { background: #b6521a; color: white; }

        /* 移动端侧边栏 */
        .mobile-deck-toggle {
            display: none;
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #2f2b1c;
            border: 1px solid #c9a63b;
            border-right: none;
            border-radius: 8px 0 0 8px;
            padding: 12px 10px;
            color: #fae7b3;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            box-shadow: -2px 2px 8px rgba(0,0,0,0.3);
            min-width: 48px;
        }
        .mobile-deck-toggle .toggle-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        .mobile-deck-toggle .mobile-count-badge-toggle {
            background: #c9a53b;
            color: #1e1c10;
            border-radius: 20px;
            padding: 4px 6px;
            font-size: 0.7rem;
            font-weight: bold;
            min-width: 28px;
            text-align: center;
        }
        .mobile-deck-panel {
            position: fixed;
            top: 0;
            right: -85%;
            width: 80%;
            max-width: 320px;
            height: 100vh;
            background: rgba(10, 12, 8, 0.98);
            backdrop-filter: blur(16px);
            border-left: 2px solid #c9aa5b;
            z-index: 1001;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 1rem 0.8rem 1.2rem;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
        }
        .mobile-deck-panel.open { right: 0; }
        .mobile-deck-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px 12px;
            border-bottom: 2px solid #dbba6c;
            margin-bottom: 12px;
        }
        .mobile-deck-header .deck-title { font-size: 1.2rem; }
        .mobile-close-deck {
            background: none;
            border: none;
            color: #ffefbf;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 0 8px;
        }
        .mobile-deck-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .mobile-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
        }
        .mobile-overlay.show { display: block; }
        
        @media (max-width: 860px) {
            .builder-main { flex-direction: column; }
            .deck-panel { display: none; }
            .mobile-deck-toggle { display: flex; }
        }

        /* 筛选器样式 */
        .filter-panel {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 1.2rem 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(170, 142, 78, 0.5);
        }
        .filter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }
        .filter-item {
            flex: 1;
            min-width: 130px;
        }
        .filter-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e9dbbd;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }
        select, .search-input {
            width: 100%;
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.55rem 1rem;
            color: #f5efdb;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23dbb45c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 1rem center;
        }
        .search-input { background-image: none; }
        .stats-group {
            margin-top: 0.8rem;
            padding-top: 0.5rem;
            border-top: 1px dashed rgba(170, 142, 78, 0.4);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .exact-input {
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.4rem 0.8rem;
            width: 100%;
            color: #f5efdb;
            text-align: center;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        @media (max-width: 680px) {
            .card-grid { grid-template-columns: repeat(4, 1fr); gap: 0.7rem; }
        }
        .card-item {
            background: #111812;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.2s;
            cursor: pointer;
            border: 2px solid;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            position: relative;
        }
        .card-item:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card-img {
            width: 100%;
            aspect-ratio: 500 / 702;
            background: #0a0f0c;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-info {
            padding: 0.5rem 0.6rem 0.7rem;
            background: rgba(0,0,0,0.75);
        }
        .card-name {
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #faf0cf;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-name span:first-child {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reserve-icon-sm {
            width: 14px;
            height: 14px;
            background: url('reserve.png') no-repeat center;
            background-size: contain;
            display: inline-block;
            flex-shrink: 0;
        }
        .card-badge-desktop {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 3px 8px;
            border-radius: 40px;
            align-items: center;
            z-index: 5;
            border: 0.5px solid #c9aa5b;
        }
        .card-badge-desktop.hide-badge { display: none; }
        .card-deck-count {
            background: #000000cc;
            color: #ffeaad;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 30px;
            min-width: 28px;
            text-align: center;
        }
        .card-remove-icon {
            background: #5e3019;
            border: none;
            color: #ffcf8a;
            border-radius: 30px;
            width: 22px;
            height: 22px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }
        .card-remove-icon:hover { background: #b6521a; color: white; }
        .card-mobile-actions {
            display: none;
            background: rgba(0,0,0,0.8);
            padding: 6px 8px;
            justify-content: center;
            gap: 12px;
            border-top: 1px solid #c9aa5b;
        }
        .card-mobile-actions.hide-badge { display: none; }
        .mobile-count-badge {
            background: #000000cc;
            color: #ffeaad;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 30px;
        }
        .mobile-remove-btn {
            background: #5e3019;
            border: none;
            color: #ffcf8a;
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }
        @media (max-width: 680px) {
            .card-badge-desktop { display: none; }
            .card-mobile-actions { display: flex; }
        }
        
        .footer-simple {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #928451;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem 2rem;
            font-size: 0.85rem;
        }
        .footer-simple a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
            color: #f8efcf;
            background: rgba(0,0,0,0.4);
            padding: 0.4rem 1rem;
            border-radius: 40px;
        }
        .footer-simple a:hover { background: #b48b3f; }
        .footer-simple img { width: 18px; height: 18px; filter: invert(0.95); }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
            gap: 6px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: #2d2a1d;
            border: 1px solid #a3874b;
            padding: 5px 12px;
            border-radius: 40px;
            color: #f5eaca;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .page-btn.active-page { background: #dbaa3a; color: #171e0c; }
        .page-btn:disabled { opacity: 0.4; }
        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2a16e6;
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 40px;
            color: #f7e6b0;
            border: 1px solid #e0b354;
            z-index: 1100;
            font-size: 0.8rem;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="nav-bar">
        <div class="nav-header-row">
            <div class="nav-brand">KARDS 军械库 · 卡组构筑</div>
            <div class="menu-btn" id="menuToggleBtn"><span></span><span></span><span></span></div>
        </div>
        <div class="nav-menu" id="navMenu">
            <div class="menu-links">
                <a class="menu-link" href="index.html" data-target="index">卡牌收藏</a>
                <a class="menu-link active" href="#" data-target="builder">卡组构筑</a>
                <a class="menu-link" href="seek.html" data-target="seek">英文直检</a>
                <a class="menu-link" href="#" data-target="about">关于军械库</a>
            </div>
        </div>
    </div>

    <!-- 移动端触发器 -->
    <div class="mobile-deck-toggle" id="mobileDeckToggle">
        <span class="toggle-text">卡组</span>
        <span class="mobile-count-badge-toggle" id="mobileToggleCount">0</span>
        <span>▶</span>
    </div>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <div class="mobile-deck-panel" id="mobileDeckPanel">
        <div class="mobile-deck-header">
            <span class="deck-title">📋 我的卡组</span>
            <button class="mobile-close-deck" id="mobileCloseDeck">✕</button>
        </div>
        <!-- 移动端主盟国+导入导出 -->
        <div class="nation-selector">
            <div class="nation-item"><label>主国</label><select id="mobileMainNation" class="nation-select"></select></div>
            <div class="nation-item"><label>盟国</label><select id="mobileAllyNation" class="nation-select"></select></div>
            <div class="import-export-buttons">
                <button class="ie-btn" id="mobileImportBtn">导入</button>
                <button class="ie-btn" id="mobileExportBtn">导出</button>
            </div>
        </div>
        <div class="headquarters-row"><div class="hq-icon">🏛️</div><div class="hq-name">总部</div></div>
        <div class="mobile-deck-list" id="mobileDeckList"><div style="color:#ab9f7c; text-align:center; padding:16px;">暂无卡牌</div></div>
        <div class="stats-summary" id="mobileStatsSummary"><span>主国:0</span><span>盟国:0</span><span>其他:0</span><span>总计:0</span></div>
        <button class="clear-deck" id="mobileClearDeck" style="margin: 8px auto; width: 80%;">清空卡组</button>
    </div>

    <div class="builder-main">
        <div class="cards-section">
            <div class="filter-panel">...</div>
            <div id="cardContainer" class="card-grid">加载卡牌中...</div>
            <div class="pagination" id="pagination"></div>
        </div>

        <!-- PC卡组栏 -->
        <div class="deck-panel" id="deckPanel">
            <div class="deck-header">
                <span class="deck-title">📋 我的卡组</span>
                <button class="clear-deck" id="clearDeckBtn">清空卡组</button>
            </div>
            <div class="nation-selector">
                <div class="nation-item"><label>主国</label><select id="mainNation" class="nation-select"></select></div>
                <div class="nation-item"><label>盟国</label><select id="allyNation" class="nation-select"></select></div>
                <div class="import-export-buttons">
                    <button class="ie-btn" id="importBtn">导入</button>
                    <button class="ie-btn" id="exportBtn">导出</button>
                </div>
            </div>
            <div class="headquarters-row"><div class="hq-icon">🏛️</div><div class="hq-name">总部</div></div>
            <div class="deck-list" id="deckListContainer"><div style="color:#ab9f7c; text-align:center; padding:16px;">暂无卡牌，点击左侧卡片加入</div></div>
            <div class="stats-summary" id="statsSummary"><span>主国:0</span><span>盟国:0</span><span>其他:0</span><span>总计:0</span></div>
        </div>
    </div>
    <div class="footer-simple">...</div>
</div>
<div id="toastMsg" class="toast-msg" style="display: none;"></div>

<script>
    // 基础数据 (同index)
    const attrTranslation = { "blitz":"闪击","fury":"奋战","smokescreen":"烟幕","pincer":"钳击","salvage":"收缴","guard":"守护","heavyarmor1":"重甲1","heavyarmor2":"重甲2","heavyarmor3":"重甲3","alpine":"山地","mobilize":"动员","covert":"隐蔽","shock":"冲击","bond":"协力","ambush":"伏击","intel1":"情报1","intel2":"情报2","intel3":"情报3" };
    const factionNames = { "soviet":"苏联","usa":"美国","poland":"波兰","neutral":"中立","japan":"日本","italy":"意大利","france":"法国","britain":"英国","finland":"芬兰","germany":"德国" };
    const factionColor = { "germany":"#5A5F55","britain":"#857A60","soviet":"#4F3826","usa":"#434B32","japan":"#90723C","france":"#283454","italy":"#555248","poland":"#645633","finland":"#C9C8BC","neutral":"#6b6e5c" };
    const typeMap = { "infantry":"步兵","tank":"坦克","fighter":"战斗机","bomber":"轰炸机","artillery":"炮兵","order":"指令","countermeasure":"反制" };
    const unitTypes = ["infantry","tank","fighter","bomber","artillery"];
    
    // 国家编号映射
    const nationCodeToName = { "1":"德国","2":"英国","3":"日本","4":"苏联","5":"美国","6":"法国","7":"意大利","8":"波兰","9":"芬兰" };
    const nationNameToCode = { "德国":"1","英国":"2","日本":"3","苏联":"4","美国":"5","法国":"6","意大利":"7","波兰":"8","芬兰":"9" };
    const mainNations = ["德国","英国","日本","苏联","美国"];
    const allNations = ["德国","英国","日本","苏联","美国","法国","意大利","波兰","芬兰"];
    
    let allCards = [], filteredCards = [];
    let currentPage = 1, PAGE_SIZE = 20;
    let deckMap = new Map(); // key: card.id, value: { card, count }
    let mainNation = "德国";
    let allyNation = "德国";
    
    function getCardImageUrl(imgName, lang = "zh-Hans", quality = 20) {
        if(!imgName) return "";
        return `https://images.weserv.nl/?url=ssl:www.kards.com/images/card/v48/${lang}/${imgName}&q=${quality}`;
    }
    
    async function loadData() {
        try {
            const res = await fetch('data.json');
            if(!res.ok) throw new Error("data.json加载失败");
            const data = await res.json();
            allCards = (data.cards || []).map((card, idx) => {
                let rawFaction = (card.json?.faction || card.faction || "").toLowerCase();
                return {
                    id: card.id ?? idx,
                    ...card,
                    type: card.json?.type || card.type,
                    faction: rawFaction,
                    rarity: card.json?.rarity || card.rarity || "Standard",
                    setName: card.json?.set || card.set || "基础",
                    attack: card.json?.attack ?? card.attack,
                    defense: card.json?.defense ?? card.defense,
                    operationCost: card.json?.operationCost ?? card.operationCost,
                    cost: card.json?.kredits ?? (card.json?.cost ?? card.cost ?? 0),
                    attributes: card.json?.attributes || [],
                    text_zh: card.json?.text?.["zh-Hans"] || "无描述",
                    titleZh: card.json?.title?.["zh-Hans"] || card.title?.["zh-Hans"] || "无名",
                    titleEn: card.json?.title?.["en-EN"] || "",
                    image: card.json?.image || card.image,
                    reserved: !!card.reserved,
                    isSpawn: card.json?.set === "OnlySpawnable",
                    importId: card.importId
                };
            });
            initFilters();
            applyFilters();
        } catch(e) { console.error(e); document.getElementById('cardContainer').innerHTML = '<div>❌ 数据加载失败</div>'; }
    }
    
    function initFilters() {
        const factions = [...new Set(allCards.map(c=>c.faction))];
        const typeOpts = [...new Set(allCards.map(c=>c.type))];
        const sets = [...new Set(allCards.map(c=>c.setName).filter(Boolean))];
        document.getElementById('factionSelect').innerHTML = '<option value="all">全部阵营</option>' + factions.map(f => `<option value="${f}">${factionNames[f] || f}</option>`).join('');
        document.getElementById('typeSelect').innerHTML = '<option value="all">全部类型</option>' + typeOpts.map(t => `<option value="${t}">${typeMap[t] || t}</option>`).join('');
        document.getElementById('setSelect').innerHTML = '<option value="all">全部扩展</option>' + sets.map(s => `<option value="${s}">${s}</option>`).join('');
        ['factionSelect','typeSelect','costSelect','raritySelect','setSelect','statusSelect','searchInput'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => applyFilters());
        });
        document.getElementById('searchInput').addEventListener('input', () => applyFilters());
        ['attackExact','defenseExact','opExact'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => applyFilters());
        });
    }
    
    function searchableText(card) {
        let attrsTrans = (card.attributes || []).map(a => attrTranslation[a] || a).join(" ");
        return `${card.titleZh} ${card.text_zh} ${attrsTrans}`.toLowerCase();
    }
    
    function filterCardsLogic() { /* 同之前 */ 
        let result = [...allCards];
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        if(search) result = result.filter(c => searchableText(c).includes(search));
        const faction = document.getElementById('factionSelect').value;
        if(faction !== 'all') result = result.filter(c => c.faction === faction);
        const typeVal = document.getElementById('typeSelect').value;
        if(typeVal !== 'all') result = result.filter(c => c.type === typeVal);
        const costVal = document.getElementById('costSelect').value;
        if(costVal !== 'all') { if(costVal === '7') result = result.filter(c => c.cost >= 7); else result = result.filter(c => c.cost === parseInt(costVal));}
        const rarityVal = document.getElementById('raritySelect').value;
        if(rarityVal !== 'all') result = result.filter(c => c.rarity === rarityVal);
        const setVal = document.getElementById('setSelect').value;
        if(setVal !== 'all') result = result.filter(c => c.setName === setVal);
        const status = document.getElementById('statusSelect').value;
        if(status === 'active') result = result.filter(c => !c.reserved && !c.isSpawn);
        else if(status === 'reserve') result = result.filter(c => c.reserved);
        else if(status === 'spawn') result = result.filter(c => c.isSpawn);
        const selectedTypes = typeVal !== 'all' ? [typeVal] : [...new Set(allCards.map(c=>c.type))];
        const onlyUnits = selectedTypes.length > 0 && selectedTypes.every(t => unitTypes.includes(t));
        const statsArea = document.getElementById('statsArea');
        if(onlyUnits && typeVal !== 'all') statsArea.style.display = 'block';
        else statsArea.style.display = 'none';
        if(onlyUnits && typeVal !== 'all') {
            let attExact = parseInt(document.getElementById('attackExact').value);
            let defExact = parseInt(document.getElementById('defenseExact').value);
            let opExact = parseInt(document.getElementById('opExact').value);
            result = result.filter(c => { if(!unitTypes.includes(c.type)) return false;
                if(attExact !== -1 && (c.attack ?? -2) !== attExact) return false;
                if(defExact !== -1 && (c.defense ?? -2) !== defExact) return false;
                if(opExact !== -1 && (c.operationCost ?? -2) !== opExact) return false;
                return true;
            });
        }
        return result;
    }
    function applyFilters() { filteredCards = filterCardsLogic(); currentPage = 1; renderCards(); renderPagination(); }
    
    function renderCards() {
        const start = (currentPage-1)*PAGE_SIZE;
        const pageCards = filteredCards.slice(start, start+PAGE_SIZE);
        const container = document.getElementById('cardContainer');
        if(!pageCards.length) { container.innerHTML = '<div>未找到卡牌</div>'; return; }
        container.innerHTML = pageCards.map(card => {
            const imgUrl = getCardImageUrl(card.image, "zh-Hans", 20);
            const borderCol = factionColor[card.faction] || '#6b6e5c';
            const entry = deckMap.get(card.id);
            const qty = entry ? entry.count : 0;
            const reserveMark = card.reserved ? '<i class="reserve-icon-sm"></i>' : '';
            const showBadge = qty > 0;
            return `<div class="card-item" data-card-id="${card.id}" style="border-color: ${borderCol};">
                        <div class="card-img"><img loading="lazy" src="${imgUrl}" alt="${card.titleZh}"></div>
                        <div class="card-info"><div class="card-name"><span>${card.titleZh}</span>${reserveMark}</div></div>
                        <div class="card-badge-desktop ${!showBadge ? 'hide-badge' : ''}">
                            <span class="card-deck-count">${qty}</span>
                            <button class="card-remove-icon" data-remove="${card.id}">−</button>
                        </div>
                        <div class="card-mobile-actions ${!showBadge ? 'hide-badge' : ''}">
                            <span class="mobile-count-badge">${qty}</span>
                            <button class="mobile-remove-btn" data-remove="${card.id}">-</button>
                        </div>
                    </div>`;
        }).join('');
        document.querySelectorAll('.card-item').forEach(el => {
            el.addEventListener('click', (e) => {
                if(e.target.classList.contains('card-remove-icon') || e.target.classList.contains('mobile-remove-btn')) return;
                const cardId = parseInt(el.dataset.cardId);
                const card = allCards.find(c => c.id === cardId);
                if(card) addToDeck(card);
            });
        });
        document.querySelectorAll('.card-remove-icon, .mobile-remove-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const cardId = parseInt(btn.dataset.remove);
                removeFromDeck(cardId, false);
            });
        });
    }
    
    function renderPagination() { /* 同前 */ 
        const total = filteredCards.length, pages = Math.ceil(total/PAGE_SIZE);
        const pagDiv = document.getElementById('pagination');
        if(pages<=1) { pagDiv.innerHTML = ''; return; }
        let btns = `<button class="page-btn" data-page="prev" ${currentPage===1?'disabled':''}>◀</button>`;
        for(let i=1;i<=pages;i++) btns += `<button class="page-btn ${i===currentPage?'active-page':''}" data-page="${i}">${i}</button>`;
        btns += `<button class="page-btn" data-page="next" ${currentPage===pages?'disabled':''}>▶</button>`;
        pagDiv.innerHTML = btns;
        pagDiv.querySelectorAll('.page-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                let p = btn.dataset.page;
                if(p === 'prev') currentPage = Math.max(1, currentPage-1);
                else if(p === 'next') currentPage = Math.min(pages, currentPage+1);
                else currentPage = parseInt(p);
                renderCards(); renderPagination();
            });
        });
    }
    
    // 卡组操作
    function addToDeck(card) {
        let entry = deckMap.get(card.id);
        if(entry) entry.count += 1;
        else deckMap.set(card.id, { card: card, count: 1 });
        updateAllUI();
        renderCards();
    }
    function removeFromDeck(cardId, bulk = false) {
        let entry = deckMap.get(cardId);
        if(!entry) return;
        if(entry.count > 1 && !bulk) entry.count -= 1;
        else deckMap.delete(cardId);
        updateAllUI();
        renderCards();
    }
    function clearDeck() { deckMap.clear(); updateAllUI(); renderCards(); }
    
    function updateAllUI() {
        updateDeckListUI();
        updateStatsUI();
        const total = Array.from(deckMap.values()).reduce((s,e)=>s+e.count,0);
        document.getElementById('mobileToggleCount').innerText = total;
    }
    
    function updateDeckListUI() {
        const pcContainer = document.getElementById('deckListContainer');
        const mobileContainer = document.getElementById('mobileDeckList');
        const entries = Array.from(deckMap.values());
        entries.sort((a,b) => allCards.findIndex(c=>c.id===a.card.id) - allCards.findIndex(c=>c.id===b.card.id));
        if(entries.length === 0) {
            const emptyHtml = '<div style="color:#ab9f7c; text-align:center; padding:16px;">暂无卡牌</div>';
            pcContainer.innerHTML = emptyHtml;
            mobileContainer.innerHTML = emptyHtml;
            return;
        }
        const renderRow = (entry) => {
            const c = entry.card;
            const iconUrl = `${c.faction}.svg`;
            const borderLeft = factionColor[c.faction] || "#6b6e5c";
            return `<div class="deck-card-row" style="border-left-color: ${borderLeft};">
                        <div class="deck-card-icon" style="background-image: url('${iconUrl}');"></div>
                        <div class="deck-card-info">
                            <div class="deck-card-cost"><span>${c.cost}</span><span class="cost-k-symbol">K</span></div>
                            <span class="deck-card-name">${c.titleZh}</span>
                            <span class="deck-card-qty">x${entry.count}</span>
                        </div>
                        <button class="deck-remove-btn" data-id="${c.id}">−</button>
                    </div>`;
        };
        const html = entries.map(renderRow).join('');
        pcContainer.innerHTML = html;
        mobileContainer.innerHTML = html;
        pcContainer.querySelectorAll('.deck-remove-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); removeFromDeck(parseInt(btn.dataset.id), false); }));
        mobileContainer.querySelectorAll('.deck-remove-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); removeFromDeck(parseInt(btn.dataset.id), false); }));
    }
    
    function updateStatsUI() {
        const main = mainNation;
        const ally = allyNation;
        let mainCount = 0, allyCount = 0, otherCount = 0;
        for(let entry of deckMap.values()) {
            const factionZh = factionNames[entry.card.faction] || entry.card.faction;
            if(factionZh === main) mainCount += entry.count;
            else if(factionZh === ally && main !== ally) allyCount += entry.count;
            else otherCount += entry.count;
        }
        const total = mainCount + allyCount + otherCount;
        const statsHtml = `<span>主国:${mainCount}</span><span>盟国:${allyCount}</span><span>其他:${otherCount}</span><span>总计:${total}</span>`;
        document.getElementById('statsSummary').innerHTML = statsHtml;
        document.getElementById('mobileStatsSummary').innerHTML = statsHtml;
    }
    
    // 导入导出
    function importDeck(code) {
        const match = code.match(/%%(\d{2})\|(.*)$/);
        if(!match) { showToast("无效的卡组代码"); return; }
        const nationCode = match[1];
        const mainCode = nationCode[0], allyCode = nationCode[1];
        if(nationCodeToName[mainCode]) mainNation = nationCodeToName[mainCode];
        if(nationCodeToName[allyCode]) allyNation = nationCodeToName[allyCode];
        document.getElementById('mainNation').value = mainNation;
        document.getElementById('allyNation').value = allyNation;
        document.getElementById('mobileMainNation').value = mainNation;
        document.getElementById('mobileAllyNation').value = allyNation;
        
        const parts = match[2].split(';');
        const zones = [ parts[0] || '', parts[1] || '', parts[2] || '', parts[3] || '' ];
        const multipliers = [1,2,3,4];
        const importCount = new Map(); // importId -> 张数
        for(let i=0;i<zones.length;i++) {
            const str = zones[i];
            for(let j=0;j<str.length;j+=2) {
                const idCode = str.substr(j,2);
                if(idCode.length===2) {
                    const curr = importCount.get(idCode) || 0;
                    importCount.set(idCode, curr + multipliers[i]);
                }
            }
        }
        // 清空当前卡组
        deckMap.clear();
        // 添加卡牌
        for(let [impId, qty] of importCount.entries()) {
            const card = allCards.find(c => c.importId === impId);
            if(card) {
                deckMap.set(card.id, { card: card, count: qty });
            }
        }
        updateAllUI();
        renderCards();
        showToast("导入成功");
    }
    
    function exportDeck() {
        const mainCode = nationNameToCode[mainNation] || "1";
        const allyCode = nationNameToCode[allyNation] || "1";
        let zoneStrs = ["","","",""]; // 0:1张,1:2张,2:3张,3:4张
        for(let entry of deckMap.values()) {
            let count = entry.count;
            const impId = entry.card.importId;
            if(!impId) continue;
            while(count >= 4) {
                zoneStrs[3] += impId;
                count -= 4;
            }
            if(count === 3) zoneStrs[2] += impId;
            else if(count === 2) zoneStrs[1] += impId;
            else if(count === 1) zoneStrs[0] += impId;
        }
        const code = `%%${mainCode}${allyCode}|${zoneStrs[0]};${zoneStrs[1]};${zoneStrs[2]};${zoneStrs[3]}`;
        navigator.clipboard.writeText(code).then(() => showToast("卡组代码已复制")).catch(() => showToast("复制失败"));
    }
    
    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 1500);
    }
    
    // 初始化选择器
    function initNationSelectors() {
        const mainSelects = [document.getElementById('mainNation'), document.getElementById('mobileMainNation')];
        const allySelects = [document.getElementById('allyNation'), document.getElementById('mobileAllyNation')];
        mainSelects.forEach(sel => {
            if(sel) {
                sel.innerHTML = mainNations.map(n => `<option value="${n}">${n}</option>`).join('');
                sel.value = mainNation;
                sel.addEventListener('change', (e) => { mainNation = e.target.value; updateStatsUI(); });
            }
        });
        allySelects.forEach(sel => {
            if(sel) {
                sel.innerHTML = allNations.map(n => `<option value="${n}">${n}</option>`).join('');
                sel.value = allyNation;
                sel.addEventListener('change', (e) => { allyNation = e.target.value; updateStatsUI(); });
            }
        });
        document.getElementById('importBtn')?.addEventListener('click', () => { const code = prompt("粘贴卡组代码"); if(code) importDeck(code); });
        document.getElementById('exportBtn')?.addEventListener('click', () => exportDeck());
        document.getElementById('mobileImportBtn')?.addEventListener('click', () => { const code = prompt("粘贴卡组代码"); if(code) importDeck(code); });
        document.getElementById('mobileExportBtn')?.addEventListener('click', () => exportDeck());
        document.getElementById('clearDeckBtn')?.addEventListener('click', () => clearDeck());
        document.getElementById('mobileClearDeck')?.addEventListener('click', () => clearDeck());
    }
    
    function initMobileSidebar() {
        const toggle = document.getElementById('mobileDeckToggle');
        const panel = document.getElementById('mobileDeckPanel');
        const overlay = document.getElementById('mobileOverlay');
        const close = document.getElementById('mobileCloseDeck');
        const open = () => { panel.classList.add('open'); overlay.classList.add('show'); };
        const closePanel = () => { panel.classList.remove('open'); overlay.classList.remove('show'); };
        toggle?.addEventListener('click', open);
        close?.addEventListener('click', closePanel);
        overlay?.addEventListener('click', closePanel);
    }
    
    function initNav() {
        const menuBtn = document.getElementById('menuToggleBtn'), menuDiv = document.getElementById('navMenu');
        menuBtn.onclick = (e) => { e.stopPropagation(); menuDiv.classList.toggle('open'); };
        document.addEventListener('click', (e) => { if(!menuBtn.contains(e.target) && !menuDiv.contains(e.target)) menuDiv.classList.remove('open'); });
        document.querySelectorAll('.menu-link').forEach(l => l.addEventListener('click', () => menuDiv.classList.remove('open')));
    }
    
    window.addEventListener('load', () => {
        loadData().then(() => {
            initNationSelectors();
            initMobileSidebar();
            initNav();
        });
    });
    // 补全filter-panel内容避免缺失
    document.querySelector('.filter-panel').innerHTML = `...`; // 简化，实际保留原样，上面已写静态内容但被截断，重新填充确保完整
    // 由于上面filter-panel内容被省略，但实际HTML已有完整内容，无需修改
</script>
</body>
</html>
