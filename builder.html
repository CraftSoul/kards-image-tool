<body>

<script>
    // 阵营编号映射 1~9: 德英日苏美法意波芬
    const nationIdMap = { "germany":1, "britain":2, "japan":3, "soviet":4, "usa":5, "france":6, "italy":7, "poland":8, "finland":9 };
    const idToNation = {1:"germany",2:"britain",3:"japan",4:"soviet",5:"usa",6:"france",7:"italy",8:"poland",9:"finland"};
    const factionDisplay = { "germany":"德国","britain":"英国","japan":"日本","soviet":"苏联","usa":"美国","france":"法国","italy":"意大利","poland":"波兰","finland":"芬兰" };
    
    let allCards = [], filteredCards = [], deckMap = new Map();
    let currentPage = 1, PAGE_SIZE = 20;
    let mainNation = "germany", allyNation = "germany";
    
    function getCardImageUrl(imgName, lang = "zh-Hans", quality = 20) { ... }
    async function loadData() { ... }
    function initFilters() { ... }
    function applyFilters() { ... }
    function renderCards() { ... }
    function renderPagination() { ... }
    
    // 核心: 导入导出
    function exportDeckCode() {
        const mainId = nationIdMap[mainNation] || 1;
        const allyId = nationIdMap[allyNation] || 1;
        const codePrefix = `%%${mainId}${allyId}|`;
        // 收集卡牌: 按id顺序排序后，生成三个区域: 1张区,2张区,3张区,4+张区
        const entries = Array.from(deckMap.values());
        entries.sort((a,b) => (a.card.id - b.card.id));
        const area1 = [], area2 = [], area3 = [], area4 = [];
        for (let e of entries) {
            const imp = e.card.importId;
            if (!imp) continue;
            let cnt = e.count;
            while (cnt >= 4) { area4.push(imp); cnt -= 4; }
            if (cnt === 3) area3.push(imp);
            else if (cnt === 2) area2.push(imp);
            else if (cnt === 1) area1.push(imp);
        }
        const code = codePrefix + area1.join('') + ";" + area2.join('') + ";" + area3.join('') + ";" + area4.join('');
        navigator.clipboard.writeText(code);
        showToast("卡组代码已复制");
    }
    
    function importDeckCode(inputCode) {
        let raw = inputCode.trim();
        const idx = raw.indexOf("%%");
        if (idx !== -1) raw = raw.substring(idx);
        if (!raw.startsWith("%%")) { showToast("无效卡组代码格式"); return false; }
        const pipeIdx = raw.indexOf("|");
        if (pipeIdx === -1) { showToast("无效卡组代码"); return false; }
        const nationPart = raw.substring(2, pipeIdx);
        if (nationPart.length < 2) { showToast("无效阵营标识"); return false; }
        const mainDigit = parseInt(nationPart[0]);
        const allyDigit = parseInt(nationPart[1]);
        if (!idToNation[mainDigit] || !idToNation[allyDigit]) { showToast("未知阵营编号"); return false; }
        const afterPipe = raw.substring(pipeIdx+1);
        const parts = afterPipe.split(";");
        const area1 = parts[0] || "";
        const area2 = parts[1] || "";
        const area3 = parts[2] || "";
        const area4 = parts[3] || "";
        // 构建importId -> 数量映射
        const countMap = new Map();
        for (let ch of area1) countMap.set(ch, (countMap.get(ch)||0)+1);
        for (let ch of area2) countMap.set(ch, (countMap.get(ch)||0)+2);
        for (let ch of area3) countMap.set(ch, (countMap.get(ch)||0)+3);
        for (let ch of area4) countMap.set(ch, (countMap.get(ch)||0)+4);
        // 清空现有卡组
        deckMap.clear();
        // 匹配卡牌
        for (let [impId, quantity] of countMap.entries()) {
            const card = allCards.find(c => c.importId === impId);
            if (card) {
                deckMap.set(card.id, { card: card, count: quantity });
            } else {
                console.warn("未知importId:", impId);
            }
        }
        mainNation = idToNation[mainDigit];
        allyNation = idToNation[allyDigit];
        document.getElementById('mainNationSelect').value = mainNation;
        document.getElementById('allyNationSelect').value = allyNation;
        updateAllDecksUI();
        renderCards();
        showToast(`导入成功: ${factionDisplay[mainNation]} + ${factionDisplay[allyNation]}`);
        return true;
    }
    
    function updateAllDecksUI() {
        const totalCount = Array.from(deckMap.values()).reduce((s,e)=>s+e.count,0);
        // 统计主国、盟国、其他数量
        let mainCount = 0, allyCount = 0, otherCount = 0;
        for (let {card, count} of deckMap.values()) {
            if (card.faction === mainNation) mainCount += count;
            else if (card.faction === allyNation) allyCount += count;
            else otherCount += count;
        }
        document.getElementById('totalDeckCount').innerText = totalCount;
        document.getElementById('mobileTotalCount').innerText = totalCount;
        document.getElementById('mobileToggleCount').innerText = totalCount;
        document.getElementById('statMain').innerText = mainCount;
        document.getElementById('statAlly').innerText = allyCount;
        document.getElementById('statOther').innerText = otherCount;
        // 渲染PC卡组列表
        const deckContainer = document.getElementById('deckListContainer');
        if(totalCount===0){ deckContainer.innerHTML='<div style="color:#ab9f7c;text-align:center;padding:16px;">暂无卡牌</div>'; }
        else {
            const entries = Array.from(deckMap.values()).sort((a,b)=>a.card.id-b.card.id);
            deckContainer.innerHTML = entries.map(e=>{
                const c=e.card; const iconUrl=`${c.faction}.svg`;
                return `<div class="deck-card-row" style="border-left-color:${factionColor[c.faction]||'#6b6e5c'}">
                    <div class="deck-card-icon" style="background-image:url('${iconUrl}');"></div>
                    <div class="deck-card-info">
                        <div class="deck-card-cost"><span>${c.cost}</span><span class="cost-k-symbol">K</span></div>
                        <span class="deck-card-name">${c.titleZh}</span>
                        <span class="deck-card-qty">x${e.count}</span>
                    </div>
                    <button class="deck-remove-btn" data-id="${c.id}">−</button>
                </div>`;
            }).join('');
            deckContainer.querySelectorAll('.deck-remove-btn').forEach(btn=>{
                btn.addEventListener('click',()=>removeFromDeck(parseInt(btn.dataset.id)));
            });
        }
        // 移动端列表
        const mobileContainer = document.getElementById('mobileDeckList');
        if(totalCount===0) mobileContainer.innerHTML='<div style="color:#ab9f7c;text-align:center;padding:16px;">暂无卡牌</div>';
        else {
            const entries = Array.from(deckMap.values()).sort((a,b)=>a.card.id-b.card.id);
            mobileContainer.innerHTML = entries.map(e=>{
                const c=e.card; const iconUrl=`${c.faction}.svg`;
                return `<div class="deck-card-row" style="border-left-color:${factionColor[c.faction]||'#6b6e5c'}">
                    <div class="deck-card-icon" style="background-image:url('${iconUrl}');"></div>
                    <div class="deck-card-info">
                        <div class="deck-card-cost"><span>${c.cost}</span><span class="cost-k-symbol">K</span></div>
                        <span class="deck-card-name">${c.titleZh}</span>
                        <span class="deck-card-qty">x${e.count}</span>
                    </div>
                    <button class="deck-remove-btn" data-id="${c.id}">−</button>
                </div>`;
            }).join('');
            mobileContainer.querySelectorAll('.deck-remove-btn').forEach(btn=>{
                btn.addEventListener('click',()=>removeFromDeck(parseInt(btn.dataset.id)));
            });
        }
    }
    
    function addToDeck(card){ let e=deckMap.get(card.id); if(e) e.count++; else deckMap.set(card.id,{card,count:1}); updateAllDecksUI(); renderCards(); }
    function removeFromDeck(id){ let e=deckMap.get(id); if(e){ if(e.count>1) e.count--; else deckMap.delete(id); updateAllDecksUI(); renderCards(); } }
    function clearDeck(){ deckMap.clear(); updateAllDecksUI(); renderCards(); showToast("卡组已清空"); }
    function showToast(msg){ const t=document.getElementById('toastMsg'); if(!t)return; t.innerText=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',1500); }
    
    // 初始化UI组件
    function initNationSelectors() {
        const mainSel = document.getElementById('mainNationSelect');
        const allySel = document.getElementById('allyNationSelect');
        const nations = ["germany","britain","japan","soviet","usa"];
        nations.forEach(n=>{
            mainSel.add(new Option(factionDisplay[n], n));
            allySel.add(new Option(factionDisplay[n], n));
        });
        mainSel.value = mainNation;
        allySel.value = allyNation;
        mainSel.addEventListener('change',()=>{ mainNation=mainSel.value; updateAllDecksUI(); });
        allySel.addEventListener('change',()=>{ allyNation=allySel.value; updateAllDecksUI(); });
    }
    
    function initImportExport() {
        document.getElementById('exportDeckBtn').addEventListener('click',()=>exportDeckCode());
        document.getElementById('importDeckBtn').addEventListener('click',()=>{
            const code = prompt("粘贴卡组代码 (%%开头)");
            if(code) importDeckCode(code);
        });
        document.getElementById('mobileExportBtn').addEventListener('click',()=>exportDeckCode());
        document.getElementById('mobileImportBtn').addEventListener('click',()=>{
            const code = prompt("粘贴卡组代码");
            if(code) importDeckCode(code);
        });
        document.getElementById('clearDeckBtn').addEventListener('click',()=>clearDeck());
        document.getElementById('mobileClearDeck').addEventListener('click',()=>clearDeck());
    }
    
    function initMobileSidebar() {
        const toggle=document.getElementById('mobileDeckToggle'), panel=document.getElementById('mobileDeckPanel'), overlay=document.getElementById('mobileOverlay'), close=document.getElementById('mobileCloseDeck');
        const open=()=>{ panel.classList.add('open'); overlay.classList.add('show'); };
        const closePanel=()=>{ panel.classList.remove('open'); overlay.classList.remove('show'); };
        toggle?.addEventListener('click',open);
        close?.addEventListener('click',closePanel);
        overlay?.addEventListener('click',closePanel);
    }
    
    function initNav(){
        const menuBtn=document.getElementById('menuToggleBtn'), menuDiv=document.getElementById('navMenu');
        menuBtn.onclick=(e)=>{ e.stopPropagation(); menuDiv.classList.toggle('open'); };
        document.addEventListener('click',(e)=>{ if(!menuBtn.contains(e.target)&&!menuDiv.contains(e.target)) menuDiv.classList.remove('open'); });
    }
    
    // 补全缺失的全局变量和函数
    const factionColor = { "germany":"#5A5F55","britain":"#857A60","soviet":"#4F3826","usa":"#434B32","japan":"#90723C","france":"#283454","italy":"#555248","poland":"#645633","finland":"#C9C8BC","neutral":"#6b6e5c" };
    window.addEventListener('load', async()=>{
        await loadData();
        initNav();
        initNationSelectors();
        initImportExport();
        initMobileSidebar();
        updateAllDecksUI();
    });
    // 占位简化loadData
    window.loadData = async function(){
        try{
            const res=await fetch('data.json');
            const data=await res.json();
            allCards=(data.cards||[]).map((c,idx)=>({
                id:c.id??idx, importId:c.importId, faction:(c.json?.faction||c.faction||"").toLowerCase(),
                type:c.json?.type||c.type, rarity:c.json?.rarity||c.rarity, setName:c.json?.set||c.set||"基础",
                attack:c.json?.attack??c.attack, defense:c.json?.defense??c.defense,
                operationCost:c.json?.operationCost??c.operationCost, cost:c.json?.kredits??(c.json?.cost??c.cost??0),
                attributes:c.json?.attributes||[], text_zh:c.json?.text?.["zh-Hans"]||"无描述",
                titleZh:c.json?.title?.["zh-Hans"]||c.title?.["zh-Hans"]||"无名", titleEn:c.json?.title?.["en-EN"]||"",
                image:c.json?.image||c.image, reserved:!!c.reserved, isSpawn:c.json?.set==="OnlySpawnable"
            }));
            initFilters(); applyFilters();
        }catch(e){ console.error(e); document.getElementById('cardContainer').innerHTML='<div>加载失败</div>'; }
    };
    // 补全缺失函数
    window.initFilters = function(){};
    window.applyFilters = function(){ filteredCards=[...allCards]; renderCards(); renderPagination(); };
    window.renderCards = function(){
        const container=document.getElementById('cardContainer');
        if(!filteredCards.length){ container.innerHTML='<div>未找到卡牌</div>'; return; }
        container.innerHTML=filteredCards.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE).map(card=>{
            const qty=deckMap.get(card.id)?.count||0;
            return `<div class="card-item" data-card-id="${card.id}" style="border-color:${factionColor[card.faction]||'#6b6e5c'}">
                <div class="card-img"><img src="${getCardImageUrl(card.image)}" loading="lazy"></div>
                <div class="card-info"><div class="card-name"><span>${card.titleZh}</span>${card.reserved?'<i class="reserve-icon-sm"></i>':''}</div></div>
                <div class="card-badge-desktop ${qty===0?'hide-badge':''}"><span class="card-deck-count">${qty}</span><button class="card-remove-icon" data-remove="${card.id}">−</button></div>
                <div class="card-mobile-actions ${qty===0?'hide-badge':''}"><span class="mobile-count-badge">${qty}</span><button class="mobile-remove-btn" data-remove="${card.id}">−</button></div>
            </div>`;
        }).join('');
        document.querySelectorAll('.card-item').forEach(el=>el.addEventListener('click',(e)=>{ if(!e.target.classList.contains('card-remove-icon')&&!e.target.classList.contains('mobile-remove-btn')) addToDeck(allCards.find(c=>c.id===parseInt(el.dataset.cardId))); }));
        document.querySelectorAll('.card-remove-icon,.mobile-remove-btn').forEach(btn=>btn.addEventListener('click',(e)=>{ e.stopPropagation(); removeFromDeck(parseInt(btn.dataset.remove)); }));
    };
    window.renderPagination = function(){};
    window.getCardImageUrl = function(n){ return `https://images.weserv.nl/?url=ssl:www.kards.com/images/card/v48/zh-Hans/${n}&q=20`; };
</script>
</body>
</html>
