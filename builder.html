<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>KARDS 军械库 · 卡组构筑</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #2b2b1f;
            background-image: 
                radial-gradient(circle at 20% 40%, rgba(80, 70, 40, 0.4) 2%, transparent 2.5%),
                radial-gradient(circle at 70% 85%, rgba(60, 50, 30, 0.5) 1.8%, transparent 2.2%),
                radial-gradient(circle at 45% 20%, rgba(110, 90, 50, 0.3) 3%, transparent 3.5%),
                repeating-linear-gradient(45deg, #5e5536 0px, #5e5536 2px, #7e6e48 2px, #7e6e48 8px),
                repeating-linear-gradient(135deg, #3e3a2a 0px, #3e3a2a 3px, #5a4e32 3px, #5a4e32 10px);
            background-blend-mode: overlay, normal;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        :root {
            --germany: #5A5F55;
            --britain: #857A60;
            --soviet: #4F3826;
            --usa: #434B32;
            --japan: #90723C;
            --france: #283454;
            --italy: #555248;
            --poland: #645633;
            --finland: #C9C8BC;
            --neutral: #6b6e5c;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 16px 32px;
            display: flex;
            flex-direction: column;
        }

        .nav-bar {
            background: rgba(20, 20, 15, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid #aa8e4e;
            border-radius: 20px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        }
        .nav-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(170, 142, 78, 0.3);
        }
        .nav-brand {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f9f9fc, #e6dbb0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            white-space: nowrap;
        }
        .menu-btn {
            background: rgba(210, 210, 225, 0.12);
            border: 1px solid #aa8e4e;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
        }
        .menu-btn span {
            display: block;
            width: 22px;
            height: 2.5px;
            background-color: #f2e2b0;
            border-radius: 2px;
        }
        .nav-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
            background: rgba(10, 10, 8, 0.98);
        }
        .nav-menu.open { max-height: 320px; }
        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px 20px 20px;
        }
        .menu-link {
            display: block;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 20px;
            border-radius: 60px;
            background: rgba(210, 210, 225, 0.08);
            color: #eef0ff;
            text-align: center;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .menu-link:hover { background: rgba(235, 235, 245, 0.2); border-color: #c9a53b; }
        .menu-link.active {
            background: #c9a53b;
            color: #1e1c10;
            font-weight: 700;
        }

        /* 主国盟国选择栏 */
        .nation-selector {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(170, 142, 78, 0.5);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }
        .nation-group {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .nation-label {
            font-size: 0.75rem;
            color: #e9dbbd;
            font-weight: 600;
        }
        .nation-select {
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.4rem 1rem;
            color: #f5efdb;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .import-export {
            display: flex;
            gap: 0.8rem;
        }
        .code-btn {
            background: #4a3720;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            color: #f3e1b3;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .code-btn:hover { background: #aa6f3c; color: white; }
        .code-input-area {
            margin-top: 0.5rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .code-input {
            flex: 1;
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            color: #f5efdb;
            font-size: 0.8rem;
            font-family: monospace;
        }

        .builder-main {
            display: flex;
            gap: 24px;
            position: relative;
        }
        .cards-section {
            flex: 3;
            min-width: 0;
        }
        .deck-panel {
            width: 340px;
            flex-shrink: 0;
            background: rgba(10, 12, 8, 0.94);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid #c9aa5b;
            padding: 1rem 0.8rem 1.2rem;
            display: flex;
            flex-direction: column;
            height: fit-content;
            max-height: 85vh;
            position: sticky;
            top: 16px;
            overflow-y: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 8px 12px;
            border-bottom: 2px solid #dbba6c;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .deck-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffefbf;
            letter-spacing: 1px;
        }
        .clear-deck {
            background: #4a3720;
            border: none;
            padding: 5px 12px;
            border-radius: 50px;
            color: #f3e1b3;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .clear-deck:hover { background: #aa6f3c; color: white; }
        
        .headquarters-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f9f3df;
            border-radius: 16px;
            padding: 8px 10px;
            margin-bottom: 16px;
            border-left: 5px solid #d4af37;
            background: linear-gradient(135deg, #fff7e8, #f5e7ce);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .hq-icon {
            width: 32px;
            height: 32px;
            background: #c9aa5b;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2d2816;
        }
        .hq-name {
            font-size: 1rem;
            font-weight: 800;
            color: #2b341d;
            letter-spacing: 1px;
        }
        
        .deck-stats {
            background: #1c1f16;
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #e9dbbd;
        }
        .deck-stats span { color: #ffd966; font-weight: bold; }

        .deck-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 50vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        .deck-card-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1c1f16;
            border-radius: 16px;
            padding: 6px 8px 6px 6px;
            border-left: 5px solid;
            transition: 0.1s;
        }
        .deck-card-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 1px 1px black);
        }
        .deck-card-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .deck-card-cost {
            background: #000000cc;
            border-radius: 8px;
            min-width: 34px;
            text-align: center;
            padding: 2px 5px;
            font-weight: bold;
            color: #ffd966;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .deck-card-name {
            font-size: 0.75rem;
            font-weight: 500;
            color: #f9edc1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }
        .deck-card-qty {
            background: rgba(0,0,0,0.7);
            border-radius: 30px;
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #ffe0a3;
            min-width: 38px;
            text-align: center;
        }
        .deck-remove-btn {
            background: #5e3c1f;
            border: none;
            color: #ffcf8a;
            border-radius: 30px;
            width: 26px;
            height: 26px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
        }

        .mobile-deck-toggle {
            display: none;
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #2f2b1c;
            border: 1px solid #c9a63b;
            border-right: none;
            border-radius: 8px 0 0 8px;
            padding: 12px 10px;
            color: #fae7b3;
            cursor: pointer;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            min-width: 48px;
        }
        .mobile-deck-panel {
            position: fixed;
            top: 0;
            right: -85%;
            width: 80%;
            max-width: 320px;
            height: 100vh;
            background: rgba(10, 12, 8, 0.98);
            backdrop-filter: blur(16px);
            border-left: 2px solid #c9aa5b;
            z-index: 1001;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 1rem 0.8rem 1.2rem;
        }
        .mobile-deck-panel.open { right: 0; }
        .mobile-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
        }
        .mobile-overlay.show { display: block; }
        @media (max-width: 860px) {
            .builder-main { flex-direction: column; }
            .deck-panel { display: none; }
            .mobile-deck-toggle { display: flex; }
        }

        .filter-panel {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 1.2rem 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(170, 142, 78, 0.5);
        }
        .filter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }
        .filter-item { flex: 1; min-width: 130px; }
        .filter-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e9dbbd;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }
        select, .search-input {
            width: 100%;
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.55rem 1rem;
            color: #f5efdb;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23dbb45c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 1rem center;
        }
        .search-input { background-image: none; }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        @media (max-width: 680px) {
            .card-grid { grid-template-columns: repeat(4, 1fr); gap: 0.7rem; }
        }
        .card-item {
            background: #111812;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            position: relative;
        }
        .card-img {
            width: 100%;
            aspect-ratio: 500 / 702;
            background: #0a0f0c;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-info {
            padding: 0.5rem 0.6rem 0.7rem;
            background: rgba(0,0,0,0.75);
        }
        .card-name {
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #faf0cf;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reserve-icon-sm {
            width: 14px;
            height: 14px;
            background: url('reserve.png') no-repeat center;
            background-size: contain;
            display: inline-block;
            flex-shrink: 0;
        }
        .card-badge-desktop {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 3px 8px;
            border-radius: 40px;
            align-items: center;
            z-index: 5;
        }
        .card-badge-desktop.hide-badge { display: none; }
        .card-deck-count {
            background: #000000cc;
            color: #ffeaad;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 30px;
            min-width: 28px;
            text-align: center;
        }
        .card-remove-icon {
            background: #5e3019;
            border: none;
            color: #ffcf8a;
            border-radius: 30px;
            width: 22px;
            height: 22px;
            font-size: 1rem;
            cursor: pointer;
        }
        .card-mobile-actions {
            display: none;
            background: rgba(0,0,0,0.8);
            padding: 6px 8px;
            justify-content: center;
            gap: 12px;
            border-top: 1px solid #c9aa5b;
        }
        .card-mobile-actions.hide-badge { display: none; }
        @media (max-width: 680px) {
            .card-badge-desktop { display: none; }
            .card-mobile-actions { display: flex; }
        }
        .footer-simple {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #928451;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem 2rem;
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
            gap: 6px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: #2d2a1d;
            border: 1px solid #a3874b;
            padding: 5px 12px;
            border-radius: 40px;
            color: #f5eaca;
            cursor: pointer;
        }
        .page-btn.active-page { background: #dbaa3a; color: #171e0c; }
        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2a16e6;
            padding: 8px 20px;
            border-radius: 40px;
            color: #f7e6b0;
            z-index: 1100;
            font-size: 0.8rem;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="nav-bar">...</div> <!-- 简化，实际保留原导航 -->
    <div class="nav-bar"><div class="nav-header-row"><div class="nav-brand">KARDS 军械库 · 卡组构筑</div><div class="menu-btn" id="menuToggleBtn"><span></span><span></span><span></span></div></div><div class="nav-menu" id="navMenu"><div class="menu-links"><a class="menu-link" href="index.html">卡牌收藏</a><a class="menu-link active" href="#">卡组构筑</a><a class="menu-link" href="seek.html">英文直检</a><a class="menu-link" href="#">关于</a></div></div></div>

    <div class="nation-selector">
        <div class="nation-group">
            <span class="nation-label">主国</span>
            <select id="mainNation" class="nation-select"><option value="1">德国</option><option value="2">英国</option><option value="3">日本</option><option value="4">苏联</option><option value="5">美国</option><option value="6">法国</option><option value="7">意大利</option><option value="8">波兰</option><option value="9">芬兰</option></select>
            <span class="nation-label">盟国</span>
            <select id="allyNation" class="nation-select"><option value="1">德国</option><option value="2">英国</option><option value="3">日本</option><option value="4">苏联</option><option value="5">美国</option><option value="6">法国</option><option value="7">意大利</option><option value="8">波兰</option><option value="9">芬兰</option></select>
        </div>
        <div class="import-export">
            <button class="code-btn" id="importBtn">📥 导入代码</button>
            <button class="code-btn" id="exportBtn">📤 导出代码</button>
        </div>
        <div class="code-input-area" id="codeInputArea" style="display:none;">
            <input type="text" id="codeInput" class="code-input" placeholder="粘贴卡组代码...">
            <button class="code-btn" id="confirmImport">确认导入</button>
            <button class="code-btn" id="cancelImport">取消</button>
        </div>
    </div>

    <div class="mobile-deck-toggle" id="mobileDeckToggle"><span class="toggle-text">卡组</span><span id="mobileToggleCount">0</span><span>▶</span></div>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <div class="mobile-deck-panel" id="mobileDeckPanel"><div class="mobile-deck-header"><span class="deck-title">📋 我的卡组</span><button class="mobile-close-deck" id="mobileCloseDeck">✕</button></div><div class="headquarters-row"><div class="hq-icon">🏛️</div><div class="hq-name">总部</div></div><div class="deck-stats"><span>主国: <span id="mobileMainCount">0</span></span><span>盟国: <span id="mobileAllyCount">0</span></span><span>其他: <span id="mobileOtherCount">0</span></span></div><div class="mobile-deck-list" id="mobileDeckList"></div><div style="text-align:center;margin-top:8px"><button class="clear-deck" id="mobileClearDeck">清空卡组</button></div></div>

    <div class="builder-main">
        <div class="cards-section">
            <div class="filter-panel"><div class="filter-grid"><div class="filter-item"><div class="filter-label">🔍 搜索</div><input type="text" id="searchInput" class="search-input"></div><div class="filter-item"><div class="filter-label">🏳 阵营</div><select id="factionSelect"><option value="all">全部</option></select></div><div class="filter-item"><div class="filter-label">💰 花费</div><select id="costSelect"><option value="all">全部</option></select></div><div class="filter-item"><div class="filter-label">🃏 稀有度</div><select id="raritySelect"><option value="all">全部</option></select></div></div></div>
            <div id="cardContainer" class="card-grid">加载中...</div>
            <div class="pagination" id="pagination"></div>
        </div>
        <div class="deck-panel" id="deckPanel">
            <div class="deck-header"><span class="deck-title">📋 我的卡组</span><button class="clear-deck" id="clearDeckBtn">清空</button></div>
            <div class="headquarters-row"><div class="hq-icon">🏛️</div><div class="hq-name">总部</div></div>
            <div class="deck-stats"><span>主国: <span id="mainCount">0</span></span><span>盟国: <span id="allyCount">0</span></span><span>其他: <span id="otherCount">0</span></span></div>
            <div class="deck-list" id="deckListContainer"></div>
        </div>
    </div>
    <div class="footer-simple">...</div>
    <div id="toastMsg" class="toast-msg" style="display:none"></div>
</div>

<script>
    const factionIdMap = {1:"germany",2:"britain",3:"japan",4:"soviet",5:"usa",6:"france",7:"italy",8:"poland",9:"finland"};
    const factionNameMap = {"germany":"德国","britain":"英国","japan":"日本","soviet":"苏联","usa":"美国","france":"法国","italy":"意大利","poland":"波兰","finland":"芬兰"};
    let allCards=[], filteredCards=[], deckMap=new Map(), currentPage=1, PAGE_SIZE=20;
    function showToast(msg){let t=document.getElementById('toastMsg');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1500);}
    function getCardImageUrl(n,l="zh-Hans",q=20){return n?`https://images.weserv.nl/?url=ssl:www.kards.com/images/card/v48/${l}/${n}&q=${q}`:"";}
    async function loadData(){try{const r=await fetch('data.json');const d=await r.json();allCards=(d.cards||[]).map((c,idx)=>({id:c.id??idx,type:c.json?.type||c.type,faction:(c.json?.faction||c.faction||"").toLowerCase(),rarity:c.json?.rarity||"Standard",setName:c.json?.set||"基础",cost:c.json?.kredits??c.cost??0,attributes:c.json?.attributes||[],text_zh:c.json?.text?.["zh-Hans"]||"",titleZh:c.json?.title?.["zh-Hans"]||c.title?.["zh-Hans"]||"无名",image:c.json?.image||c.image,reserved:!!c.reserved,importId:c.importId||""}));initFilters();applyFilters();}catch(e){console.error(e);}}
    function initFilters(){const fs=[...new Set(allCards.map(c=>c.faction))];document.getElementById('factionSelect').innerHTML='<option value="all">全部阵营</option>'+fs.map(f=>`<option value="${f}">${factionNameMap[f]||f}</option>`).join('');['factionSelect','costSelect','raritySelect','searchInput'].forEach(id=>{document.getElementById(id)?.addEventListener('change',()=>applyFilters());});}
    function searchableText(c){return`${c.titleZh} ${c.text_zh}`.toLowerCase();}
    function filterCardsLogic(){let r=[...allCards];const s=document.getElementById('searchInput').value.trim().toLowerCase();if(s)r=r.filter(c=>searchableText(c).includes(s));const f=document.getElementById('factionSelect').value;if(f!=='all')r=r.filter(c=>c.faction===f);return r;}
    function applyFilters(){filteredCards=filterCardsLogic();currentPage=1;renderCards();renderPagination();}
    function renderCards(){const start=(currentPage-1)*PAGE_SIZE;const page=filteredCards.slice(start,start+PAGE_SIZE);const cont=document.getElementById('cardContainer');if(!page.length){cont.innerHTML='<div>未找到</div>';return;}cont.innerHTML=page.map(c=>{const q=deckMap.get(c.id)?.count||0;return`<div class="card-item" data-id="${c.id}" style="border-color:${factionColor[c.faction]||'#6b6e5c'}"><div class="card-img"><img src="${getCardImageUrl(c.image)}"></div><div class="card-info"><div class="card-name"><span>${c.titleZh}</span>${c.reserved?'<i class="reserve-icon-sm"></i>':''}</div></div><div class="card-badge-desktop ${q===0?'hide-badge':''}"><span class="card-deck-count">${q}</span><button class="card-remove-icon" data-remove="${c.id}">−</button></div><div class="card-mobile-actions ${q===0?'hide-badge':''}"><span class="mobile-count-badge">${q}</span><button class="mobile-remove-btn" data-remove="${c.id}">−</button></div></div>`;}).join('');document.querySelectorAll('.card-item').forEach(el=>{el.addEventListener('click',e=>{if(e.target.classList.contains('card-remove-icon')||e.target.classList.contains('mobile-remove-btn'))return;const id=parseInt(el.dataset.id);const card=allCards.find(c=>c.id===id);if(card)addToDeck(card);});});document.querySelectorAll('.card-remove-icon,.mobile-remove-btn').forEach(btn=>{btn.addEventListener('click',e=>{e.stopPropagation();removeFromDeck(parseInt(btn.dataset.remove));});});}
    function renderPagination(){const total=filteredCards.length,pages=Math.ceil(total/PAGE_SIZE),pagDiv=document.getElementById('pagination');if(pages<=1){pagDiv.innerHTML='';return;}let btns=`<button class="page-btn" data-page="prev" ${currentPage===1?'disabled':''}>◀</button>`;for(let i=1;i<=pages;i++)btns+=`<button class="page-btn ${i===currentPage?'active-page':''}" data-page="${i}">${i}</button>`;btns+=`<button class="page-btn" data-page="next" ${currentPage===pages?'disabled':''}>▶</button>`;pagDiv.innerHTML=btns;pagDiv.querySelectorAll('.page-btn').forEach(btn=>{btn.addEventListener('click',()=>{let p=btn.dataset.page;if(p==='prev')currentPage=Math.max(1,currentPage-1);else if(p==='next')currentPage=Math.min(pages,currentPage+1);else currentPage=parseInt(p);renderCards();renderPagination();});});}
    function addToDeck(card){let e=deckMap.get(card.id);if(e)e.count++;else deckMap.set(card.id,{card,count:1});updateAllUI();renderCards();}
    function removeFromDeck(id){let e=deckMap.get(id);if(!e)return;if(e.count>1)e.count--;else deckMap.delete(id);updateAllUI();renderCards();}
    function clearDeck(){deckMap.clear();updateAllUI();renderCards();showToast('卡组已清空');}
    function getCardNation(card){let f=card.faction;for(let[k,v]of Object.entries(factionIdMap))if(v===f)return parseInt(k);return 0;}
    function updateCountStats(){let mainId=parseInt(document.getElementById('mainNation').value),allyId=parseInt(document.getElementById('allyNation').value);let main=0,ally=0,other=0;for(let e of deckMap.values()){let n=getCardNation(e.card);let cnt=e.count;if(n===mainId)main+=cnt;else if(n===allyId)ally+=cnt;else other+=cnt;}document.getElementById('mainCount').innerText=main;document.getElementById('allyCount').innerText=ally;document.getElementById('otherCount').innerText=other;document.getElementById('mobileMainCount').innerText=main;document.getElementById('mobileAllyCount').innerText=ally;document.getElementById('mobileOtherCount').innerText=other;let total=main+ally+other;document.getElementById('mobileToggleCount').innerText=total;}
    function updateDeckUI(containerId,isMobile=false){let container=document.getElementById(containerId);let entries=Array.from(deckMap.values());entries.sort((a,b)=>{let ia=allCards.findIndex(c=>c.id===a.card.id),ib=allCards.findIndex(c=>c.id===b.card.id);return ia-ib;});if(entries.length===0){container.innerHTML='<div style="color:#ab9f7c;text-align:center;padding:16px;">暂无卡牌</div>';return;}container.innerHTML=entries.map(e=>{let c=e.card;return`<div class="deck-card-row" style="border-left-color:${factionColor[c.faction]||'#6b6e5c'}"><div class="deck-card-icon" style="background-image:url('${c.faction}.svg')"></div><div class="deck-card-info"><div class="deck-card-cost"><span>${c.cost}</span><span class="cost-k-symbol">K</span></div><span class="deck-card-name">${c.titleZh}</span><span class="deck-card-qty">x${e.count}</span></div><button class="deck-remove-btn" data-id="${c.id}">−</button></div>`;}).join('');container.querySelectorAll('.deck-remove-btn').forEach(btn=>{btn.addEventListener('click',()=>removeFromDeck(parseInt(btn.dataset.id)));});}
    function updateAllUI(){updateDeckUI('deckListContainer',false);updateDeckUI('mobileDeckList',true);updateCountStats();}
    function exportDeck(){let main=document.getElementById('mainNation').value.padStart(1,'0');let ally=document.getElementById('allyNation').value.padStart(1,'0');let code=`%%${main}${ally}|`;let counts=[0,0,0,0];let cardsBySlot=[[],[],[],[]];for(let e of deckMap.values()){let imp=e.card.importId;if(!imp)continue;for(let i=0;i<e.count;i++){if(i<4)cardsBySlot[i].push(imp);else cardsBySlot[3].push(imp);}}for(let i=0;i<4;i++){if(i>0)code+=';';code+=cardsBySlot[i].join('');}navigator.clipboard.writeText(code);showToast('卡组代码已复制');}
    function importDeck(code){let match=code.match(/%%(\d{2})\|(.*)/);if(!match){showToast('无效的卡组代码格式');return false;}let nationCode=match[1];let mainNation=parseInt(nationCode[0]),allyNation=parseInt(nationCode[1]);if(mainNation>=1&&mainNation<=9)document.getElementById('mainNation').value=mainNation;if(allyNation>=1&&allyNation<=9)document.getElementById('allyNation').value=allyNation;let parts=match[2].split(';');let newMap=new Map();for(let slot=0;slot<4&&slot<parts.length;slot++){let seg=parts[slot];for(let i=0;i<seg.length;i+=2){let impId=seg.substr(i,2);if(impId.length===2){let card=allCards.find(c=>c.importId===impId);if(card){let existing=newMap.get(card.id);if(existing)existing.count++;else newMap.set(card.id,{card,count:1});}}}}deckMap=newMap;updateAllUI();renderCards();showToast('导入成功');return true;}
    function initNationEvents(){document.getElementById('mainNation').addEventListener('change',()=>updateCountStats());document.getElementById('allyNation').addEventListener('change',()=>updateCountStats());}
    function initImportExport(){let importBtn=document.getElementById('importBtn'),exportBtn=document.getElementById('exportBtn'),area=document.getElementById('codeInputArea'),confirmBtn=document.getElementById('confirmImport'),cancelBtn=document.getElementById('cancelImport'),codeInput=document.getElementById('codeInput');importBtn.onclick=()=>{area.style.display='flex';codeInput.value='';};cancelBtn.onclick=()=>{area.style.display='none';};confirmBtn.onclick=()=>{let val=codeInput.value.trim();if(val)importDeck(val);area.style.display='none';};exportBtn.onclick=()=>exportDeck();}
    function initMobile(){let toggle=document.getElementById('mobileDeckToggle'),panel=document.getElementById('mobileDeckPanel'),overlay=document.getElementById('mobileOverlay'),close=document.getElementById('mobileCloseDeck'),clearM=document.getElementById('mobileClearDeck');toggle.onclick=()=>{panel.classList.add('open');overlay.classList.add('show');};close.onclick=()=>{panel.classList.remove('open');overlay.classList.remove('show');};overlay.onclick=()=>{panel.classList.remove('open');overlay.classList.remove('show');};clearM.onclick=()=>clearDeck();}
    function initNav(){let menuBtn=document.getElementById('menuToggleBtn'),menuDiv=document.getElementById('navMenu');menuBtn.onclick=(e)=>{e.stopPropagation();menuDiv.classList.toggle('open');};document.addEventListener('click',(e)=>{if(!menuBtn.contains(e.target)&&!menuDiv.contains(e.target))menuDiv.classList.remove('open');});document.getElementById('clearDeckBtn').addEventListener('click',()=>clearDeck());}
    const factionColor={germany:"#5A5F55",britain:"#857A60",soviet:"#4F3826",usa:"#434B32",japan:"#90723C",france:"#283454",italy:"#555248",poland:"#645633",finland:"#C9C8BC",neutral:"#6b6e5c"};
    window.addEventListener('load',()=>{loadData();initNav();initMobile();initNationEvents();initImportExport();});
</script>
</body>
