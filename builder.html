<script>
    // ---------------------------- 全局翻译映射 (与index完全一致) ----------------------------
    const attrTranslation = { "blitz":"闪击","fury":"奋战","smokescreen":"烟幕","pincer":"钳击","salvage":"收缴","guard":"守护","heavyarmor1":"重甲1","heavyarmor2":"重甲2","heavyarmor3":"重甲3","alpine":"山地","mobilize":"动员","covert":"隐蔽","shock":"冲击","bond":"协力","ambush":"伏击","intel1":"情报1","intel2":"情报2","intel3":"情报3" };
    function translateAttributesForSearch(attrs) { if (!attrs || !attrs.length) return ""; return attrs.map(a => attrTranslation[a] || a).join(" "); }
    const typeNameMap = { "infantry":"步兵","tank":"坦克","fighter":"战斗机","bomber":"轰炸机","artillery":"炮兵","order":"指令","countermeasure":"反制" };
    const unitTypes = ["infantry","tank","fighter","bomber","artillery"];
    const rarityClassMap = { "Standard":"rarity-standard","Limited":"rarity-limited","Special":"rarity-special","Elite":"rarity-elite" };
    const rarityDisplayMap = { "Standard":"普通","Limited":"限定","Special":"特殊","Elite":"精英" };
    const factionNames = { "soviet":"苏联","usa":"美国","poland":"波兰","neutral":"中立","japan":"日本","italy":"意大利","france":"法国","britain":"英国","finland":"芬兰","germany":"德国","anzac":"澳新军团" };
    const factionColor = { "germany":"#5A5F55","britain":"#857A60","soviet":"#4F3826","usa":"#434B32","japan":"#90723C","france":"#283454","italy":"#555248","poland":"#645633","finland":"#C9C8BC","anzac":"#9E6F34","neutral":"#6b6e5c" };
    // 注意：澳新军团编号处理为"a" (根据需求)
    const allNationOptions = ["germany","britain","japan","soviet","usa","france","italy","poland","finland","anzac"];
    let allCards = [], filteredCards = [], deckMap = new Map();
    let currentPage = 1, PAGE_SIZE = 20;
    let mainNation = "usa", allyNation = "finland";
    const languages = [
        { code: 'zh-Hans', label: '简体中文', flag: '🇨🇳' }, { code: 'zh-Hant', label: '繁體中文', flag: '🇨🇳' },
        { code: 'en-EN', label: 'English', flag: '🇺🇸' }, { code: 'fr-FR', label: 'Français', flag: '🇫🇷' },
        { code: 'de-DE', label: 'Deutsch', flag: '🇩🇪' }, { code: 'pl-PL', label: 'Polski', flag: '🇵🇱' },
        { code: 'pt-BR', label: 'Português', flag: '🇧🇷' }, { code: 'ru-RU', label: 'Pусский', flag: '🇷🇺' },
        { code: 'it-IT', label: 'Italiano', flag: '🇮🇹' }, { code: 'es-ES', label: 'Español', flag: '🇪🇸' },
        { code: 'ko-KR', label: '한국어', flag: '🇰🇷' }, { code: 'ja-JP', label: '日本語', flag: '🇯🇵' }
    ];
    function getCardImageUrl(imgName, lang, quality=20) { return imgName ? `https://images.weserv.nl/?url=ssl:www.kards.com/images/card/v49/${lang}/${imgName}&q=${quality}` : ""; }
    function getSearchableText(card) { const attrsTrans = translateAttributesForSearch(card.attributes || []); return `${card.titleZh} ${card.text_zh} ${attrsTrans}`.toLowerCase(); }

    // 多选筛选器状态 (与index结构一致)
    let selectedFilters = { factions: new Set(), types: new Set(), costs: new Set(), rarities: new Set() };
    function toggleSet(set, val, chip) { if(set.has(val)) set.delete(val); else set.add(val); updateChipActive(chip, set.has(val)); }
    function updateChipActive(chip, active) { if(active) chip.classList.add('active'); else chip.classList.remove('active'); }
    function updateChipsActive(type) { document.querySelectorAll(`.filter-chip[data-filter="${type}"]`).forEach(chip => { const val = chip.dataset.val; const set = (type==='faction'?selectedFilters.factions:type==='type'?selectedFilters.types:type==='cost'?selectedFilters.costs:selectedFilters.rarities); updateChipActive(chip, set.has(val)); }); }

    async function loadData() {
        try {
            const res = await fetch('data.json');
            const data = await res.json();
            allCards = (data.cards || []).map((card, idx) => {
                let rawFaction = (card.json?.faction || card.faction || "").toLowerCase();
                return { id: card.id ?? idx, ...card, type: card.json?.type || card.type, faction: rawFaction, rarity: card.json?.rarity || card.rarity, setName: card.json?.set || card.set || "基础", cost: card.json?.kredits ?? (card.json?.cost ?? card.cost ?? 0), text_zh: card.json?.text?.["zh-Hans"] || "无描述", titleZh: card.json?.title?.["zh-Hans"] || card.title?.["zh-Hans"] || "无名", image: card.json?.image || card.image, reserved: !!card.reserved, isSpawn: card.json?.set === "OnlySpawnable", attributes: card.json?.attributes || [], attack: card.json?.attack ?? card.attack, defense: card.json?.defense ?? card.defense, operationCost: card.json?.operationCost ?? card.operationCost, importId: card.importId || (card.json?.importId) || "" };
            });
            initMultiFiltersAndSelects();
            applyFilters();
            updateFactionStats();
        } catch(e) { document.getElementById('cardContainer').innerHTML = '<div>数据加载失败</div>'; }
    }

    function initMultiFiltersAndSelects() {
        const factions = [...new Set(allCards.map(c=>c.faction))];
        const types = [...new Set(allCards.map(c=>c.type))];
        const sets = [...new Set(allCards.map(c=>c.setName))];
        const costOptions = ["0","1","2","3","4","5","6","7+"];
        const rarityOptions = ["Standard","Limited","Special","Elite"];
        const factionContainer = document.getElementById('factionMultiContainer');
        factionContainer.innerHTML = factions.map(f => `<div class="filter-chip" data-filter="faction" data-val="${f}"><img src="${f}.svg" onerror="this.style.display='none'"> ${factionNames[f]||f}</div>`).join('');
        document.getElementById('typeMultiContainer').innerHTML = types.map(t => `<div class="filter-chip" data-filter="type" data-val="${t}">${typeNameMap[t]||t}</div>`).join('');
        document.getElementById('costMultiContainer').innerHTML = costOptions.map(c => `<div class="filter-chip" data-filter="cost" data-val="${c}">${c==='7+'?'7K+':c+'K'}</div>`).join('');
        document.getElementById('rarityMultiContainer').innerHTML = rarityOptions.map(r => `<div class="filter-chip" data-filter="rarity" data-val="${r}">${rarityDisplayMap[r]||r}</div>`).join('');
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                e.stopPropagation();
                const type = chip.dataset.filter, val = chip.dataset.val;
                if(type === 'faction') toggleSet(selectedFilters.factions, val, chip);
                else if(type === 'type') toggleSet(selectedFilters.types, val, chip);
                else if(type === 'cost') toggleSet(selectedFilters.costs, val, chip);
                else if(type === 'rarity') toggleSet(selectedFilters.rarities, val, chip);
                applyFilters();
            });
        });
        document.querySelectorAll('.reset-chip').forEach(reset => {
            reset.addEventListener('click', (e) => {
                const filterType = reset.dataset.filterType;
                if(filterType === 'faction') { selectedFilters.factions.clear(); updateChipsActive('faction'); }
                if(filterType === 'type') { selectedFilters.types.clear(); updateChipsActive('type'); }
                if(filterType === 'cost') { selectedFilters.costs.clear(); updateChipsActive('cost'); }
                if(filterType === 'rarity') { selectedFilters.rarities.clear(); updateChipsActive('rarity'); }
                applyFilters();
            });
        });
        document.getElementById('setSelect').innerHTML = '<option value="all">全部扩展</option>'+sets.map(s=>`<option value="${s}">${s}</option>`).join('');
        ['setSelect','statusSelect','searchInput'].forEach(id => document.getElementById(id).addEventListener('change',()=>applyFilters()));
        document.getElementById('searchInput').addEventListener('input',()=>applyFilters());
        ['attackExact','defenseExact','opExact'].forEach(id => { const el = document.getElementById(id); if(el) el.addEventListener('input', () => applyFilters()); });

        const optionsHtml = allNationOptions.map(f => `<option value="${f}">${factionNames[f]}</option>`).join('');
        ['mainNationSelect', 'mobileMainNation'].forEach(id => { document.getElementById(id).innerHTML = optionsHtml; });
        ['allyNationSelect', 'mobileAllyNation'].forEach(id => { document.getElementById(id).innerHTML = optionsHtml; });
        document.getElementById('mainNationSelect').value = mainNation;
        document.getElementById('allyNationSelect').value = allyNation;
        document.getElementById('mobileMainNation').value = mainNation;
        document.getElementById('mobileAllyNation').value = allyNation;
        const langSelect = document.getElementById('imgLang');
        langSelect.innerHTML = languages.map(l => `<option value="${l.code}">${l.flag} ${l.label}</option>`).join('');
        langSelect.value = 'zh-Hans';
        const updateNation = () => { mainNation = document.getElementById('mainNationSelect').value; allyNation = document.getElementById('allyNationSelect').value; document.getElementById('mobileMainNation').value = mainNation; document.getElementById('mobileAllyNation').value = allyNation; updateAllDecksUI(); updateFactionStats(); };
        const updateMobile = () => { mainNation = document.getElementById('mobileMainNation').value; allyNation = document.getElementById('mobileAllyNation').value; document.getElementById('mainNationSelect').value = mainNation; document.getElementById('allyNationSelect').value = allyNation; updateAllDecksUI(); updateFactionStats(); };
        document.getElementById('mainNationSelect').addEventListener('change', updateNation);
        document.getElementById('allyNationSelect').addEventListener('change', updateNation);
        document.getElementById('mobileMainNation').addEventListener('change', updateMobile);
        document.getElementById('mobileAllyNation').addEventListener('change', updateMobile);
        const bgSelect = document.getElementById('bgColorSelect');
        const customDiv = document.getElementById('customColorDiv');
        bgSelect.addEventListener('change', () => { customDiv.style.display = bgSelect.value === 'custom' ? 'flex' : 'none'; });
    }

    function filterCardsLogic() {
        let result = [...allCards];
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        if(search) result = result.filter(c => getSearchableText(c).includes(search));
        if(selectedFilters.factions.size) result = result.filter(c => selectedFilters.factions.has(c.faction));
        if(selectedFilters.types.size) result = result.filter(c => selectedFilters.types.has(c.type));
        if(selectedFilters.costs.size) {
            result = result.filter(c => { for(let costVal of selectedFilters.costs) { if(costVal === '7+' && c.cost >= 7) return true; if(costVal !== '7+' && c.cost === parseInt(costVal)) return true; } return false; });
        }
        if(selectedFilters.rarities.size) result = result.filter(c => selectedFilters.rarities.has(c.rarity));
        const setVal = document.getElementById('setSelect').value;
        if(setVal !== 'all') result = result.filter(c => c.setName === setVal);
        const status = document.getElementById('statusSelect').value;
        if(status === 'active') result = result.filter(c => !c.reserved && !c.isSpawn);
        else if(status === 'reserve') result = result.filter(c => c.reserved);
        else if(status === 'spawn') result = result.filter(c => c.isSpawn);
        const activeTypes = selectedFilters.types.size ? [...selectedFilters.types] : [...new Set(allCards.map(c=>c.type))];
        const onlyUnits = activeTypes.length>0 && activeTypes.every(t => unitTypes.includes(t));
        const statsArea = document.getElementById('statsArea');
        if(onlyUnits && (selectedFilters.types.size>0)) statsArea.style.display = 'block';
        else statsArea.style.display = 'none';
        if(onlyUnits && (selectedFilters.types.size>0)) {
            let attExact = parseInt(document.getElementById('attackExact').value);
            let defExact = parseInt(document.getElementById('defenseExact').value);
            let opExact = parseInt(document.getElementById('opExact').value);
            result = result.filter(c => { if(!unitTypes.includes(c.type)) return false; if(attExact !== -1 && (c.attack ?? -2) !== attExact) return false; if(defExact !== -1 && (c.defense ?? -2) !== defExact) return false; if(opExact !== -1 && (c.operationCost ?? -2) !== opExact) return false; return true; });
        }
        return result;
    }
    function applyFilters() { filteredCards = filterCardsLogic(); currentPage = 1; renderCards(); renderPagination(); }
    function renderCards() { 
        const start = (currentPage-1)*PAGE_SIZE; const pageCards = filteredCards.slice(start, start+PAGE_SIZE); 
        const container = document.getElementById('cardContainer'); 
        if(!pageCards.length) { container.innerHTML = '<div>未找到卡牌</div>'; return; } 
        container.innerHTML = pageCards.map(card => { 
            const qty = deckMap.get(card.id)?.count || 0; 
            const borderCol = factionColor[card.faction] || '#6b6e5c'; 
            const reserveMark = card.reserved ? '<i class="reserve-icon-sm"></i>' : '';
            const showBadge = qty > 0;
            return `<div class="card-item" data-card-id="${card.id}" style="border-color:${borderCol};"><div class="card-img"><img loading="lazy" src="${getCardImageUrl(card.image, 'zh-Hans', 20)}" alt="${card.titleZh}"></div><div class="card-info"><div class="card-name"><span>${card.titleZh}</span>${reserveMark}</div></div><div class="card-badge-desktop ${!showBadge ? 'hide-badge' : ''}"><span class="card-deck-count">${qty}</span><button class="card-remove-icon" data-remove="${card.id}">−</button></div><div class="card-mobile-actions ${!showBadge ? 'hide-badge' : ''}"><span class="mobile-count-badge">${qty}</span><button class="mobile-remove-btn" data-remove="${card.id}">-</button></div></div>`; 
        }).join(''); 
        document.querySelectorAll('.card-item').forEach(el=>{ el.addEventListener('click',(e)=>{ if(e.target.classList.contains('card-remove-icon') || e.target.classList.contains('mobile-remove-btn')) return; const id = parseInt(el.dataset.cardId); const card = allCards.find(c=>c.id===id); if(card) addToDeck(card); }); }); 
        document.querySelectorAll('.card-remove-icon, .mobile-remove-btn').forEach(btn=>btn.addEventListener('click',(e)=>{ e.stopPropagation(); removeFromDeck(parseInt(btn.dataset.remove)); })); 
    }
    function renderPagination() { 
        const total = filteredCards.length, pages = Math.ceil(total/PAGE_SIZE); 
        const pagDiv = document.getElementById('pagination'); 
        if(pages<=1) { pagDiv.innerHTML=''; return; } 
        let html = `<button class="page-btn" data-page="prev" ${currentPage===1?'disabled':''}>◀</button>`; for(let i=1;i<=pages;i++) html += `<button class="page-btn ${i===currentPage?'active-page':''}" data-page="${i}">${i}</button>`; html += `<button class="page-btn" data-page="next" ${currentPage===pages?'disabled':''}>▶</button>`; pagDiv.innerHTML = html; pagDiv.querySelectorAll('.page-btn').forEach(btn=>btn.addEventListener('click',()=>{ let p = btn.dataset.page; if(p==='prev') currentPage = Math.max(1, currentPage-1); else if(p==='next') currentPage = Math.min(pages, currentPage+1); else currentPage = parseInt(p); renderCards(); renderPagination(); })); 
    }

    function addToDeck(card) { let entry = deckMap.get(card.id); if(entry) entry.count++; else deckMap.set(card.id, { card, count: 1 }); updateAllDecksUI(); renderCards(); updateFactionStats(); }
    function removeFromDeck(cardId) { let entry = deckMap.get(cardId); if(entry) { if(entry.count>1) entry.count--; else deckMap.delete(cardId); updateAllDecksUI(); renderCards(); updateFactionStats(); } }
    function clearDeck() { deckMap.clear(); updateAllDecksUI(); renderCards(); updateFactionStats(); }

    function updateFactionStats() { /* 同原有逻辑 */ 
        let mainCount = 0, allyCount = 0, otherCount = 0;
        for(let {card, count} of deckMap.values()) { if(card.faction === mainNation) mainCount += count; else if(card.faction === allyNation) allyCount += count; else otherCount += count; }
        let otherHtml = otherCount > 0 ? `<div class="faction-stat"><span>其他:</span> ${otherCount}</div>` : '';
        const html = `<div class="faction-stat"><span>主国 ${factionNames[mainNation]}:</span> ${mainCount}</div><div class="faction-stat"><span>盟国 ${factionNames[allyNation]}:</span> ${allyCount}</div>${otherHtml}`;
        const desktopDiv = document.getElementById('desktopFactionStats'); if(desktopDiv) desktopDiv.innerHTML = html;
        const mobileDiv = document.getElementById('mobileFactionStats'); if(mobileDiv) mobileDiv.innerHTML = html;
    }

    function getNationCode(faction) { 
        // 根据需求: 澳新军团编号为"a"，其他为数字索引+1 (germany=1, britain=2, japan=3, soviet=4, usa=5, france=6, italy=7, poland=8, finland=9, anzac='a')
        if (faction === 'anzac') return 'a';
        const idx = allNationOptions.indexOf(faction);
        return idx + 1;
    }
    function exportDeckCode() {
        if (deckMap.size === 0) { alert("卡组为空，无法导出"); return null; }
        const cardCountMap = new Map();
        for (let { card, count } of deckMap.values()) { if (card.importId) { cardCountMap.set(card.importId, (cardCountMap.get(card.importId) || 0) + count); } }
        const regions = ["", "", "", ""];
        for (let [importId, totalCount] of cardCountMap.entries()) {
            let remainder = totalCount % 4;
            let quotient = Math.floor(totalCount / 4);
            if (remainder === 0) { for (let i = 0; i < quotient; i++) regions[3] += importId; }
            else { regions[remainder - 1] += importId; for (let i = 0; i < quotient; i++) regions[3] += importId; }
        }
        return `%%${getNationCode(mainNation)}${getNationCode(allyNation)}|${regions[0]};${regions[1]};${regions[2]};${regions[3]}`;
    }
    async function copyToClipboard(text) { try { await navigator.clipboard.writeText(text); return true; } catch(e) { alert('请手动复制：\n' + text); return false; } }
    async function exportAndCopy() { const code = exportDeckCode(); if(code) { await copyToClipboard(code); alert('卡组代码已复制！\n\n' + code); } }
    
    function parseDeckCode(rawCode) {
        const startIdx = rawCode.indexOf('%%'); if (startIdx === -1) throw new Error('未找到 %%');
        let code = rawCode.substring(startIdx + 2);
        const pipeIdx = code.indexOf('|'); if (pipeIdx === -1) throw new Error('未找到 |');
        const nationPart = code.substring(0, pipeIdx).trim();
        if (nationPart.length < 2) throw new Error('编号无效');
        const mainCode = nationPart[0], allyCode = nationPart[1];
        let mainFaction, allyFaction;
        if (mainCode === 'a') mainFaction = 'anzac';
        else { let idx = parseInt(mainCode,10)-1; if (isNaN(idx) || idx < 0 || idx >= allNationOptions.length-1) throw new Error('主国编号错误'); mainFaction = allNationOptions[idx]; }
        if (allyCode === 'a') allyFaction = 'anzac';
        else { let idx = parseInt(allyCode,10)-1; if (isNaN(idx) || idx < 0 || idx >= allNationOptions.length-1) throw new Error('盟国编号错误'); allyFaction = allNationOptions[idx]; }
        const cardsPart = code.substring(pipeIdx + 1);
        const regions = cardsPart.split(';'); while (regions.length < 4) regions.push('');
        const multipliers = [1, 2, 3, 4];
        const importIdMap = new Map();
        for (let i = 0; i < 4; i++) { const region = regions[i]; const mult = multipliers[i]; for (let j = 0; j < region.length; j += 2) { const importId = region.substring(j, j+2); if (importId.length === 2) importIdMap.set(importId, (importIdMap.get(importId) || 0) + mult); } }
        const cardEntries = [];
        for (let [importId, count] of importIdMap.entries()) { const card = allCards.find(c => c.importId === importId); if (card) cardEntries.push({ card, count }); }
        return { mainFaction, allyFaction, cardEntries };
    }
    function importDeckFromCode(rawCode) {
        try {
            const { mainFaction, allyFaction, cardEntries } = parseDeckCode(rawCode);
            deckMap.clear();
            mainNation = mainFaction; allyNation = allyFaction;
            document.getElementById('mainNationSelect').value = mainNation; document.getElementById('allyNationSelect').value = allyNation;
            document.getElementById('mobileMainNation').value = mainNation; document.getElementById('mobileAllyNation').value = allyNation;
            updateAllDecksUI(); updateFactionStats();
            for (let { card, count } of cardEntries) for (let i = 0; i < count; i++) addToDeck(card);
            alert(`导入成功！共 ${cardEntries.reduce((s,e)=>s+e.count,0)} 张`);
        } catch(e) { alert(`导入失败: ${e.message}`); }
    }
    async function generateDeckImage(cols, quality, lang, addStatsCard, bgColor) {
        const cards = getExpandedCardList();
        if (cards.length === 0) throw new Error("卡组为空");
        
        const cardW = 500, cardH = 702, radius = 12;
        let totalCards = cards.length;
        if (addStatsCard) totalCards += 1;
        const rows = Math.ceil(totalCards / cols);
        const canvas = document.createElement('canvas');
        canvas.width = cols * cardW;
        canvas.height = rows * cardH;
        const ctx = canvas.getContext('2d');
        
        if (bgColor === 'transparent') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        } else if (bgColor === 'white') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else if (bgColor === 'black') {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else if (bgColor.startsWith('#')) {
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        let cardIdx = 0;
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const x = col * cardW, y = row * cardH;
                if (cardIdx < cards.length) {
                    const card = cards[cardIdx];
                    const imgUrl = getCardImageUrl(card.image, lang, quality);
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = imgUrl; });
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(x + radius, y);
                    ctx.lineTo(x + cardW - radius, y);
                    ctx.quadraticCurveTo(x + cardW, y, x + cardW, y + radius);
                    ctx.lineTo(x + cardW, y + cardH - radius);
                    ctx.quadraticCurveTo(x + cardW, y + cardH, x + cardW - radius, y + cardH);
                    ctx.lineTo(x + radius, y + cardH);
                    ctx.quadraticCurveTo(x, y + cardH, x, y + cardH - radius);
                    ctx.lineTo(x, y + radius);
                    ctx.quadraticCurveTo(x, y, x + radius, y);
                    ctx.closePath();
                    ctx.clip();
                    ctx.drawImage(img, x, y, cardW, cardH);
                    ctx.restore();
                    cardIdx++;
                } else if (addStatsCard && cardIdx === cards.length) {
                    await drawStatsCard(ctx, x, y, cardW, cardH, radius);
                    cardIdx++;
                }
            }
        }
        return canvas;
    }
    
    let currentPreviewCanvas = null;
    async function updateImgPreview() {
        const cols = parseInt(document.getElementById('imgCols').value);
        const quality = parseInt(document.getElementById('imgQuality').value);
        const lang = document.getElementById('imgLang').value;
        const addStatsCard = document.getElementById('statsCardToggle').checked;
        let bgColor = document.getElementById('bgColorSelect').value;
        if (bgColor === 'custom') {
            bgColor = document.getElementById('customColor').value;
        }
        const previewDiv = document.getElementById('imgGenPreview');
        previewDiv.innerHTML = '<div style="color:#e9dbbd; padding:20px;">生成中...</div>';
        try {
            currentPreviewCanvas = await generateDeckImage(cols, quality, lang, addStatsCard, bgColor);
            previewDiv.innerHTML = '';
            previewDiv.appendChild(currentPreviewCanvas);
        } catch(e) { previewDiv.innerHTML = `<div style="color:#ff8888;">生成失败: ${e.message}</div>`; }
    }
    
    async function showImgGenModal() {
        if (deckMap.size === 0) { alert("卡组为空，无法生成图片"); return; }
        const modal = document.getElementById('imgGenModal');
        modal.style.display = 'flex';
        
        document.getElementById('generatePreviewBtn').onclick = () => updateImgPreview();
        document.getElementById('downloadImgBtn').onclick = () => {
            if (currentPreviewCanvas) {
                const link = document.createElement('a');
                link.download = `deck_${new Date().toISOString().slice(0,19)}.png`;
                link.href = currentPreviewCanvas.toDataURL();
                link.click();
            }
        };
        document.getElementById('closeImgModal').onclick = () => { modal.style.display = 'none'; };
        
        const qualitySlider = document.getElementById('imgQuality');
        const qualityVal = document.getElementById('qualityVal');
        qualitySlider.oninput = () => { qualityVal.innerText = qualitySlider.value; };
    }

    function getCostCategory(cost) { return cost >= 7 ? 7 : cost; }
    function getTypeCategory(type) { if(type === "order") return "order"; if(type === "countermeasure") return "countermeasure"; return "unit"; }
    
    function showStatsModal() {
        const costMap = { 0:{unit:0,order:0,counter:0},1:{unit:0,order:0,counter:0},2:{unit:0,order:0,counter:0},3:{unit:0,order:0,counter:0},4:{unit:0,order:0,counter:0},5:{unit:0,order:0,counter:0},6:{unit:0,order:0,counter:0},7:{unit:0,order:0,counter:0} };
        let unitTotal=0, orderTotal=0, counterTotal=0;
        let rarityCounts = { "Standard":0, "Limited":0, "Special":0, "Elite":0 };
        for(let {card, count} of deckMap.values()) {
            const cat = getCostCategory(card.cost);
            const typeCat = getTypeCategory(card.type);
            if(typeCat === "unit") { costMap[cat].unit += count; unitTotal += count; }
            else if(typeCat === "order") { costMap[cat].order += count; orderTotal += count; }
            else { costMap[cat].counter += count; counterTotal += count; }
            if(rarityCounts.hasOwnProperty(card.rarity)) rarityCounts[card.rarity] += count;
        }
        const maxHeight = Math.max(...Object.values(costMap).flatMap(v=>[v.unit, v.order, v.counter]), 1);
        const barsHtml = [0,1,2,3,4,5,6,7].map(cost => {
            const unitH = costMap[cost].unit, orderH = costMap[cost].order, counterH = costMap[cost].counter;
            const totalH = unitH + orderH + counterH;
            const unitPercent = maxHeight ? (unitH / maxHeight) * 48 : 0;
            const orderPercent = maxHeight ? (orderH / maxHeight) * 48 : 0;
            const counterPercent = maxHeight ? (counterH / maxHeight) * 48 : 0;
            return `<div class="histogram-bar-wrapper"><div class="bar-stack" style="height:${Math.max(unitPercent+orderPercent+counterPercent, 4)}px;"><div class="bar-counter" style="height:${counterPercent}px; background:#5a5a5a;" title="反制:${counterH}"></div><div class="bar-order" style="height:${orderPercent}px; background:#f5c542;" title="指令:${orderH}"></div><div class="bar-unit" style="height:${unitPercent}px; background:#e8e4d0;" title="单位:${unitH}"></div></div><div class="bar-label">${cost===7?'7K+':cost+'K'}</div><div class="cost-total">${totalH}</div></div>`;
        }).join('');
        document.getElementById('modalHistogramBars').innerHTML = barsHtml;
        document.getElementById('modalTypeSummary').innerHTML = `<span>单位 <span class="unit-badge">${unitTotal}</span></span><span>指令 <span class="order-badge">${orderTotal}</span></span><span>反制 <span class="counter-badge">${counterTotal}</span></span>`;
        document.getElementById('modalRarityStats').innerHTML = `<div class="rarity-stat"><span>普通</span> <span style="color:var(--rarity-standard);">${rarityCounts.Standard}</span></div><div class="rarity-stat"><span>限定</span> <span style="color:var(--rarity-limited);">${rarityCounts.Limited}</span></div><div class="rarity-stat"><span>特殊</span> <span style="color:var(--rarity-special);">${rarityCounts.Special}</span></div><div class="rarity-stat"><span>精英</span> <span style="color:var(--rarity-elite);">${rarityCounts.Elite}</span></div>`;
        document.getElementById('statsModal').style.display = 'flex';
    }
    function closeStatsModal() { document.getElementById('statsModal').style.display = 'none'; }

    function updateAllDecksUI() { 
        renderDeckList('deckListContainer'); renderDeckList('mobileDeckList'); 
        const total = Array.from(deckMap.values()).reduce((s,e)=>s+e.count,0); 
        document.getElementById('mobileToggleCount').innerText = total;
    }
    
    function renderDeckList(containerId) {
        const container = document.getElementById(containerId); if(!container) return; 
        let html = `<div class="deck-card-row headquarters-row" style="border-left-color: #b8860b;"><div class="deck-card-icon">🏛️</div><div class="deck-card-details"><div class="deck-card-name">总部</div><div class="deck-card-stats"></div></div><span class="deck-card-qty"></span><button class="deck-remove-btn" style="visibility: hidden;">−</button></div>`;
        if(deckMap.size===0) { container.innerHTML = html + '<div style="color:#ab9f7c;text-align:center;padding:12px;">暂无卡牌，点击左侧卡片加入</div>'; return; }
        const entries = Array.from(deckMap.values()).sort((a, b) => { const idxA = allCards.findIndex(c => c.id === a.card.id); const idxB = allCards.findIndex(c => c.id === b.card.id); return idxA - idxB; });
        entries.forEach(entry => { const c = entry.card; const borderColor = factionColor[c.faction] || "#6b6e5c"; const typeDisplay = typeNameMap[c.type] || c.type; const rarityClass = rarityClassMap[c.rarity] || "rarity-standard"; const rarityDisplay = rarityDisplayMap[c.rarity] || c.rarity; const reserveIcon = c.reserved ? '<i class="deck-card-reserve-icon"></i>' : ''; html += `<div class="deck-card-row" style="border-left-color: ${borderColor};"><div class="deck-card-icon" style="background-image: url('${c.faction}.svg'); background-size: contain; background-repeat: no-repeat; background-position: center;"></div><div class="deck-card-details"><div class="deck-card-name" title="${c.titleZh}">${c.titleZh}${reserveIcon}</div><div class="deck-card-stats"><div class="kredits-cost"><span>${c.cost}</span><span>K</span></div><div class="card-type-badge">${typeDisplay}</div><div class="card-rarity-badge ${rarityClass}">${rarityDisplay}</div></div></div><span class="deck-card-qty">x${entry.count}</span><button class="deck-remove-btn" data-id="${c.id}">−</button></div>`; });
        container.innerHTML = html;
        container.querySelectorAll('.deck-remove-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); const id = parseInt(btn.dataset.id); if(!isNaN(id)) removeFromDeck(id); }));
    }
    
    function initSidebars() {
        const toggle = document.getElementById('mobileDeckToggle'), panel = document.getElementById('mobileDeckPanel'), overlay = document.getElementById('mobileOverlay'), close = document.getElementById('mobileCloseDeck');
        toggle?.addEventListener('click',()=>{ panel.classList.add('open'); overlay.classList.add('show'); });
        close?.addEventListener('click',()=>{ panel.classList.remove('open'); overlay.classList.remove('show'); });
        overlay?.addEventListener('click',()=>{ panel.classList.remove('open'); overlay.classList.remove('show'); });
        document.getElementById('mobileClearDeck')?.addEventListener('click',()=>clearDeck());
        document.getElementById('statsBtn')?.addEventListener('click',showStatsModal);
        document.getElementById('mobileStatsBtn')?.addEventListener('click',showStatsModal);
        document.getElementById('statsModalClose')?.addEventListener('click',closeStatsModal);
        document.getElementById('statsModal')?.addEventListener('click',(e)=>{ if(e.target === document.getElementById('statsModal')) closeStatsModal(); });
        document.getElementById('genImgBtn')?.addEventListener('click', showImgGenModal);
        document.getElementById('mobileGenImgBtn')?.addEventListener('click', showImgGenModal);
    }
    
    function initNav() { 
        const menuBtn = document.getElementById('menuToggleBtn'), menuDiv = document.getElementById('navMenu'); 
        menuBtn.onclick = (e) => { e.stopPropagation(); menuDiv.classList.toggle('open'); }; 
        document.addEventListener('click', (e) => { if(!menuBtn.contains(e.target) && !menuDiv.contains(e.target)) menuDiv.classList.remove('open'); }); 
        document.getElementById('clearDeckBtn')?.addEventListener('click',()=>clearDeck()); 
    }
    
    function bindImportExportEvents() {
        document.getElementById('importBtn').onclick = () => { const code = document.getElementById('importCode').value.trim(); if(code) importDeckFromCode(code); else alert('请输入卡组代码'); };
        document.getElementById('mobileImportBtn').onclick = () => { const code = document.getElementById('mobileImportCode').value.trim(); if(code) importDeckFromCode(code); else alert('请输入卡组代码'); };
        document.getElementById('exportBtn').onclick = () => exportAndCopy();
        document.getElementById('mobileExportBtn').onclick = () => exportAndCopy();
    }
    
    window.addEventListener('load', () => { loadData(); initNav(); initSidebars(); bindImportExportEvents(); });
</script>
