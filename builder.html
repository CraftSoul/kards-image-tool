<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>KARDS 军械库 · 卡组构筑</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #2b2b1f;
            background-image: 
                radial-gradient(circle at 20% 40%, rgba(80, 70, 40, 0.4) 2%, transparent 2.5%),
                radial-gradient(circle at 70% 85%, rgba(60, 50, 30, 0.5) 1.8%, transparent 2.2%),
                radial-gradient(circle at 45% 20%, rgba(110, 90, 50, 0.3) 3%, transparent 3.5%),
                repeating-linear-gradient(45deg, #5e5536 0px, #5e5536 2px, #7e6e48 2px, #7e6e48 8px),
                repeating-linear-gradient(135deg, #3e3a2a 0px, #3e3a2a 3px, #5a4e32 3px, #5a4e32 10px);
            background-blend-mode: overlay, normal;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        :root {
            --germany: #5A5F55;
            --britain: #857A60;
            --soviet: #4F3826;
            --usa: #434B32;
            --japan: #90723C;
            --france: #283454;
            --italy: #555248;
            --poland: #645633;
            --finland: #C9C8BC;
            --neutral: #6b6e5c;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 16px 32px;
            display: flex;
            flex-direction: column;
        }

        /* 导航栏样式（与index统一） */
        .nav-bar {
            background: rgba(20, 20, 15, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid #aa8e4e;
            border-radius: 20px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        }
        .nav-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(170, 142, 78, 0.3);
        }
        .nav-brand {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f9f9fc, #e6dbb0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            white-space: nowrap;
        }
        .menu-btn {
            background: rgba(210, 210, 225, 0.12);
            border: 1px solid #aa8e4e;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
        }
        .menu-btn span {
            display: block;
            width: 22px;
            height: 2.5px;
            background-color: #f2e2b0;
            border-radius: 2px;
        }
        .nav-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
            background: rgba(10, 10, 8, 0.98);
        }
        .nav-menu.open { max-height: 320px; }
        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px 20px 20px;
        }
        .menu-link {
            display: block;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 20px;
            border-radius: 60px;
            background: rgba(210, 210, 225, 0.08);
            color: #eef0ff;
            text-align: center;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .menu-link:hover { background: rgba(235, 235, 245, 0.2); border-color: #c9a53b; }
        .menu-link.active {
            background: #c9a53b;
            color: #1e1c10;
            font-weight: 700;
        }

        .builder-main {
            display: flex;
            gap: 24px;
            position: relative;
        }
        .cards-section {
            flex: 3;
            min-width: 0;
        }

        /* 筛选面板统一风格 */
        .filter-panel {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(170, 142, 78, 0.5);
        }
        .filter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }
        .filter-item {
            flex: 1;
            min-width: 130px;
        }
        .filter-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e9dbbd;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }
        select, .search-input {
            width: 100%;
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.55rem 1rem;
            color: #f5efdb;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23dbb45c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 1rem center;
        }
        .search-input { background-image: none; }
        .stats-group {
            margin-top: 0.8rem;
            padding-top: 0.5rem;
            border-top: 1px dashed rgba(170, 142, 78, 0.4);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .stats-item { flex: 1; min-width: 120px; }
        .exact-input {
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.4rem 0.8rem;
            width: 100%;
            color: #f5efdb;
            text-align: center;
        }
        .stats-note { font-size: 0.7rem; color: #c9b06b; margin-top: 6px; }

        .deck-panel {
            width: 380px;
            flex-shrink: 0;
            background: rgba(10, 12, 8, 0.94);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid #c9aa5b;
            padding: 1rem 0.8rem 1.2rem;
            display: flex;
            flex-direction: column;
            height: fit-content;
            max-height: 85vh;
            position: sticky;
            top: 16px;
            overflow-y: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px 12px;
            border-bottom: 2px solid #dbba6c;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .deck-header-actions {
            display: flex;
            gap: 8px;
        }
        .import-btn {
            background: #4a6b3c;
            border: none;
            padding: 5px 12px;
            border-radius: 50px;
            color: #f3e1b3;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            transition: 0.2s;
        }
        .import-btn:hover { background: #7c9e5e; color: white; }
        .deck-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffefbf;
            letter-spacing: 1px;
        }
        .clear-deck {
            background: #4a3720;
            border: none;
            padding: 5px 12px;
            border-radius: 50px;
            color: #f3e1b3;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .clear-deck:hover { background: #aa6f3c; color: white; }
        
        .nation-selector {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 10px 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(170, 142, 78, 0.5);
        }
        .nation-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .nation-label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #f3eaca;
            min-width: 40px;
        }
        .nation-select {
            flex: 1;
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.4rem 0.8rem;
            color: #f5efdb;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
        }

        .stats-header {
            display: flex;
            justify-content: flex-end;
            margin: 12px 0 10px;
        }
        .stats-btn {
            background: #c9a53b;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            color: #1e1c10;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .stats-btn:hover { background: #e6c46a; transform: scale(1.02); }

        .headquarters-card {
            background: linear-gradient(135deg, #e6dbbc, #cfbc88);
            border-radius: 20px;
            padding: 12px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border-left: 8px solid #b8860b;
        }
        .hq-icon-large { font-size: 2rem; }
        .hq-info { flex: 1; }
        .hq-name { font-weight: 800; font-size: 1rem; color: #2c2818; }

        .deck-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 45vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        .deck-card-row {
            background: #0f0f0a;
            border-radius: 16px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 6px solid;
            transition: 0.1s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .deck-card-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 1px 2px black);
        }
        .deck-card-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }
        .deck-card-details::-webkit-scrollbar {
            height: 4px;
        }
        .deck-card-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #f9edc1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cost-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .cost-stats::-webkit-scrollbar {
            height: 3px;
        }
        .kredits-cost, .type-badge, .op-cost-badge {
            background: #000000cc;
            border-radius: 12px;
            padding: 2px 8px;
            font-weight: bold;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            white-space: nowrap;
        }
        .kredits-cost { color: #ffd966; }
        .type-badge { color: #b8e2f2; background: #2a3a2a; }
        .op-cost-badge { color: #ffb347; background: #2c2416; }
        .deck-card-qty {
            background: rgba(0,0,0,0.7);
            border-radius: 30px;
            padding: 2px 10px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #ffe0a3;
            margin-left: auto;
            min-width: 42px;
            text-align: center;
        }
        .deck-remove-btn {
            background: #5e3c1f;
            border: none;
            color: #ffcf8a;
            border-radius: 30px;
            width: 28px;
            height: 28px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .deck-remove-btn:hover { background: #b6521a; color: white; }

        /* 移动端侧栏样式保留 */
        .mobile-deck-toggle {
            display: none;
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #2f2b1c;
            border: 1px solid #c9a63b;
            border-right: none;
            border-radius: 8px 0 0 8px;
            padding: 12px 10px;
            color: #fae7b3;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            min-width: 48px;
        }
        .mobile-deck-toggle .toggle-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.8rem;
        }
        .mobile-deck-panel {
            position: fixed;
            top: 0;
            right: -85%;
            width: 80%;
            max-width: 360px;
            height: 100vh;
            background: rgba(10, 12, 8, 0.98);
            backdrop-filter: blur(16px);
            border-left: 2px solid #c9aa5b;
            z-index: 1001;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 1rem 0.8rem 1.2rem;
        }
        .mobile-deck-panel.open { right: 0; }
        .mobile-deck-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px 12px;
            border-bottom: 2px solid #dbba6c;
        }
        .mobile-close-deck {
            background: none;
            border: none;
            color: #ffefbf;
            font-size: 1.6rem;
            cursor: pointer;
        }
        .mobile-deck-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .mobile-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
        }
        .mobile-overlay.show { display: block; }
        @media (max-width: 860px) {
            .builder-main { flex-direction: column; }
            .deck-panel { display: none; }
            .mobile-deck-toggle { display: flex; }
        }

        /* 统计模态框 */
        .modal-stats {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-stats-content {
            background: #1a1c12;
            border-radius: 32px;
            border: 2px solid #c9aa5b;
            max-width: 750px;
            width: 100%;
            padding: 20px 24px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
        }
        .modal-stats-close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 28px;
            cursor: pointer;
            color: #e9d49c;
        }
        .histogram-bars { display: flex; align-items: flex-end; justify-content: space-around; gap: 4px; margin: 10px 0; }
        .bar-stack { display: flex; flex-direction: column-reverse; width: 100%; max-width: 52px; background: #2a2a1c; border-radius: 8px 8px 0 0; overflow: hidden; cursor: pointer; }
        .bar-unit { background-color: #e8e4d0; }
        .bar-order { background-color: #f5c542; }
        .bar-counter { background-color: #5a5a5a; }
        .bar-label { font-size: 0.7rem; color: #f5eaca; text-align: center; margin-top: 6px; }
        .cost-total { font-size: 0.7rem; color: #ffefb9; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 20px; text-align: center; }
        .type-summary-modal { display: flex; gap: 24px; justify-content: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid #aa8e4e; }
        .legend { display: flex; gap: 20px; justify-content: center; margin-bottom: 16px; font-size: 0.7rem; color: #ffefb9; }
        .legend-dot { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; }
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        @media (max-width: 680px) { .card-grid { grid-template-columns: repeat(4, 1fr); gap: 0.7rem; } }
        .card-item {
            background: #111812;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid;
            position: relative;
        }
        .card-img { width: 100%; aspect-ratio: 500 / 702; background: #0a0f0c; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-info { padding: 0.5rem 0.6rem 0.7rem; background: rgba(0,0,0,0.75); }
        .card-name { font-weight: 700; font-size: 0.75rem; display: flex; justify-content: space-between; color: #faf0cf; }
        .reserve-icon-sm { width: 14px; height: 14px; background: url('reserve.png') no-repeat center; background-size: contain; display: inline-block; }
        .card-badge-desktop { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); padding: 3px 8px; border-radius: 40px; display: flex; gap: 6px; }
        .card-deck-count { background: #000000cc; color: #ffeaad; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 30px; }
        .card-remove-icon { background: #5e3019; border: none; color: #ffcf8a; border-radius: 30px; width: 22px; height: 22px; cursor: pointer; }
        .card-mobile-actions { display: none; background: rgba(0,0,0,0.85); padding: 8px 12px; justify-content: center; gap: 16px; border-top: 1px solid #c9aa5b; }
        @media (max-width: 680px) { .card-badge-desktop { display: none; } .card-mobile-actions { display: flex; } }
        .pagination { display: flex; justify-content: center; margin-top: 1.5rem; gap: 6px; flex-wrap: wrap; }
        .page-btn { background: #2d2a1d; border: 1px solid #a3874b; padding: 5px 12px; border-radius: 40px; color: #f5eaca; cursor: pointer; }
        .page-btn.active-page { background: #dbaa3a; color: #171e0c; }
        .footer-simple { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #928451; display: flex; justify-content: center; gap: 2rem; }
        .footer-simple a { text-decoration: none; color: #f8efcf; background: rgba(0,0,0,0.4); padding: 0.4rem 1rem; border-radius: 40px; display: inline-flex; align-items: center; gap: 0.4rem; }
        .footer-simple img { width: 18px; height: 18px; filter: invert(0.95); }
        
        /* 导入模态框 */
        .import-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            z-index: 2100;
            align-items: center;
            justify-content: center;
        }
        .import-modal-card {
            background: #1e1c12;
            border-radius: 28px;
            border: 2px solid #c9aa5b;
            max-width: 500px;
            width: 90%;
            padding: 24px;
        }
        .import-modal-card textarea {
            width: 100%;
            background: #0e0d08;
            border: 1px solid #aa8e4e;
            border-radius: 20px;
            color: #f5efdb;
            padding: 12px;
            margin: 16px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="nav-bar"><div class="nav-header-row"><div class="nav-brand">KARDS 军械库</div><div class="menu-btn" id="menuToggleBtn"><span></span><span></span><span></span></div></div>
    <div class="nav-menu" id="navMenu"><div class="menu-links"><a class="menu-link" href="index.html">卡牌收藏</a><a class="menu-link active" href="#">卡组构筑</a><a class="menu-link" href="seek.html">英文直检</a><a class="menu-link" href="#">关于军械库</a></div></div></div>

    <div class="mobile-deck-toggle" id="mobileDeckToggle"><span class="toggle-text">卡组</span><span class="mobile-count-badge-toggle" id="mobileToggleCount">0</span><span>▶</span></div>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <div class="mobile-deck-panel" id="mobileDeckPanel">
        <div class="mobile-deck-header"><span class="deck-title">📋 卡组</span><button class="mobile-close-deck" id="mobileCloseDeck">✕</button></div>
        <div class="nation-selector"><div class="nation-row"><span class="nation-label">主国</span><select id="mobileMainNation"></select></div><div class="nation-row"><span class="nation-label">盟国</span><select id="mobileAllyNation"></select></div></div>
        <div class="headquarters-card"><div class="hq-icon-large">🏛️</div><div class="hq-info"><div class="hq-name">总部</div></div></div>
        <div class="stats-header"><button class="stats-btn" id="mobileStatsBtn">📊 统计</button><button class="import-btn" id="mobileImportBtn">📥 导入</button></div>
        <div class="mobile-deck-list" id="mobileDeckList"></div>
        <button class="clear-deck" id="mobileClearDeck" style="margin-top:12px;">清空</button>
    </div>

    <div class="builder-main">
        <div class="cards-section">
            <div class="filter-panel">
                <div class="filter-grid">
                    <div class="filter-item"><div class="filter-label">🔍 搜索</div><input type="text" id="searchInput" class="search-input" placeholder="卡名/文本/词条"></div>
                    <div class="filter-item"><div class="filter-label">🏳 阵营</div><select id="factionSelect"></select></div>
                    <div class="filter-item"><div class="filter-label">♠️ 类型</div><select id="typeSelect"></select></div>
                    <div class="filter-item"><div class="filter-label">💰 花费</div><select id="costSelect"><option value="all">全部费用</option><option value="0">0K</option><option value="1">1K</option><option value="2">2K</option><option value="3">3K</option><option value="4">4K</option><option value="5">5K</option><option value="6">6K</option><option value="7">7K+</option></select></div>
                    <div class="filter-item"><div class="filter-label">🃏 稀有度</div><select id="raritySelect"><option value="all">全部</option><option value="Standard">普通</option><option value="Limited">限定</option><option value="Special">特殊</option><option value="Elite">精英</option></select></div>
                    <div class="filter-item"><div class="filter-label">📦 扩展包</div><select id="setSelect"></select></div>
                    <div class="filter-item"><div class="filter-label">⚙️ 卡池</div><select id="statusSelect"><option value="all">全部</option><option value="active">活跃</option><option value="reserve">预备</option><option value="spawn">衍生</option></select></div>
                </div>
                <div id="statsArea" style="display: none;">
                    <div class="stats-group">
                        <div class="stats-item"><div class="filter-label">⚔️ 攻击力</div><input type="number" id="attackExact" class="exact-input" placeholder="输入数值" value="-1" min="-1" max="12"></div>
                        <div class="stats-item"><div class="filter-label">🛡️ 防御力</div><input type="number" id="defenseExact" class="exact-input" placeholder="输入数值" value="-1" min="-1" max="12"></div>
                        <div class="stats-item"><div class="filter-label">⚙️ 行动花费</div><input type="number" id="opExact" class="exact-input" placeholder="输入数值" value="-1" min="-1" max="6"></div>
                    </div>
                    <div class="stats-note">※ 仅筛选单位时生效，-1 = 不筛选</div>
                </div>
            </div>
            <div id="cardContainer" class="card-grid">正在寻找敌人...</div>
            <div class="pagination" id="pagination"></div>
        </div>
        <div class="deck-panel" id="deckPanel">
            <div class="deck-header"><span class="deck-title">📋 卡组</span><div class="deck-header-actions"><button class="import-btn" id="importDeckBtn">📥 导入卡组</button><button class="clear-deck" id="clearDeckBtn">清空</button></div></div>
            <div class="nation-selector"><div class="nation-row"><span class="nation-label">主国</span><select id="mainNationSelect"></select></div><div class="nation-row"><span class="nation-label">盟国</span><select id="allyNationSelect"></select></div></div>
            <div class="headquarters-card"><div class="hq-icon-large">🏛️</div><div class="hq-info"><div class="hq-name">总部</div></div></div>
            <div class="stats-header"><button class="stats-btn" id="statsBtn">📊 统计</button></div>
            <div class="deck-list" id="deckListContainer"></div>
        </div>
    </div>
    <div class="footer-simple"><a href="https://github.com/CraftSoul/kards-image-tool" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg"> GitHub</a><a href="https://space.bilibili.com/3546775476505152" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/bilibili.svg"> BiliBili</a></div>
</div>

<div id="statsModal" class="modal-stats"><div class="modal-stats-content"><div class="modal-stats-close" id="statsModalClose">&times;</div><div class="modal-stats-title">📊 费用统计</div><div class="legend"><span><span class="legend-dot" style="background:#e8e4d0;"></span>单位</span><span><span class="legend-dot" style="background:#f5c542;"></span>指令</span><span><span class="legend-dot" style="background:#5a5a5a;"></span>反制</span></div><div id="modalHistogramBars" class="histogram-bars"></div><div id="modalTypeSummary" class="type-summary-modal"></div></div></div>

<div id="importModal" class="import-modal"><div class="import-modal-card"><h3 style="color:#ffe5a3;">📦 导入卡组代码</h3><textarea rows="4" id="deckCodeInput" placeholder="粘贴代码，如 %%15|bK;;bK;bKbK"></textarea><div style="display:flex; gap:12px; justify-content:flex-end;"><button id="confirmImportBtn" class="stats-btn">确认导入（追加）</button><button id="cancelImportBtn" class="clear-deck">取消</button></div><p style="font-size:0.7rem; margin-top:12px;">※ 代码将解析主盟国并追加卡牌数量，支持重复导入叠加</p></div></div>

<script>
    const factionNames = { "soviet":"苏联","usa":"美国","poland":"波兰","neutral":"中立","japan":"日本","italy":"意大利","france":"法国","britain":"英国","finland":"芬兰","germany":"德国" };
    const typeMap = { "infantry":"步兵","tank":"坦克","fighter":"战斗机","bomber":"轰炸机","artillery":"炮兵","order":"指令","countermeasure":"反制" };
    const unitTypes = ["infantry","tank","fighter","bomber","artillery"];
    const rarityNames = { "Standard":"普通","Limited":"限定","Special":"特殊","Elite":"精英" };
    const factionColor = { "germany":"#5A5F55","britain":"#857A60","soviet":"#4F3826","usa":"#434B32","japan":"#90723C","france":"#283454","italy":"#555248","poland":"#645633","finland":"#C9C8BC","neutral":"#6b6e5c" };
    const allNationOptions = ["germany","britain","soviet","usa","japan","france","italy","poland","finland"];
    const nationCodeMap = {1:"germany",2:"britain",3:"japan",4:"soviet",5:"usa",6:"france",7:"italy",8:"poland",9:"finland"};
    
    let allCards = [], filteredCards = [], deckMap = new Map();
    let currentPage = 1, PAGE_SIZE = 20;
    let mainNation = "germany", allyNation = "";

    function getCardImageUrl(imgName) { return imgName ? `https://images.weserv.nl/?url=ssl:www.kards.com/images/card/v48/zh-Hans/${imgName}&q=20` : ""; }
    
    async function loadData() {
        try {
            const res = await fetch('data.json');
            const data = await res.json();
            allCards = (data.cards || []).map((card, idx) => ({
                id: card.id ?? idx, ...card, type: card.json?.type || card.type,
                faction: (card.json?.faction || card.faction || "").toLowerCase(),
                rarity: card.json?.rarity || card.rarity, setName: card.json?.set || card.set || "基础",
                cost: card.json?.kredits ?? (card.json?.cost ?? card.cost ?? 0),
                attack: card.json?.attack ?? card.attack, defense: card.json?.defense ?? card.defense,
                operationCost: card.json?.operationCost ?? card.operationCost,
                text_zh: card.json?.text?.["zh-Hans"] || "无描述", titleZh: card.json?.title?.["zh-Hans"] || card.title?.["zh-Hans"] || "无名",
                image: card.json?.image || card.image, reserved: !!card.reserved, isSpawn: card.json?.set === "OnlySpawnable",
                importId: card.importId, attributes: card.json?.attributes || []
            }));
            initFiltersAndSelects();
            applyFilters();
        } catch(e) { document.getElementById('cardContainer').innerHTML = '<div>数据加载失败</div>'; }
    }

    function initFiltersAndSelects() {
        const factions = [...new Set(allCards.map(c=>c.faction))];
        const types = [...new Set(allCards.map(c=>c.type))];
        const sets = [...new Set(allCards.map(c=>c.setName))];
        document.getElementById('factionSelect').innerHTML = '<option value="all">全部阵营</option>' + factions.map(f => `<option value="${f}">${factionNames[f]||f}</option>`).join('');
        document.getElementById('typeSelect').innerHTML = '<option value="all">全部类型</option>' + types.map(t => `<option value="${t}">${typeMap[t]||t}</option>`).join('');
        document.getElementById('setSelect').innerHTML = '<option value="all">全部扩展</option>' + sets.map(s => `<option value="${s}">${s}</option>`).join('');
        ['factionSelect','typeSelect','costSelect','raritySelect','setSelect','statusSelect','searchInput','attackExact','defenseExact','opExact'].forEach(id => document.getElementById(id)?.addEventListener('change',()=>applyFilters()));
        document.getElementById('searchInput')?.addEventListener('input',()=>applyFilters());
        document.getElementById('typeSelect').addEventListener('change',()=>applyFilters());
        
        const opts = allNationOptions.map(f => `<option value="${f}">${factionNames[f]}</option>`).join('');
        ['mainNationSelect','mobileMainNation'].forEach(id => document.getElementById(id).innerHTML = opts);
        ['allyNationSelect','mobileAllyNation'].forEach(id => document.getElementById(id).innerHTML = opts);
        document.getElementById('mainNationSelect').value = mainNation; document.getElementById('allyNationSelect').value = allyNation;
        document.getElementById('mobileMainNation').value = mainNation; document.getElementById('mobileAllyNation').value = allyNation;
        const updateNation = () => { mainNation = document.getElementById('mainNationSelect').value; allyNation = document.getElementById('allyNationSelect').value; syncMobileNation(); updateAllDecksUI(); };
        const updateMobile = () => { mainNation = document.getElementById('mobileMainNation').value; allyNation = document.getElementById('mobileAllyNation').value; syncDesktopNation(); updateAllDecksUI(); };
        document.getElementById('mainNationSelect').addEventListener('change', updateNation);
        document.getElementById('allyNationSelect').addEventListener('change', updateNation);
        document.getElementById('mobileMainNation').addEventListener('change', updateMobile);
        document.getElementById('mobileAllyNation').addEventListener('change', updateMobile);
    }
    function syncMobileNation() { document.getElementById('mobileMainNation').value = mainNation; document.getElementById('mobileAllyNation').value = allyNation; }
    function syncDesktopNation() { document.getElementById('mainNationSelect').value = mainNation; document.getElementById('allyNationSelect').value = allyNation; }

    function filterCardsLogic() {
        let res = [...allCards];
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        if(search) res = res.filter(c => (c.titleZh+(c.text_zh||"")).toLowerCase().includes(search));
        const f = document.getElementById('factionSelect').value; if(f!=='all') res = res.filter(c=>c.faction===f);
        const t = document.getElementById('typeSelect').value; if(t!=='all') res = res.filter(c=>c.type===t);
        const costVal = document.getElementById('costSelect').value; if(costVal!=='all') { if(costVal==='7') res = res.filter(c=>c.cost>=7); else res = res.filter(c=>c.cost===parseInt(costVal)); }
        const r = document.getElementById('raritySelect').value; if(r!=='all') res = res.filter(c=>c.rarity===r);
        const set = document.getElementById('setSelect').value; if(set!=='all') res = res.filter(c=>c.setName===set);
        const status = document.getElementById('statusSelect').value;
        if(status==='active') res = res.filter(c=>!c.reserved&&!c.isSpawn);
        else if(status==='reserve') res = res.filter(c=>c.reserved);
        else if(status==='spawn') res = res.filter(c=>c.isSpawn);
        
        const selectedType = document.getElementById('typeSelect').value;
        const onlyUnits = selectedType !== 'all' && unitTypes.includes(selectedType);
        document.getElementById('statsArea').style.display = onlyUnits ? 'block' : 'none';
        if(onlyUnits) {
            let att = parseInt(document.getElementById('attackExact').value);
            let def = parseInt(document.getElementById('defenseExact').value);
            let op = parseInt(document.getElementById('opExact').value);
            res = res.filter(c => unitTypes.includes(c.type) && (att===-1 || (c.attack??-2)===att) && (def===-1 || (c.defense??-2)===def) && (op===-1 || (c.operationCost??-2)===op));
        }
        return res;
    }
    function applyFilters() { filteredCards = filterCardsLogic(); currentPage = 1; renderCards(); renderPagination(); }
    function renderCards() { /* 同原有，略保持简洁 */ 
        const start = (currentPage-1)*PAGE_SIZE; const pageCards = filteredCards.slice(start, start+PAGE_SIZE);
        const container = document.getElementById('cardContainer');
        if(!pageCards.length) { container.innerHTML = '<div>未找到卡牌</div>'; return; }
        container.innerHTML = pageCards.map(card => { const qty = deckMap.get(card.id)?.count||0; const borderCol = factionColor[card.faction]||'#6b6e5c'; return `<div class="card-item" data-card-id="${card.id}" style="border-color:${borderCol};"><div class="card-img"><img loading="lazy" src="${getCardImageUrl(card.image)}" alt="${card.titleZh}"></div><div class="card-info"><div class="card-name"><span>${card.titleZh}</span>${card.reserved?'<i class="reserve-icon-sm"></i>':''}</div></div><div class="card-badge-desktop"><span class="card-deck-count">${qty}</span><button class="card-remove-icon" data-remove="${card.id}">−</button></div><div class="card-mobile-actions"><span class="mobile-count-badge">${qty}</span><button class="mobile-remove-btn" data-remove="${card.id}">-</button></div></div>`; }).join('');
        document.querySelectorAll('.card-item').forEach(el=>{ el.addEventListener('click',(e)=>{ if(e.target.classList.contains('card-remove-icon')||e.target.classList.contains('mobile-remove-btn')) return; const id=parseInt(el.dataset.cardId); const card=allCards.find(c=>c.id===id); if(card) addToDeck(card); }); });
        document.querySelectorAll('.card-remove-icon, .mobile-remove-btn').forEach(btn=>btn.addEventListener('click',(e)=>{ e.stopPropagation(); removeFromDeck(parseInt(btn.dataset.remove)); }));
    }
    function renderPagination() { /* 同原有 */ }
    
    function addToDeck(card) { let entry = deckMap.get(card.id); if(entry) entry.count++; else deckMap.set(card.id, { card, count: 1 }); updateAllDecksUI(); renderCards(); }
    function removeFromDeck(cardId) { let entry = deckMap.get(cardId); if(entry) { if(entry.count>1) entry.count--; else deckMap.delete(cardId); updateAllDecksUI(); renderCards(); } }
    function clearDeck() { deckMap.clear(); updateAllDecksUI(); renderCards(); }

    function renderDeckList(containerId) {
        const container = document.getElementById(containerId); if(!container) return;
        if(deckMap.size===0) { container.innerHTML = '<div style="color:#ab9f7c;text-align:center;padding:16px;">暂无卡牌，点击左侧卡片加入</div>'; return; }
        const entries = Array.from(deckMap.values()).sort((a,b)=> (a.card.cost - b.card.cost) || (a.card.titleZh.localeCompare(b.card.titleZh)));
        container.innerHTML = entries.map(entry => { const c = entry.card; const borderColor = factionColor[c.faction] || "#6b6e5c";
            const typeShow = typeMap[c.type] || c.type;
            const opHtml = (c.type && unitTypes.includes(c.type) && c.operationCost!==undefined) ? `<span class="op-cost-badge">⛽ ${c.operationCost}</span>` : '';
            return `<div class="deck-card-row" style="border-left-color:${borderColor};"><div class="deck-card-icon" style="background-image: url('${c.faction}.svg');"></div><div class="deck-card-details"><div class="deck-card-name" title="${c.titleZh}">${c.titleZh}</div><div class="cost-stats"><div class="kredits-cost"><span>${c.cost}</span><span>K</span></div><span class="type-badge">${typeShow}</span>${opHtml}</div></div><span class="deck-card-qty">x${entry.count}</span><button class="deck-remove-btn" data-id="${c.id}">−</button></div>`;
        }).join('');
        container.querySelectorAll('.deck-remove-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); removeFromDeck(parseInt(btn.dataset.id)); }));
    }
    function updateAllDecksUI() { renderDeckList('deckListContainer'); renderDeckList('mobileDeckList'); const total = Array.from(deckMap.values()).reduce((s,e)=>s+e.count,0); document.getElementById('mobileToggleCount').innerText = total; }
    
    // 导入解析
    function importDeckFromCode(rawCode) {
        let code = rawCode.trim();
        const startIdx = code.indexOf("%%");
        if(startIdx === -1) { alert("未找到%%起始标识"); return false; }
        code = code.substring(startIdx+2);
        const barIdx = code.indexOf("|");
        if(barIdx === -1) { alert("无效格式: 缺少|"); return false; }
        const nationPart = code.substring(0, barIdx);
        if(nationPart.length<2) { alert("主盟国代码错误"); return false; }
        const mainCode = parseInt(nationPart[0]), allyCode = parseInt(nationPart[1]);
        if(nationCodeMap[mainCode]) mainNation = nationCodeMap[mainCode];
        if(nationCodeMap[allyCode]) allyNation = nationCodeMap[allyCode];
        syncDesktopNation(); syncMobileNation();
        
        const cardsPart = code.substring(barIdx+1);
        const segments = cardsPart.split(';');
        const counts = [1,2,3,4];
        for(let i=0;i<4;i++) {
            const seg = segments[i] || "";
            for(let j=0;j<seg.length;j+=2) {
                const importId = seg.substring(j, j+2);
                if(importId.length===2) {
                    const targetCard = allCards.find(c => c.importId === importId);
                    if(targetCard) for(let k=0;k<counts[i];k++) addToDeck(targetCard);
                }
            }
        }
        updateAllDecksUI(); renderCards();
        return true;
    }
    
    function showImportModal() { document.getElementById('importModal').style.display = 'flex'; }
    function closeImportModal() { document.getElementById('importModal').style.display = 'none'; }
    
    // 统计
    function showStatsModal() {
        const costMap = {0:{unit:0,order:0,counter:0},1:{unit:0,order:0,counter:0},2:{unit:0,order:0,counter:0},3:{unit:0,order:0,counter:0},4:{unit:0,order:0,counter:0},5:{unit:0,order:0,counter:0},6:{unit:0,order:0,counter:0},7:{unit:0,order:0,counter:0}};
        let unitTotal=0,orderTotal=0,counterTotal=0;
        for(let {card,count} of deckMap.values()) {
            const cat = card.cost>=7?7:card.cost;
            if(card.type==="order") { costMap[cat].order+=count; orderTotal+=count; }
            else if(card.type==="countermeasure") { costMap[cat].counter+=count; counterTotal+=count; }
            else { costMap[cat].unit+=count; unitTotal+=count; }
        }
        const maxHeight = Math.max(...Object.values(costMap).flatMap(v=>[v.unit,v.order,v.counter]),1);
        const barsHtml = [0,1,2,3,4,5,6,7].map(cost => { const u=costMap[cost].unit, o=costMap[cost].order, ct=costMap[cost].counter; const total=u+o+ct; return `<div class="histogram-bar-wrapper"><div class="bar-stack" style="height:${Math.max((u/maxHeight)*48+(o/maxHeight)*48+(ct/maxHeight)*48,4)}px;"><div class="bar-counter" style="height:${(ct/maxHeight)*48}px;"></div><div class="bar-order" style="height:${(o/maxHeight)*48}px;"></div><div class="bar-unit" style="height:${(u/maxHeight)*48}px;"></div></div><div class="bar-label">${cost===7?'7K+':cost+'K'}</div><div class="cost-total">${total}</div></div>`; }).join('');
        document.getElementById('modalHistogramBars').innerHTML = barsHtml;
        document.getElementById('modalTypeSummary').innerHTML = `<span>单位 <span class="unit-badge">${unitTotal}</span></span><span>指令 <span class="order-badge">${orderTotal}</span></span><span>反制 <span class="counter-badge">${counterTotal}</span></span>`;
        document.getElementById('statsModal').style.display = 'flex';
    }
    function closeStatsModal() { document.getElementById('statsModal').style.display = 'none'; }
    
    function initSidebars() {
        const toggle = document.getElementById('mobileDeckToggle'), panel = document.getElementById('mobileDeckPanel'), overlay = document.getElementById('mobileOverlay'), close = document.getElementById('mobileCloseDeck');
        toggle?.addEventListener('click',()=>{ panel.classList.add('open'); overlay.classList.add('show'); });
        close?.addEventListener('click',()=>{ panel.classList.remove('open'); overlay.classList.remove('show'); });
        overlay?.addEventListener('click',()=>{ panel.classList.remove('open'); overlay.classList.remove('show'); });
        document.getElementById('mobileClearDeck')?.addEventListener('click',()=>clearDeck());
        document.getElementById('statsBtn')?.addEventListener('click',showStatsModal);
        document.getElementById('mobileStatsBtn')?.addEventListener('click',showStatsModal);
        document.getElementById('statsModalClose')?.addEventListener('click',closeStatsModal);
        document.getElementById('importDeckBtn')?.addEventListener('click',showImportModal);
        document.getElementById('mobileImportBtn')?.addEventListener('click',showImportModal);
        document.getElementById('confirmImportBtn')?.addEventListener('click',()=>{ const code = document.getElementById('deckCodeInput').value; if(code) importDeckFromCode(code); closeImportModal(); document.getElementById('deckCodeInput').value=''; });
        document.getElementById('cancelImportBtn')?.addEventListener('click',closeImportModal);
        document.getElementById('importModal')?.addEventListener('click',(e)=>{ if(e.target===document.getElementById('importModal')) closeImportModal(); });
    }
    function initNav() { 
        const menuBtn = document.getElementById('menuToggleBtn'), menuDiv = document.getElementById('navMenu'); 
        menuBtn.onclick = (e) => { e.stopPropagation(); menuDiv.classList.toggle('open'); }; 
        document.addEventListener('click', (e) => { if(!menuBtn.contains(e.target) && !menuDiv.contains(e.target)) menuDiv.classList.remove('open'); }); 
        document.getElementById('clearDeckBtn')?.addEventListener('click',()=>clearDeck()); 
    }
    window.addEventListener('load', () => { loadData(); initNav(); initSidebars(); });
</script>
</body>
</html>
