<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>KARDS 军械库 · 卡组构筑</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #2b2b1f;
            background-image: 
                radial-gradient(circle at 20% 40%, rgba(80, 70, 40, 0.4) 2%, transparent 2.5%),
                radial-gradient(circle at 70% 85%, rgba(60, 50, 30, 0.5) 1.8%, transparent 2.2%),
                radial-gradient(circle at 45% 20%, rgba(110, 90, 50, 0.3) 3%, transparent 3.5%),
                repeating-linear-gradient(45deg, #5e5536 0px, #5e5536 2px, #7e6e48 2px, #7e6e48 8px),
                repeating-linear-gradient(135deg, #3e3a2a 0px, #3e3a2a 3px, #5a4e32 3px, #5a4e32 10px);
            background-blend-mode: overlay, normal;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        :root {
            --germany: #5A5F55;
            --britain: #857A60;
            --soviet: #4F3826;
            --usa: #434B32;
            --japan: #90723C;
            --france: #283454;
            --italy: #555248;
            --poland: #645633;
            --finland: #C9C8BC;
            --neutral: #6b6e5c;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 16px 32px;
            display: flex;
            flex-direction: column;
        }

        .nav-bar {
            background: rgba(20, 20, 15, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid #aa8e4e;
            border-radius: 20px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        }
        .nav-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(170, 142, 78, 0.3);
        }
        .nav-brand {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f9f9fc, #e6dbb0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            white-space: nowrap;
        }
        .menu-btn {
            background: rgba(210, 210, 225, 0.12);
            border: 1px solid #aa8e4e;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
        }
        .menu-btn span {
            display: block;
            width: 22px;
            height: 2.5px;
            background-color: #f2e2b0;
            border-radius: 2px;
        }
        .nav-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
            background: rgba(10, 10, 8, 0.98);
        }
        .nav-menu.open { max-height: 320px; }
        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px 20px 20px;
        }
        .menu-link {
            display: block;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 20px;
            border-radius: 60px;
            background: rgba(210, 210, 225, 0.08);
            color: #eef0ff;
            text-align: center;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .menu-link:hover { background: rgba(235, 235, 245, 0.2); border-color: #c9a53b; }
        .menu-link.active {
            background: #c9a53b;
            color: #1e1c10;
            font-weight: 700;
        }

        .builder-main {
            display: flex;
            gap: 24px;
            position: relative;
        }
        .cards-section {
            flex: 3;
            min-width: 0;
        }

        .deck-panel {
            width: 380px;
            flex-shrink: 0;
            background: rgba(10, 12, 8, 0.94);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid #c9aa5b;
            padding: 1rem 0.8rem 1.2rem;
            display: flex;
            flex-direction: column;
            height: fit-content;
            max-height: 85vh;
            position: sticky;
            top: 16px;
            overflow-y: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .deck-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 8px 12px;
            border-bottom: 2px solid #dbba6c;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .deck-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffefbf;
            letter-spacing: 1px;
        }
        .clear-deck {
            background: #4a3720;
            border: none;
            padding: 5px 12px;
            border-radius: 50px;
            color: #f3e1b3;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .clear-deck:hover { background: #aa6f3c; color: white; }
        
        .nation-selector {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 10px 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(170, 142, 78, 0.5);
        }
        .nation-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .nation-label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #f3eaca;
            min-width: 40px;
        }
        .nation-select {
            flex: 1;
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.4rem 0.8rem;
            color: #f5efdb;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
        }

        .stats-header {
            display: flex;
            justify-content: flex-end;
            margin: 12px 0 10px;
        }
        .stats-btn {
            background: #c9a53b;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            color: #1e1c10;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .stats-btn:hover { background: #e6c46a; transform: scale(1.02); }

        .headquarters-card {
            background: linear-gradient(135deg, #e6dbbc, #cfbc88);
            border-radius: 20px;
            padding: 12px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border-left: 8px solid #b8860b;
        }
        .hq-icon-large { font-size: 2rem; }
        .hq-info { flex: 1; }
        .hq-name { font-weight: 800; font-size: 1rem; color: #2c2818; }

        .deck-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 45vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        .deck-card-row {
            background: #0f0f0a;
            border-radius: 16px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 6px solid;
            transition: 0.1s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .deck-card-icon {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 1px 2px black);
        }
        .deck-card-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .deck-card-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #f9edc1;
        }
        .cost-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .kredits-cost {
            background: #000000cc;
            border-radius: 12px;
            padding: 2px 8px;
            font-weight: bold;
            color: #ffd966;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        .deck-card-qty {
            background: rgba(0,0,0,0.7);
            border-radius: 30px;
            padding: 2px 10px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #ffe0a3;
            margin-left: auto;
            min-width: 42px;
            text-align: center;
        }
        .deck-remove-btn {
            background: #5e3c1f;
            border: none;
            color: #ffcf8a;
            border-radius: 30px;
            width: 28px;
            height: 28px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .deck-remove-btn:hover { background: #b6521a; color: white; }

        /* 移动端特有样式：卡片计数和移除控件在下方居中 */
        .mobile-deck-panel .deck-card-row {
            flex-wrap: wrap;
            padding: 10px 12px;
        }
        .mobile-deck-panel .deck-card-icon {
            width: 32px;
            height: 32px;
        }
        .mobile-deck-panel .deck-card-details {
            flex: 1;
            min-width: 120px;
        }
        .mobile-deck-panel .deck-card-qty {
            margin-left: 0;
            order: 3;
            width: auto;
            min-width: 50px;
        }
        .mobile-deck-panel .deck-remove-btn {
            order: 4;
            width: 32px;
            height: 32px;
            font-size: 1.1rem;
        }
        /* 移动端下方控件行居中 */
        .mobile-card-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid rgba(170, 142, 78, 0.3);
        }
        .mobile-card-actions .mobile-qty-badge {
            background: rgba(0,0,0,0.7);
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ffe0a3;
        }
        .mobile-card-actions .mobile-remove-deck {
            background: #5e3c1f;
            border: none;
            color: #ffcf8a;
            border-radius: 30px;
            padding: 4px 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }
        .mobile-deck-panel .deck-card-row .deck-card-qty,
        .mobile-deck-panel .deck-card-row .deck-remove-btn {
            display: none;
        }

        .mobile-deck-toggle {
            display: none;
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #2f2b1c;
            border: 1px solid #c9a63b;
            border-right: none;
            border-radius: 8px 0 0 8px;
            padding: 12px 10px;
            color: #fae7b3;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            min-width: 48px;
        }
        .mobile-deck-toggle .toggle-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.8rem;
        }
        .mobile-deck-toggle .mobile-count-badge-toggle {
            background: #c9a53b;
            color: #1e1c10;
            border-radius: 20px;
            padding: 4px 6px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        
        .mobile-deck-panel {
            position: fixed;
            top: 0;
            right: -85%;
            width: 80%;
            max-width: 360px;
            height: 100vh;
            background: rgba(10, 12, 8, 0.98);
            backdrop-filter: blur(16px);
            border-left: 2px solid #c9aa5b;
            z-index: 1001;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 1rem 0.8rem 1.2rem;
        }
        .mobile-deck-panel.open { right: 0; }
        .mobile-deck-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px 12px;
            border-bottom: 2px solid #dbba6c;
        }
        .mobile-close-deck {
            background: none;
            border: none;
            color: #ffefbf;
            font-size: 1.6rem;
            cursor: pointer;
        }
        .mobile-deck-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .mobile-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
        }
        .mobile-overlay.show { display: block; }
        
        @media (max-width: 860px) {
            .builder-main { flex-direction: column; }
            .deck-panel { display: none; }
            .mobile-deck-toggle { display: flex; }
        }

        /* 模态框样式 */
        .modal-stats {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-stats-content {
            background: #1a1c12;
            border-radius: 32px;
            border: 2px solid #c9aa5b;
            max-width: 700px;
            width: 100%;
            padding: 20px 24px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
        }
        .modal-stats-close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 28px;
            cursor: pointer;
            color: #e9d49c;
            background: rgba(0,0,0,0.5);
            width: 32px;
            height: 32px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-stats-close:hover { background: #c9a53b; color: #1e1c10; }
        .modal-stats-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffefbf;
            text-align: center;
            margin-bottom: 20px;
        }
        .histogram-bars {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            gap: 2px;
            margin: 20px 0;
        }
        .histogram-bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }
        .bar-stack {
            display: flex;
            flex-direction: column-reverse;
            width: 100%;
            max-width: 48px;
            min-width: 28px;
            background: #2a2a1c;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .bar-stack:hover { transform: scaleX(1.02); }
        .bar-unit { background-color: #e8e4d0; transition: height 0.2s; }
        .bar-order { background-color: #f5c542; }
        .bar-counter { background-color: #5a5a5a; }
        .bar-label {
            font-size: 0.7rem;
            color: #f5eaca;
            text-align: center;
            margin-top: 6px;
            font-weight: bold;
        }
        /* 点击显示的提示框 */
        .click-tooltip {
            font-size: 0.65rem;
            color: #ffefb9;
            background: rgba(0,0,0,0.9);
            padding: 4px 10px;
            border-radius: 16px;
            margin-top: 6px;
            text-align: center;
            white-space: nowrap;
            display: none;
        }
        .click-tooltip.show {
            display: block;
        }
        .type-summary-modal {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #aa8e4e;
        }
        .type-summary-modal span {
            font-weight: bold;
            font-size: 1rem;
            margin-left: 6px;
        }
        .unit-badge { color: #e8e4d0; }
        .order-badge { color: #f5c542; }
        .counter-badge { color: #a0a0a0; }
        .legend {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 0.7rem;
        }
        .legend-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 4px;
        }

        .filter-panel {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(170, 142, 78, 0.5);
        }
        .filter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }
        .filter-item {
            flex: 1;
            min-width: 130px;
        }
        .filter-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e9dbbd;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }
        select, .search-input {
            width: 100%;
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.55rem 1rem;
            color: #f5efdb;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23dbb45c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 1rem center;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        @media (max-width: 680px) {
            .card-grid { grid-template-columns: repeat(4, 1fr); gap: 0.7rem; }
        }
        .card-item {
            background: #111812;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid;
            position: relative;
        }
        .card-img {
            width: 100%;
            aspect-ratio: 500 / 702;
            background: #0a0f0c;
        }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 0.5rem 0.6rem 0.7rem; background: rgba(0,0,0,0.75); }
        .card-name {
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            color: #faf0cf;
        }
        .reserve-icon-sm {
            width: 14px;
            height: 14px;
            background: url('reserve.png') no-repeat center;
            background-size: contain;
            display: inline-block;
        }
        .card-badge-desktop {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            padding: 3px 8px;
            border-radius: 40px;
            align-items: center;
            z-index: 5;
        }
        .card-deck-count {
            background: #000000cc;
            color: #ffeaad;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 30px;
        }
        .card-remove-icon {
            background: #5e3019;
            border: none;
            color: #ffcf8a;
            border-radius: 30px;
            width: 22px;
            height: 22px;
            cursor: pointer;
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
            gap: 6px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: #2d2a1d;
            border: 1px solid #a3874b;
            padding: 5px 12px;
            border-radius: 40px;
            color: #f5eaca;
            cursor: pointer;
        }
        .footer-simple {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #928451;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }
        .footer-simple a { text-decoration: none; color: #f8efcf; background: rgba(0,0,0,0.4); padding: 0.4rem 1rem; border-radius: 40px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="nav-bar"><div class="nav-header-row"><div class="nav-brand">KARDS 军械库 · 卡组构筑</div><div class="menu-btn" id="menuToggleBtn"><span></span><span></span><span></span></div></div>
    <div class="nav-menu" id="navMenu"><div class="menu-links"><a class="menu-link" href="index.html">卡牌收藏</a><a class="menu-link active" href="#">卡组构筑</a><a class="menu-link" href="seek.html">英文直检</a><a class="menu-link" href="#">关于军械库</a></div></div></div>

    <div class="mobile-deck-toggle" id="mobileDeckToggle"><span class="toggle-text">卡组</span><span class="mobile-count-badge-toggle" id="mobileToggleCount">0</span><span>▶</span></div>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <div class="mobile-deck-panel" id="mobileDeckPanel">
        <div class="mobile-deck-header"><span class="deck-title">📋 我的卡组</span><button class="mobile-close-deck" id="mobileCloseDeck">✕</button></div>
        <div class="nation-selector"><div class="nation-row"><span class="nation-label">主国</span><select id="mobileMainNation"></select></div><div class="nation-row"><span class="nation-label">盟国</span><select id="mobileAllyNation"></select></div></div>
        <div class="headquarters-card"><div class="hq-icon-large">🏛️</div><div class="hq-info"><div class="hq-name">总部</div></div></div>
        <div class="stats-header"><button class="stats-btn" id="mobileStatsBtn">📊 统计</button></div>
        <div class="mobile-deck-list" id="mobileDeckList"></div>
        <button class="clear-deck" id="mobileClearDeck" style="margin-top:12px;">清空卡组</button>
    </div>

    <div class="builder-main">
        <div class="cards-section">
            <div class="filter-panel"><div class="filter-grid"><div class="filter-item"><div class="filter-label">🔍 搜索</div><input type="text" id="searchInput" class="search-input" placeholder="卡名 / 文本"></div><div class="filter-item"><div class="filter-label">🏳 阵营</div><select id="factionSelect"></select></div><div class="filter-item"><div class="filter-label">♠️ 类型</div><select id="typeSelect"></select></div><div class="filter-item"><div class="filter-label">💰 花费</div><select id="costSelect"><option value="all">全部费用</option><option value="0">0K</option><option value="1">1K</option><option value="2">2K</option><option value="3">3K</option><option value="4">4K</option><option value="5">5K</option><option value="6">6K</option><option value="7">7K+</option></select></div><div class="filter-item"><div class="filter-label">🃏 稀有度</div><select id="raritySelect"><option value="all">全部</option><option value="Standard">普通</option><option value="Limited">限定</option><option value="Special">特殊</option><option value="Elite">精英</option></select></div><div class="filter-item"><div class="filter-label">📦 扩展包</div><select id="setSelect"></select></div><div class="filter-item"><div class="filter-label">⚙️ 卡池</div><select id="statusSelect"><option value="all">全部</option><option value="active">活跃</option><option value="reserve">预备</option><option value="spawn">衍生</option></select></div></div></div>
            <div id="cardContainer" class="card-grid">加载中...</div>
            <div class="pagination" id="pagination"></div>
        </div>
        <div class="deck-panel" id="deckPanel">
            <div class="deck-header"><span class="deck-title">📋 我的卡组</span><button class="clear-deck" id="clearDeckBtn">清空卡组</button></div>
            <div class="nation-selector"><div class="nation-row"><span class="nation-label">主国</span><select id="mainNationSelect"></select></div><div class="nation-row"><span class="nation-label">盟国</span><select id="allyNationSelect"></select></div></div>
            <div class="headquarters-card"><div class="hq-icon-large">🏛️</div><div class="hq-info"><div class="hq-name">总部</div></div></div>
            <div class="stats-header"><button class="stats-btn" id="statsBtn">📊 统计</button></div>
            <div class="deck-list" id="deckListContainer"></div>
        </div>
    </div>
    <div class="footer-simple"><a href="https://github.com/CraftSoul/kards-image-tool" target="_blank">GitHub</a><a href="https://space.bilibili.com/3546775476505152" target="_blank">BiliBili</a></div>
</div>

<!-- 统计模态框 -->
<div id="statsModal" class="modal-stats">
    <div class="modal-stats-content">
        <div class="modal-stats-close" id="statsModalClose">&times;</div>
        <div class="modal-stats-title">📊 卡组费用分布</div>
        <div class="legend">
            <span><span class="legend-dot" style="background:#e8e4d0;"></span>单位</span>
            <span><span class="legend-dot" style="background:#f5c542;"></span>指令</span>
            <span><span class="legend-dot" style="background:#5a5a5a;"></span>反制</span>
        </div>
        <div id="modalHistogramBars" class="histogram-bars"></div>
        <div id="modalTypeSummary" class="type-summary-modal"></div>
    </div>
</div>

<script>
    const factionNames = { "soviet":"苏联","usa":"美国","poland":"波兰","neutral":"中立","japan":"日本","italy":"意大利","france":"法国","britain":"英国","finland":"芬兰","germany":"德国" };
    const factionColor = { "germany":"#5A5F55","britain":"#857A60","soviet":"#4F3826","usa":"#434B32","japan":"#90723C","france":"#283454","italy":"#555248","poland":"#645633","finland":"#C9C8BC","neutral":"#6b6e5c" };
    const allNationOptions = ["germany","britain","soviet","usa","japan","france","italy","poland","finland"];
    let allCards = [], filteredCards = [], deckMap = new Map();
    let currentPage = 1, PAGE_SIZE = 20;
    let mainNation = "germany", allyNation = "";

    function getCardImageUrl(imgName) { return imgName ? `https://images.weserv.nl/?url=ssl:www.kards.com/images/card/v48/zh-Hans/${imgName}&q=20` : ""; }

    async function loadData() {
        try {
            const res = await fetch('data.json');
            const data = await res.json();
            allCards = (data.cards || []).map((card, idx) => {
                let rawFaction = (card.json?.faction || card.faction || "").toLowerCase();
                return { id: card.id ?? idx, ...card, type: card.json?.type || card.type, faction: rawFaction, rarity: card.json?.rarity || card.rarity, setName: card.json?.set || card.set || "基础", cost: card.json?.kredits ?? (card.json?.cost ?? card.cost ?? 0), text_zh: card.json?.text?.["zh-Hans"] || "无描述", titleZh: card.json?.title?.["zh-Hans"] || card.title?.["zh-Hans"] || "无名", image: card.json?.image || card.image, reserved: !!card.reserved, isSpawn: card.json?.set === "OnlySpawnable" };
            });
            initFiltersAndSelects();
            applyFilters();
        } catch(e) { document.getElementById('cardContainer').innerHTML = '<div>数据加载失败</div>'; }
    }

    function initFiltersAndSelects() {
        const factions = [...new Set(allCards.map(c=>c.faction))];
        const types = [...new Set(allCards.map(c=>c.type))];
        const sets = [...new Set(allCards.map(c=>c.setName))];
        document.getElementById('factionSelect').innerHTML = '<option value="all">全部阵营</option>' + factions.map(f => `<option value="${f}">${factionNames[f]||f}</option>`).join('');
        document.getElementById('typeSelect').innerHTML = '<option value="all">全部类型</option>' + types.map(t => `<option value="${t}">${t}</option>`).join('');
        document.getElementById('setSelect').innerHTML = '<option value="all">全部扩展</option>' + sets.map(s => `<option value="${s}">${s}</option>`).join('');
        ['factionSelect','typeSelect','costSelect','raritySelect','setSelect','statusSelect','searchInput'].forEach(id => document.getElementById(id)?.addEventListener('change',()=>applyFilters()));
        document.getElementById('searchInput')?.addEventListener('input',()=>applyFilters());

        const optionsHtml = allNationOptions.map(f => `<option value="${f}">${factionNames[f]}</option>`).join('');
        ['mainNationSelect', 'mobileMainNation'].forEach(id => { document.getElementById(id).innerHTML = optionsHtml; });
        ['allyNationSelect', 'mobileAllyNation'].forEach(id => { document.getElementById(id).innerHTML = optionsHtml; });
        document.getElementById('mainNationSelect').value = mainNation;
        document.getElementById('allyNationSelect').value = allyNation;
        document.getElementById('mobileMainNation').value = mainNation;
        document.getElementById('mobileAllyNation').value = allyNation;
        const updateNation = () => { mainNation = document.getElementById('mainNationSelect').value; allyNation = document.getElementById('allyNationSelect').value; document.getElementById('mobileMainNation').value = mainNation; document.getElementById('mobileAllyNation').value = allyNation; updateAllDecksUI(); };
        const updateMobile = () => { mainNation = document.getElementById('mobileMainNation').value; allyNation = document.getElementById('mobileAllyNation').value; document.getElementById('mainNationSelect').value = mainNation; document.getElementById('allyNationSelect').value = allyNation; updateAllDecksUI(); };
        document.getElementById('mainNationSelect').addEventListener('change', updateNation);
        document.getElementById('allyNationSelect').addEventListener('change', updateNation);
        document.getElementById('mobileMainNation').addEventListener('change', updateMobile);
        document.getElementById('mobileAllyNation').addEventListener('change', updateMobile);
    }

    function filterCardsLogic() { 
        let res = [...allCards]; 
        const search = document.getElementById('searchInput').value.trim().toLowerCase(); 
        if(search) res = res.filter(c => (c.titleZh+(c.text_zh||"")).toLowerCase().includes(search)); 
        const f = document.getElementById('factionSelect').value; if(f!=='all') res = res.filter(c=>c.faction===f);
        const t = document.getElementById('typeSelect').value; if(t!=='all') res = res.filter(c=>c.type===t);
        const costVal = document.getElementById('costSelect').value; if(costVal!=='all') { if(costVal==='7') res = res.filter(c=>c.cost>=7); else res = res.filter(c=>c.cost===parseInt(costVal)); }
        const r = document.getElementById('raritySelect').value; if(r!=='all') res = res.filter(c=>c.rarity===r);
        const set = document.getElementById('setSelect').value; if(set!=='all') res = res.filter(c=>c.setName===set);
        const status = document.getElementById('statusSelect').value;
        if(status==='active') res = res.filter(c=>!c.reserved&&!c.isSpawn);
        else if(status==='reserve') res = res.filter(c=>c.reserved);
        else if(status==='spawn') res = res.filter(c=>c.isSpawn);
        return res;
    }
    function applyFilters() { filteredCards = filterCardsLogic(); currentPage = 1; renderCards(); renderPagination(); }
    function renderCards() { 
        const start = (currentPage-1)*PAGE_SIZE; const pageCards = filteredCards.slice(start, start+PAGE_SIZE); 
        const container = document.getElementById('cardContainer'); 
        if(!pageCards.length) { container.innerHTML = '<div>未找到卡牌</div>'; return; } 
        container.innerHTML = pageCards.map(card => { 
            const qty = deckMap.get(card.id)?.count || 0; 
            const borderCol = factionColor[card.faction] || '#6b6e5c'; 
            const reserveMark = card.reserved ? '<i class="reserve-icon-sm"></i>' : '';
            return `<div class="card-item" data-card-id="${card.id}" style="border-color:${borderCol};">
                        <div class="card-img"><img loading="lazy" src="${getCardImageUrl(card.image)}" alt="${card.titleZh}"></div>
                        <div class="card-info"><div class="card-name"><span>${card.titleZh}</span>${reserveMark}</div></div>
                        ${qty>0?`<div class="card-badge-desktop"><span class="card-deck-count">${qty}</span><button class="card-remove-icon" data-remove="${card.id}">−</button></div>`:''}
                    </div>`; 
        }).join(''); 
        document.querySelectorAll('.card-item').forEach(el=>{ 
            el.addEventListener('click',(e)=>{ if(e.target.classList.contains('card-remove-icon')) return; const id = parseInt(el.dataset.cardId); const card = allCards.find(c=>c.id===id); if(card) addToDeck(card); }); 
        }); 
        document.querySelectorAll('.card-remove-icon').forEach(btn=>btn.addEventListener('click',(e)=>{ e.stopPropagation(); removeFromDeck(parseInt(btn.dataset.remove)); })); 
    }
    function renderPagination() { 
        const total = filteredCards.length, pages = Math.ceil(total/PAGE_SIZE); 
        const pagDiv = document.getElementById('pagination'); 
        if(pages<=1) { pagDiv.innerHTML=''; return; } 
        let html = `<button class="page-btn" data-page="prev" ${currentPage===1?'disabled':''}>◀</button>`; 
        for(let i=1;i<=pages;i++) html += `<button class="page-btn ${i===currentPage?'active-page':''}" data-page="${i}">${i}</button>`; 
        html += `<button class="page-btn" data-page="next" ${currentPage===pages?'disabled':''}>▶</button>`; 
        pagDiv.innerHTML = html; 
        pagDiv.querySelectorAll('.page-btn').forEach(btn=>btn.addEventListener('click',()=>{ let p = btn.dataset.page; if(p==='prev') currentPage = Math.max(1, currentPage-1); else if(p==='next') currentPage = Math.min(pages, currentPage+1); else currentPage = parseInt(p); renderCards(); renderPagination(); })); 
    }
    
    function addToDeck(card) { let entry = deckMap.get(card.id); if(entry) entry.count++; else deckMap.set(card.id, { card, count: 1 }); updateAllDecksUI(); renderCards(); }
    function removeFromDeck(cardId) { let entry = deckMap.get(cardId); if(entry) { if(entry.count>1) entry.count--; else deckMap.delete(cardId); updateAllDecksUI(); renderCards(); } }
    function clearDeck() { deckMap.clear(); updateAllDecksUI(); renderCards(); }

    function getCostCategory(cost) { return cost >= 7 ? 7 : cost; }
    function getTypeCategory(type) { if(type === "order") return "order"; if(type === "countermeasure") return "countermeasure"; return "unit"; }
    
    function showStatsModal() {
        const costMap = { 0:{unit:0,order:0,counter:0},1:{unit:0,order:0,counter:0},2:{unit:0,order:0,counter:0},3:{unit:0,order:0,counter:0},4:{unit:0,order:0,counter:0},5:{unit:0,order:0,counter:0},6:{unit:0,order:0,counter:0},7:{unit:0,order:0,counter:0} };
        let unitTotal=0, orderTotal=0, counterTotal=0;
        for(let {card, count} of deckMap.values()) {
            const cat = getCostCategory(card.cost);
            const typeCat = getTypeCategory(card.type);
            if(typeCat === "unit") { costMap[cat].unit += count; unitTotal += count; }
            else if(typeCat === "order") { costMap[cat].order += count; orderTotal += count; }
            else { costMap[cat].counter += count; counterTotal += count; }
        }
        const maxHeight = Math.max(...Object.values(costMap).flatMap(v=>[v.unit, v.order, v.counter]), 1);
        const barWidth = 100 / 8;
        
        const barsHtml = [0,1,2,3,4,5,6,7].map(cost => {
            const unitH = costMap[cost].unit, orderH = costMap[cost].order, counterH = costMap[cost].counter;
            const totalH = unitH + orderH + counterH;
            const unitPercent = maxHeight ? (unitH / maxHeight) * 48 : 0;
            const orderPercent = maxHeight ? (orderH / maxHeight) * 48 : 0;
            const counterPercent = maxHeight ? (counterH / maxHeight) * 48 : 0;
            const tooltipText = `单位:${unitH}  指令:${orderH}  反制:${counterH}  总计:${totalH}`;
            return `<div class="histogram-bar-wrapper" style="width:${barWidth}%; max-width:60px; min-width:32px;">
                        <div class="bar-stack" style="height:${Math.max(unitPercent+orderPercent+counterPercent, 4)}px; width:100%;" data-tooltip="${tooltipText}">
                            <div class="bar-counter" style="height:${counterPercent}px; background:#5a5a5a;"></div>
                            <div class="bar-order" style="height:${orderPercent}px; background:#f5c542;"></div>
                            <div class="bar-unit" style="height:${unitPercent}px; background:#e8e4d0;"></div>
                        </div>
                        <div class="bar-label">${cost===7?'7K+':cost+'K'}</div>
                        <div class="click-tooltip" id="tooltip-${cost}"></div>
                    </div>`;
        }).join('');
        
        document.getElementById('modalHistogramBars').innerHTML = barsHtml;
        document.getElementById('modalTypeSummary').innerHTML = `
            <span>🎖️ 单位总数: <span class="unit-badge">${unitTotal}</span></span>
            <span>📜 指令总数: <span class="order-badge">${orderTotal}</span></span>
            <span>🛡️ 反制总数: <span class="counter-badge">${counterTotal}</span></span>
        `;
        
        // 为每个柱状图添加点击显示详细数量
        document.querySelectorAll('.bar-stack').forEach((bar, idx) => {
            const tooltipDiv = bar.parentElement.querySelector('.click-tooltip');
            const tooltipText = bar.getAttribute('data-tooltip');
            if (tooltipDiv && tooltipText) {
                bar.style.cursor = 'pointer';
                bar.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // 隐藏其他所有tooltip
                    document.querySelectorAll('.click-tooltip').forEach(t => t.classList.remove('show'));
                    tooltipDiv.innerHTML = tooltipText;
                    tooltipDiv.classList.add('show');
                });
            }
        });
        
        // 点击模态框其他区域关闭tooltip
        document.getElementById('modalHistogramBars').addEventListener('click', (e) => {
            if (!e.target.closest('.bar-stack')) {
                document.querySelectorAll('.click-tooltip').forEach(t => t.classList.remove('show'));
            }
        });
        
        document.getElementById('statsModal').style.display = 'flex';
    }
    
    function closeStatsModal() { document.getElementById('statsModal').style.display = 'none'; }

    function updateAllDecksUI() { 
        renderDeckList('deckListContainer'); 
        renderMobileDeckList(); 
        const total = Array.from(deckMap.values()).reduce((s,e)=>s+e.count,0); 
        document.getElementById('mobileToggleCount').innerText = total; 
    }
    
    function renderDeckList(containerId) {
        const container = document.getElementById(containerId); if(!container) return; 
        if(deckMap.size===0) { container.innerHTML = '<div style="color:#ab9f7c;text-align:center;padding:16px;">暂无卡牌，点击左侧卡片加入</div>'; return; }
        const entries = Array.from(deckMap.values()).sort((a,b)=> (a.card.cost - b.card.cost) || (a.card.titleZh.localeCompare(b.card.titleZh)));
        container.innerHTML = entries.map(entry => { 
            const c = entry.card; const borderColor = factionColor[c.faction] || "#6b6e5c"; 
            return `<div class="deck-card-row" style="border-left-color: ${borderColor};">
                        <div class="deck-card-icon" style="background-image: url('${c.faction}.svg');"></div>
                        <div class="deck-card-details">
                            <div class="deck-card-name">${c.titleZh}</div>
                            <div class="cost-stats"><div class="kredits-cost"><span>${c.cost}</span><span>K</span></div></div>
                        </div>
                        <span class="deck-card-qty">x${entry.count}</span>
                        <button class="deck-remove-btn" data-id="${c.id}">−</button>
                    </div>`; 
        }).join('');
        container.querySelectorAll('.deck-remove-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); removeFromDeck(parseInt(btn.dataset.id)); }));
    }
    
    // 移动端专用渲染：计数和移除控件在下方居中
    function renderMobileDeckList() {
        const container = document.getElementById('mobileDeckList'); if(!container) return; 
        if(deckMap.size===0) { container.innerHTML = '<div style="color:#ab9f7c;text-align:center;padding:16px;">暂无卡牌，点击左侧卡片加入</div>'; return; }
        const entries = Array.from(deckMap.values()).sort((a,b)=> (a.card.cost - b.card.cost) || (a.card.titleZh.localeCompare(b.card.titleZh)));
        container.innerHTML = entries.map(entry => { 
            const c = entry.card; const borderColor = factionColor[c.faction] || "#6b6e5c"; 
            return `<div class="deck-card-row" style="border-left-color: ${borderColor};">
                        <div class="deck-card-icon" style="background-image: url('${c.faction}.svg');"></div>
                        <div class="deck-card-details">
                            <div class="deck-card-name">${c.titleZh}</div>
                            <div class="cost-stats"><div class="kredits-cost"><span>${c.cost}</span><span>K</span></div></div>
                        </div>
                        <div class="mobile-card-actions">
                            <span class="mobile-qty-badge">x${entry.count}</span>
                            <button class="mobile-remove-deck" data-id="${c.id}">移除</button>
                        </div>
                    </div>`; 
        }).join('');
        container.querySelectorAll('.mobile-remove-deck').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); removeFromDeck(parseInt(btn.dataset.id)); }));
    }
    
    function initSidebars() {
        const toggle = document.getElementById('mobileDeckToggle'), panel = document.getElementById('mobileDeckPanel'), overlay = document.getElementById('mobileOverlay'), close = document.getElementById('mobileCloseDeck');
        toggle?.addEventListener('click',()=>{ panel.classList.add('open'); overlay.classList.add('show'); });
        close?.addEventListener('click',()=>{ panel.classList.remove('open'); overlay.classList.remove('show'); });
        overlay?.addEventListener('click',()=>{ panel.classList.remove('open'); overlay.classList.remove('show'); });
        document.getElementById('mobileClearDeck')?.addEventListener('click',()=>clearDeck());
        document.getElementById('statsBtn')?.addEventListener('click',showStatsModal);
        document.getElementById('mobileStatsBtn')?.addEventListener('click',showStatsModal);
        document.getElementById('statsModalClose')?.addEventListener('click',closeStatsModal);
        document.getElementById('statsModal')?.addEventListener('click',(e)=>{ if(e.target === document.getElementById('statsModal')) closeStatsModal(); });
    }
    
    function initNav() { 
        const menuBtn = document.getElementById('menuToggleBtn'), menuDiv = document.getElementById('navMenu'); 
        menuBtn.onclick = (e) => { e.stopPropagation(); menuDiv.classList.toggle('open'); }; 
        document.addEventListener('click', (e) => { if(!menuBtn.contains(e.target) && !menuDiv.contains(e.target)) menuDiv.classList.remove('open'); }); 
        document.getElementById('clearDeckBtn')?.addEventListener('click',()=>clearDeck()); 
    }
    
    window.addEventListener('load', () => { loadData(); initNav(); initSidebars(); });
</script>
</body>
</html>
