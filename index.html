<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>KARDS 军械库 | 卡牌收藏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #2b2b1f;
            background-image:
                radial-gradient(circle at 20% 40%, rgba(80, 70, 40, 0.4) 2%, transparent 2.5%),
                radial-gradient(circle at 70% 85%, rgba(60, 50, 30, 0.5) 1.8%, transparent 2.2%),
                radial-gradient(circle at 45% 20%, rgba(110, 90, 50, 0.3) 3%, transparent 3.5%),
                repeating-linear-gradient(45deg, #5e5536 0px, #5e5536 2px, #7e6e48 2px, #7e6e48 8px),
                repeating-linear-gradient(135deg, #3e3a2a 0px, #3e3a2a 3px, #5a4e32 3px, #5a4e32 10px);
            background-blend-mode: overlay, normal;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }
        :root {
            --germany: #5A5F55;
            --britain: #857A60;
            --soviet: #4F3826;
            --usa: #434B32;
            --japan: #90723C;
            --france: #283454;
            --italy: #555248;
            --poland: #645633;
            --finland: #C9C8BC;
            --anzac: #9E6F34;
            --neutral: #6b6e5c;
        }
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 16px 32px;
        }
        .nav-bar {
            background: rgba(20, 20, 15, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid #aa8e4e;
            border-radius: 20px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
        }
        .nav-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(170, 142, 78, 0.3);
        }
        .nav-brand {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f9f9fc, #e6dbb0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            white-space: nowrap;
        }
        .menu-btn {
            background: rgba(210, 210, 225, 0.12);
            border: 1px solid #aa8e4e;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
        }
        .menu-btn span {
            display: block;
            width: 22px;
            height: 2.5px;
            background-color: #f2e2b0;
            border-radius: 2px;
        }
        .nav-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
            background: rgba(10, 10, 8, 0.98);
        }
        .nav-menu.open {
            max-height: 400px;
        }
        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px 20px 20px;
        }
        .menu-link {
            display: block;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 20px;
            border-radius: 60px;
            background: rgba(210, 210, 225, 0.08);
            color: #eef0ff;
            text-align: center;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .menu-link:hover {
            background: rgba(235, 235, 245, 0.2);
            border-color: #c9a53b;
        }
        .menu-link.active {
            background: #c9a53b;
            color: #1e1c10;
            font-weight: 700;
        }
        .filter-panel {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 1.2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(170, 142, 78, 0.6);
        }
        .filter-group {
            margin-bottom: 1.2rem;
            border-bottom: 1px dashed rgba(170, 142, 78, 0.3);
            padding-bottom: 0.8rem;
        }
        .filter-group-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e9dbbd;
            margin-bottom: 0.6rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .filter-group-title .collapse-icon {
            font-size: 0.8rem;
            transition: transform 0.2s;
            margin-left: 8px;
        }
        .filter-group-title .collapse-icon.collapsed {
            transform: rotate(-90deg);
        }
        .filter-group-body {
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            max-height: 600px;
        }
        .filter-group-body.collapsed {
            max-height: 0;
        }
        .multi-select-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .filter-chip {
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.35rem 0.9rem;
            font-size: 0.8rem;
            color: #e9dbbd;
            cursor: pointer;
            transition: all 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .filter-chip.active {
            background: #c9a53b;
            color: #1e1c10;
            border-color: #c9a53b;
            font-weight: 600;
        }
        .filter-chip img {
            width: 18px;
            height: 18px;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3));
        }
        .reset-chip {
            background: #2a2618;
            border-color: #b69654;
            font-size: 0.7rem;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            cursor: pointer;
            color: #e9dbbd;
        }
        .row-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
            margin-bottom: 0.8rem;
        }
        .filter-item {
            flex: 1;
            min-width: 130px;
        }
        .filter-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e9dbbd;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }
        select,
        .search-input {
            width: 100%;
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.55rem 1rem;
            color: #f5efdb;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }
        .search-input {
            background-image: none;
        }
        .stats-group {
            margin-top: 0.8rem;
            padding-top: 0.5rem;
            border-top: 1px dashed rgba(170, 142, 78, 0.4);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .stats-item {
            flex: 1;
            min-width: 100px;
        }
        .exact-input {
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.4rem 0.8rem;
            width: 100%;
            color: #f5efdb;
            text-align: center;
        }
        .stats-note {
            font-size: 0.7rem;
            color: #c9b06b;
            margin-top: 6px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        @media (max-width: 680px) {
            .card-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 0.7rem;
            }
        }
        @media (max-width: 480px) {
            .card-grid {
                gap: 0.6rem;
            }
        }
        .card-item {
            background: #111812;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.2s;
            cursor: pointer;
            border: 2px solid;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        .card-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }
        .card-img {
            width: 100%;
            aspect-ratio: 500 / 702;
            background: #0a0f0c;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 0;
            transition: filter 0.25s, opacity 0.25s;
        }
        .card-img img.loading {
            filter: blur(6px);
            opacity: 0.5;
        }
        .card-info {
            padding: 0.5rem 0.6rem 0.7rem;
            background: rgba(0, 0, 0, 0.75);
        }
        .card-name {
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            color: #faf0cf;
        }
        .card-name span:first-child {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reserve-icon-sm {
            width: 14px;
            height: 14px;
            background: url('reserve.png') no-repeat center;
            background-size: contain;
            display: inline-block;
            flex-shrink: 0;
        }
        @media (max-width: 560px) {
            .card-name {
                font-size: 0.65rem;
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: flex-start;
            justify-content: center;
            overflow-y: auto;
            padding: 20px 16px;
        }
        .modal-content {
            background: #121a14;
            max-width: 680px;
            width: 100%;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 3px solid;
            box-shadow: 0 20px 40px black;
            margin: 8px auto;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 28px;
            cursor: pointer;
            z-index: 25;
            color: #f0e6cc;
            background: rgba(0, 0, 0, 0.6);
            width: 36px;
            height: 36px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-left {
            background: #0e120f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px 16px;
            border-top-left-radius: 26px;
            border-top-right-radius: 26px;
        }
        .modal-right {
            padding: 20px 22px 28px;
            background: #101813;
            display: flex;
            flex-direction: column;
            gap: 16px;
            color: #fef6e6;
            border-bottom-left-radius: 26px;
            border-bottom-right-radius: 26px;
        }
        .modal-img-wrap {
            position: relative;
            width: 100%;
            max-width: 280px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 18px black;
        }
        .modal-img-wrap img {
            width: 100%;
            display: block;
            transition: filter 0.25s, opacity 0.25s;
        }
        .modal-img-wrap img.loading {
            filter: blur(6px);
            opacity: 0.5;
        }
        .modal-actions {
            display: flex;
            gap: 16px;
            margin-top: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .action-btn,
        .version-select {
            background: #2a2a1c;
            border: 1px solid #b69654;
            padding: 6px 14px;
            border-radius: 32px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #f5efdb;
        }
        .version-select {
            background: #1e1c16;
        }
        .lang-switch {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .lang-btn {
            background: #2e2a1c;
            border: 1px solid #b69654;
            padding: 4px 12px;
            border-radius: 40px;
            color: #f7ebc6;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .lang-btn.active {
            background: #c9a63b;
            color: #161a0c;
        }
        .faction-icon-lg {
            width: 30px;
            height: 30px;
            vertical-align: middle;
            margin-right: 10px;
            filter: drop-shadow(0 1px 2px black);
        }
        .reserve-badge {
            width: 22px;
            height: 22px;
            background: url('reserve.png') no-repeat center;
            background-size: contain;
            display: inline-block;
            margin-left: 8px;
            vertical-align: middle;
        }
        .badge-stat {
            background: #1e2a1f;
            border-radius: 32px;
            padding: 6px 14px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid;
        }
        .detail-line {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .related-section {
            margin-top: 8px;
            border-top: 1px solid rgba(170, 142, 78, 0.3);
            padding-top: 12px;
            display: none;
        }
        .related-section.visible {
            display: block;
        }
        .related-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #c9b06b;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }
        .related-card-item {
            background: #1a1f1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #3a3f3a;
            transition: transform 0.1s, border-color 0.2s;
        }
        .related-card-item:hover {
            transform: translateY(-2px);
            border-color: #c9a53b;
        }
        .related-card-item .card-img {
            aspect-ratio: 500 / 702;
            background: #0a0f0c;
        }
        .related-card-item .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .related-card-item .card-info {
            padding: 4px 6px 6px;
            background: rgba(0, 0, 0, 0.7);
        }
        .related-card-item .card-name {
            font-size: 0.6rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
            gap: 6px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: #2d2a1d;
            border: 1px solid #a3874b;
            padding: 5px 12px;
            border-radius: 40px;
            color: #f5eaca;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .page-btn.active-page {
            background: #c9a53b;
            color: #1e1c10;
            border-color: #c9a53b;
            font-weight: 700;
        }
        .footer-simple {
            margin-top: 2.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid #928451;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem 2rem;
            font-size: 0.85rem;
        }
        .footer-simple a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
            color: #f8efcf;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            transition: 0.2s;
        }
        .footer-simple a:hover {
            background: #b48b3f;
            color: #181d0e;
        }
        .footer-simple img {
            width: 18px;
            height: 18px;
            filter: invert(0.95);
        }

        .collapse-toggle {
            cursor: pointer;
            user-select: none;
        }
        .collapse-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s;
            font-size: 0.7rem;
            margin-left: 6px;
        }
        .collapse-toggle .arrow.open {
            transform: rotate(90deg);
        }
        .collapse-body {
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            max-height: 400px;
        }
        .collapse-body.closed {
            max-height: 0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="nav-bar">
            <div class="nav-header-row">
                <div class="nav-brand">KARDS 军械库</div>
                <div class="menu-btn" id="menuToggleBtn"><span></span><span></span><span></span></div>
            </div>
            <div class="nav-menu" id="navMenu">
                <div class="menu-links">
                    <a class="menu-link active" href="#" data-target="index">卡牌收藏</a>
                    <a class="menu-link" href="builder.html" data-target="builder">卡组构筑</a>
                    <a class="menu-link" href="seek.html" data-target="seek">英文直检</a>
                    <a class="menu-link" href="https://craftsoul.github.io/kards-duel" data-target="duel">击剑大厅</a>
                    <a class="menu-link" href="pack.html" data-target="pack">模拟开包</a>
                    <a class="menu-link" href="about.html" data-target="about">关于军械库</a>
                </div>
            </div>
        </div>

        <div class="filter-panel">
            <div class="row-filters">
                <div class="filter-item">
                    <div class="filter-label">🔍 搜索</div>
                    <input type="text" id="searchInput" class="search-input" placeholder="卡名/文本">
                </div>
                <div class="filter-item">
                    <div class="filter-label">⚙️ 卡池</div>
                    <select id="statusSelect">
                        <option value="all">全部</option>
                        <option value="active">活跃</option>
                        <option value="reserve">预备</option>
                        <option value="spawn">衍生</option>
                        <option value="veteran">老兵</option>
                    </select>
                </div>
            </div>

            <!-- 阵营 -->
            <div class="filter-group">
                <div class="filter-group-title collapse-toggle" data-target="factionBody">
                    🏳 阵营 <span class="reset-chip" data-filter-type="faction">✖ 清除</span>
                    <span class="arrow open">▶</span>
                </div>
                <div class="filter-group-body" id="factionBody">
                    <div class="multi-select-btns" id="factionMultiContainer"></div>
                </div>
            </div>

            <!-- 类型 -->
            <div class="filter-group">
                <div class="filter-group-title collapse-toggle" data-target="typeBody">
                    ♠️ 类型 <span class="reset-chip" data-filter-type="type">✖ 清除</span>
                    <span class="arrow open">▶</span>
                </div>
                <div class="filter-group-body" id="typeBody">
                    <div class="multi-select-btns" id="typeMultiContainer"></div>
                </div>
            </div>

            <!-- 花费 -->
            <div class="filter-group">
                <div class="filter-group-title collapse-toggle" data-target="costBody">
                    💰 花费 <span class="reset-chip" data-filter-type="cost">✖ 清除</span>
                    <span class="arrow open">▶</span>
                </div>
                <div class="filter-group-body" id="costBody">
                    <div class="multi-select-btns" id="costMultiContainer"></div>
                </div>
            </div>

            <!-- 稀有度 -->
            <div class="filter-group">
                <div class="filter-group-title collapse-toggle" data-target="rarityBody">
                    🃏 稀有度 <span class="reset-chip" data-filter-type="rarity">✖ 清除</span>
                    <span class="arrow open">▶</span>
                </div>
                <div class="filter-group-body" id="rarityBody">
                    <div class="multi-select-btns" id="rarityMultiContainer"></div>
                </div>
            </div>

            <!-- 词条 -->
            <div class="filter-group">
                <div class="filter-group-title collapse-toggle" data-target="attrBody">
                    ✨ 词条 <span class="reset-chip" data-filter-type="attribute">✖ 清除</span>
                    <span class="arrow open">▶</span>
                </div>
                <div class="filter-group-body" id="attrBody">
                    <div class="multi-select-btns" id="attrMultiContainer"></div>
                </div>
            </div>

            <!-- 扩展包 -->
            <div class="filter-group">
                <div class="filter-group-title collapse-toggle" data-target="setBody">
                    📦 扩展包 <span class="reset-chip" data-filter-type="set">✖ 清除</span>
                    <span class="arrow open">▶</span>
                </div>
                <div class="filter-group-body" id="setBody">
                    <div class="multi-select-btns" id="setMultiContainer"></div>
                </div>
            </div>

            <div id="statsArea" style="display: none;">
                <div class="stats-group">
                    <div class="stats-item"><div class="filter-label">⚔️ 攻击力</div><input type="number" id="attackExact" class="exact-input" placeholder="输入数值" value="-1" min="-1" max="20"></div>
                    <div class="stats-item"><div class="filter-label">🛡️ 防御力</div><input type="number" id="defenseExact" class="exact-input" placeholder="输入数值" value="-1" min="-1" max="20"></div>
                    <div class="stats-item"><div class="filter-label">⚙️ 行动花费</div><input type="number" id="opExact" class="exact-input" placeholder="输入数值" value="-1" min="-1" max="6"></div>
                </div>
                <div class="stats-note">※ 仅筛选单位时生效，-1 = 不筛选</div>
            </div>
        </div>

        <div id="cardContainer" class="card-grid">正在寻找敌人...</div>
        <div class="pagination" id="pagination"></div>
        <div class="footer-simple">
            <a href="https://github.com/CraftSoul/kards-image-tool" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="github" width="18"> GitHub</a>
            <a href="https://space.bilibili.com/3546776475505152" target="_blank"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/bilibili.svg" alt="bili" width="18"> BiliBili</a>
        </div>
    </div>

    <!-- 模态框 -->
    <div id="cardModal" class="modal">
        <div class="modal-content" id="modalContent">
            <span class="modal-close">&times;</span>
            <div class="modal-left">
                <div class="modal-img-wrap">
                    <img id="modalImg" class="modal-img" alt="card art">
                </div>
                <div style="margin:8px 0 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center;">
                    <span style="color:#e9dbbd;">版本</span>
                    <select id="modalVersionSelect" class="version-select"></select>
                </div>
                <div class="lang-switch" id="modalLangSwitch"></div>
                <div class="modal-actions">
                    <button class="action-btn" id="saveImgBtn">💾 保存图片</button>
                    <button class="action-btn" id="copyLinkBtn">🔗 复制链接</button>
                </div>
            </div>
            <div class="modal-right">
                <div style="display:flex; align-items:center; gap:6px;">
                    <span id="modalFactionIcon"></span>
                    <h2 id="modalName" style="font-size:1.3rem; margin:0;"></h2>
                </div>
                <div class="detail-line"><span id="modalFaction"></span> | <span id="modalType"></span> | <span id="modalRarity"></span></div>
                <div id="modalCostDefense" class="badge-stat"></div>
                <div class="detail-line"><strong>📜 卡牌文本</strong><br><span id="modalText" style="white-space: pre-line;"></span></div>
                <div class="detail-line"><strong>✨ 词条</strong> <span id="modalAttributes"></span></div>
                <div class="detail-line"><strong>📦 扩展包</strong> <span id="modalSet"></span></div>
                <div class="detail-line"><strong>🌐 英文名</strong> <span id="modalEnName"></span></div>
                <div class="detail-line"><strong>🔧 导入代码</strong> <span id="modalImportId"></span></div>

                <div class="related-section" id="relatedSection">
                    <div class="related-section-title">🔗 关联卡牌</div>
                    <div id="relatedContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 常量与翻译 ====================
        const VERSION = 51;

        function generateVersionList() {
            let versions = [];
            for (let i = 0; i <= 10; i++) {
                versions.push(`v${VERSION - i}`);
            }
            return versions;
        }
        const AVAILABLE_VERSIONS = generateVersionList();
        const DEFAULT_VERSION = `v${VERSION}`;

        // 词条翻译
        const attrTranslation = {
            "blitz": "闪击",
            "fury": "奋战",
            "smokescreen": "烟幕",
            "pincer": "钳击",
            "salvage": "收缴",
            "guard": "守护",
            "heavyArmor1": "重甲 1",
            "heavyArmor2": "重甲 2",
            "heavyArmor3": "重甲 3",
            "alpine": "山地",
            "mobilize": "动员",
            "covert": "隐蔽",
            "shock": "冲击",
            "bond": "协力",
            "ambush": "伏击",
            "intel1": "情报 1",
            "intel2": "情报 2",
            "intel3": "情报 3",
            "exile": "流亡"
        };

        // 扩展包翻译
        const setTranslation = {
            "Base": "基础",
            "Allegiance": "忠诚",
            "Breakthrough": "突破",
            "Legions": "军团",
            "WorldAtWar": "世纪大战",
            "TheatersOfWar": "战区",
            "BrothersInArms": "战友",
            "WinterWar": "冬季战争",
            "CovertOps": "秘密行动",
            "BloodAndIron": "铁与血",
            "NavalWarfare": "海战",
            "Homefront": "国土阵线",
            "OceaniaStorm": "澳新风暴"
        };

        // 扩展包图标映射
        const setIconMap = {
            "Base": "https://www.datocms-assets.com/120590/1732572097-set-icon-base.svg",
            "Allegiance": "https://www.datocms-assets.com/120590/1732572215-set-icon-allegiance.svg",
            "Breakthrough": "https://www.datocms-assets.com/120590/1732572199-set-icon-breakthrough.svg",
            "Legions": "https://www.datocms-assets.com/120590/1732572188-set-icon-legions.svg",
            "WorldAtWar": "https://www.datocms-assets.com/120590/1732572859-set-icon-world.png",
            "TheatersOfWar": "https://www.datocms-assets.com/120590/1732572178-set-icon-theaters.svg",
            "BrothersInArms": "https://www.datocms-assets.com/120590/1732573000-set-icon-brothers.png",
            "WinterWar": "https://www.datocms-assets.com/120590/1732572120-set-icon-winter.svg",
            "CovertOps": "https://www.datocms-assets.com/120590/1732572110-set-icon-covert.svg",
            "BloodAndIron": "https://www.datocms-assets.com/120590/1732573199-set-icon-blood.svg",
            "NavalWarfare": "https://www.datocms-assets.com/120590/1750348798-naval-warfare.svg",
            "Homefront": "https://www.datocms-assets.com/120590/1763718716-homefront.svg",
            "OceaniaStorm": "https://www.datocms-assets.com/120590/1780567349-oceania_storm_set-icon.svg"
        };

        const rarityNames = { "Standard": "普通", "Limited": "限定", "Special": "特殊", "Elite": "精英" };
        const factionNames = { "soviet": "苏联", "usa": "美国", "poland": "波兰", "neutral": "中立", "japan": "日本", "italy": "意大利",
            "france": "法国", "britain": "英国", "finland": "芬兰", "germany": "德国", "anzac": "澳新军团" };
        const factionColor = { "germany": "#5A5F55", "britain": "#857A60", "soviet": "#4F3826", "usa": "#434B32",
            "japan": "#90723C", "france": "#283454", "italy": "#555248", "poland": "#645633", "finland": "#C9C8BC",
            "neutral": "#6b6e5c", "anzac": "#9E6F34" };
        const typeMap = { "infantry": "步兵", "tank": "坦克", "fighter": "战斗机", "bomber": "轰炸机", "artillery": "炮兵",
            "order": "指令", "countermeasure": "反制" };
        const unitTypes = ["infantry", "tank", "fighter", "bomber", "artillery"];

        // 静态定义的筛选选项（阵营、类型、花费、稀有度）
        const STATIC_FACTIONS = ["germany", "britain", "soviet", "usa", "japan", "france", "italy", "poland", "finland",
            "anzac", "neutral"
        ];
        const STATIC_TYPES = ["infantry", "tank", "fighter", "bomber", "artillery", "order", "countermeasure"];
        const STATIC_COSTS = ["0", "1", "2", "3", "4", "5", "6", "7+"];
        const STATIC_RARITIES = ["Standard", "Limited", "Special", "Elite"];

        // ==================== 全局状态 ====================
        let allCards = [];
        let filteredCards = [];
        let currentPage = 1,
            PAGE_SIZE = 20;
        let currentModalCard = null,
            currentModalLang = "zh-Hans",
            currentModalVersion = DEFAULT_VERSION;

        // 卡牌索引与关联
        let cardIndex = {};
        let canCreateMap = {};
        let parentOfMap = {};
        let veteranMap = {};     // 原版 -> 老兵版
        let becomesVeteranMap = {}; // 老兵版 -> 原版

        // 选中的筛选器
        let selectedFilters = {
            factions: new Set(),
            types: new Set(),
            costs: new Set(),
            rarities: new Set(),
            attributes: new Set(),
            sets: new Set()
        };

        // ==================== 工具函数 ====================
        function getCardImageUrl(imgName, lang, version, quality) {
            if (!imgName) return "";
            const ver = version || DEFAULT_VERSION;
            const q = quality || 20;
            return `https://images.weserv.nl/?url=ssl:www.kards.com/images/card/${ver}/${lang}/${imgName}&q=${q}`;
        }

        function translateAttributes(attrs) {
            if (!attrs || !attrs.length) return "无";
            let hasVeteran = false,
                filtered = [];
            for (let a of attrs) {
                if (a === "OnlySpawnable") continue;
                if (a.startsWith("BecomesVeteran:") || a.startsWith("VeteranOf:")) {
                    hasVeteran = true;
                    continue;
                }
                filtered.push(attrTranslation[a] || a);
            }
            if (hasVeteran) filtered.push("老兵");
            return [...new Set(filtered)].join(", ");
        }

        // 获取卡牌的有效扩展包（用于筛选）
        function getEffectiveSet(card, visited) {
            visited = visited || new Set();
            if (visited.has(card.cardId)) return card.setName;
            visited.add(card.cardId);

            if (card.setName === "OnlySpawnable") {
                const parents = parentOfMap[card.cardId] || [];
                for (let pid of parents) {
                    const p = cardIndex[pid];
                    if (p) {
                        const es = getEffectiveSet(p, visited);
                        if (es && es !== "OnlySpawnable" && es !== "Special") return es;
                    }
                }
                return "OnlySpawnable";
            }

            if (card.setName === "Special") {
                const originalId = becomesVeteranMap[card.cardId];
                if (originalId) {
                    const original = cardIndex[originalId];
                    if (original) {
                        const es = getEffectiveSet(original, visited);
                        if (es && es !== "Special") return es;
                    }
                }
                return "Special";
            }

            return card.setName;
        }

        // ==================== 数据加载 ====================
        async function loadData() {
            try {
                const res = await fetch('data.json');
                if (!res.ok) throw new Error("data.json failed");
                const json = await res.json();
                const rawCards = json.cards || [];

                allCards = rawCards.map(raw => {
                    const j = raw.json || {};
                    const imgFile = j.image || "";
                    const factionRaw = (j.faction || "").toLowerCase();
                    return {
                        id: raw.id,
                        cardId: j.id || raw.cardId || "",
                        importId: raw.importId || j.import_id || "",
                        titleZh: j.title ? (j.title["zh-Hans"] || j.title.en || "未找到") : "未找到",
                        titleEn: j.title ? (j.title["en-EN"] || "") : "",
                        text_zh: j.text ? (j.text["zh-Hans"] || "") : "",
                        textMap: j.text || {},
                        titleMap: j.title || {},
                        faction: factionRaw,
                        type: j.type || "",
                        rarity: j.rarity || "Standard",
                        cost: j.kredits ?? 0,
                        attack: j.attack,
                        defense: j.defense,
                        operationCost: j.operationCost,
                        attributes: j.attributes || [],
                        setName: j.set || "基础",
                        image: imgFile,
                        reserved: raw.reserved === true,
                        isSpawn: j.set === "OnlySpawnable",
                        isVeteranSet: j.set === "Special",
                        canCreate: j.can_create || [],
                        rawJson: j
                    };
                });

                // 建立索引
                cardIndex = {};
                for (let c of allCards) {
                    if (c.cardId) cardIndex[c.cardId] = c;
                }

                // 建立 can_create 关系
                canCreateMap = {};
                parentOfMap = {};
                for (let c of allCards) {
                    if (c.canCreate && c.canCreate.length) {
                        canCreateMap[c.cardId] = c.canCreate;
                        for (let childId of c.canCreate) {
                            if (!parentOfMap[childId]) parentOfMap[childId] = [];
                            parentOfMap[childId].push(c.cardId);
                        }
                    }
                }

                // 建立老兵关系
                veteranMap = {};
                becomesVeteranMap = {};
                for (let c of allCards) {
                    const attrs = c.attributes || [];
                    for (let a of attrs) {
                        if (a.startsWith("BecomesVeteran:")) {
                            // 当前卡是原版，值是老兵版ID
                            const veteranId = a.replace("BecomesVeteran:", "");
                            veteranMap[c.cardId] = veteranId;
                            becomesVeteranMap[veteranId] = c.cardId;
                        }
                        if (a.startsWith("VeteranOf:")) {
                            // 当前卡是老兵版，值是原版ID
                            const originalId = a.replace("VeteranOf:", "");
                            veteranMap[originalId] = c.cardId;
                            becomesVeteranMap[c.cardId] = originalId;
                        }
                    }
                }

                // 初始化筛选器
                initStaticFilters();
                initAttrFilter();
                initSetFilter();
                applyFilters();

            } catch (e) {
                console.error(e);
                document.getElementById('cardContainer').innerHTML = '<div>❌ 数据加载失败</div>';
            }
        }

        // ==================== 初始化筛选器 ====================
        function initStaticFilters() {
            // 阵营
            const fc = document.getElementById('factionMultiContainer');
            fc.innerHTML = STATIC_FACTIONS.map(f =>
                `<div class="filter-chip" data-filter="faction" data-val="${f}"><img src="${f}.svg" onerror="this.style.display='none'"> ${factionNames[f]||f}</div>`
            ).join('');

            // 类型
            const tc = document.getElementById('typeMultiContainer');
            tc.innerHTML = STATIC_TYPES.map(t =>
                `<div class="filter-chip" data-filter="type" data-val="${t}">${typeMap[t]||t}</div>`
            ).join('');

            // 花费
            const cc = document.getElementById('costMultiContainer');
            cc.innerHTML = STATIC_COSTS.map(c =>
                `<div class="filter-chip" data-filter="cost" data-val="${c}">${c==='7+'?'7K+':c+'K'}</div>`
            ).join('');

            // 稀有度
            const rc = document.getElementById('rarityMultiContainer');
            rc.innerHTML = STATIC_RARITIES.map(r =>
                `<div class="filter-chip" data-filter="rarity" data-val="${r}">${rarityNames[r]||r}</div>`
            ).join('');

            // 重置按钮
            document.querySelectorAll('.reset-chip').forEach(reset => {
                reset.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const filterType = reset.dataset.filterType;
                    const map = {
                        'faction': selectedFilters.factions,
                        'type': selectedFilters.types,
                        'cost': selectedFilters.costs,
                        'rarity': selectedFilters.rarities,
                        'attribute': selectedFilters.attributes,
                        'set': selectedFilters.sets
                    };
                    const set = map[filterType];
                    if (set) {
                        set.clear();
                        document.querySelectorAll(`.filter-chip[data-filter="${filterType}"]`).forEach(ch => ch.classList.remove('active'));
                        applyFilters();
                    }
                });
            });

            // 折叠切换
            document.querySelectorAll('.collapse-toggle').forEach(toggle => {
                toggle.addEventListener('click', function(e) {
                    if (e.target.classList.contains('reset-chip')) return;
                    const targetId = this.dataset.target;
                    const body = document.getElementById(targetId);
                    const arrow = this.querySelector('.arrow');
                    if (body) {
                        body.classList.toggle('collapsed');
                        if (arrow) arrow.classList.toggle('open');
                    }
                });
            });

            // 搜索、状态、数值输入
            ['searchInput', 'statusSelect'].forEach(id => {
                const el = document.getElementById(id);
                el.addEventListener('change', () => applyFilters());
                el.addEventListener('input', () => applyFilters());
            });
            ['attackExact', 'defenseExact', 'opExact'].forEach(id => {
                const el = document.getElementById(id);
                el.addEventListener('input', () => applyFilters());
            });

            // 事件委托：处理所有 filter-chip 点击
            document.querySelector('.filter-panel').addEventListener('click', function(e) {
                const chip = e.target.closest('.filter-chip');
                if (!chip) return;
                const type = chip.dataset.filter;
                const val = chip.dataset.val;
                if (!type || !val) return;
                const setMap = {
                    'faction': selectedFilters.factions,
                    'type': selectedFilters.types,
                    'cost': selectedFilters.costs,
                    'rarity': selectedFilters.rarities,
                    'attribute': selectedFilters.attributes,
                    'set': selectedFilters.sets
                };
                const set = setMap[type];
                if (!set) return;
                if (set.has(val)) set.delete(val);
                else set.add(val);
                chip.classList.toggle('active');
                applyFilters();
            });
        }

        // 词条筛选
        function initAttrFilter() {
            const container = document.getElementById('attrMultiContainer');
            const attrKeys = Object.keys(attrTranslation);
            container.innerHTML = attrKeys.map(a =>
                `<div class="filter-chip" data-filter="attribute" data-val="${a}">${attrTranslation[a]}</div>`
            ).join('');
        }

        // 扩展包筛选
        function initSetFilter() {
            const container = document.getElementById('setMultiContainer');
            const setKeys = Object.keys(setTranslation);
            container.innerHTML = setKeys.map(s => {
                const icon = setIconMap[s] || '';
                return `<div class="filter-chip" data-filter="set" data-val="${s}">${icon ? `<img src="${icon}" width="18" height="18" onerror="this.style.display='none'">` : ''} ${setTranslation[s]}</div>`;
            }).join('');
        }

        // ==================== 筛选逻辑 ====================
        function searchableText(card) {
            return `${card.titleZh} ${card.text_zh}`.toLowerCase();
        }

        function filterCardsLogic() {
            let result = [...allCards];

            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            if (search) {
                result = result.filter(c => searchableText(c).includes(search));
            }

            // 词条
            if (selectedFilters.attributes.size) {
                result = result.filter(c => {
                    const attrs = c.attributes || [];
                    for (let attr of selectedFilters.attributes) {
                        if (!attrs.includes(attr)) return false;
                    }
                    return true;
                });
            }

            if (selectedFilters.factions.size) {
                result = result.filter(c => selectedFilters.factions.has(c.faction));
            }
            if (selectedFilters.types.size) {
                result = result.filter(c => selectedFilters.types.has(c.type));
            }
            if (selectedFilters.costs.size) {
                result = result.filter(c => {
                    for (let costVal of selectedFilters.costs) {
                        if (costVal === '7+' && c.cost >= 7) return true;
                        if (costVal !== '7+' && c.cost === parseInt(costVal)) return true;
                    }
                    return false;
                });
            }
            if (selectedFilters.rarities.size) {
                result = result.filter(c => selectedFilters.rarities.has(c.rarity));
            }
            if (selectedFilters.sets.size) {
                result = result.filter(c => {
                    const effSet = getEffectiveSet(c);
                    return selectedFilters.sets.has(effSet);
                });
            }

            const status = document.getElementById('statusSelect').value;
            if (status === 'active') {
                result = result.filter(c => !c.reserved && !c.isSpawn && !c.isVeteranSet);
            } else if (status === 'reserve') {
                result = result.filter(c => c.reserved);
            } else if (status === 'spawn') {
                result = result.filter(c => c.isSpawn);
            } else if (status === 'veteran') {
                result = result.filter(c => c.isVeteranSet);
            }

            // 数值
            const activeTypes = selectedFilters.types.size ? [...selectedFilters.types] : [...new Set(allCards.map(c => c.type))];
            const onlyUnits = activeTypes.length > 0 && activeTypes.every(t => unitTypes.includes(t));
            const statsArea = document.getElementById('statsArea');
            if (onlyUnits && selectedFilters.types.size > 0) {
                statsArea.style.display = 'block';
                let attExact = parseInt(document.getElementById('attackExact').value);
                let defExact = parseInt(document.getElementById('defenseExact').value);
                let opExact = parseInt(document.getElementById('opExact').value);
                if (!isNaN(attExact) && attExact !== -1) {
                    result = result.filter(c => (c.attack ?? -2) === attExact);
                }
                if (!isNaN(defExact) && defExact !== -1) {
                    result = result.filter(c => (c.defense ?? -2) === defExact);
                }
                if (!isNaN(opExact) && opExact !== -1) {
                    result = result.filter(c => (c.operationCost ?? -2) === opExact);
                }
            } else {
                statsArea.style.display = 'none';
            }

            return result;
        }

        function applyFilters() {
            filteredCards = filterCardsLogic();
            currentPage = 1;
            renderCards();
            renderPagination();
        }

        // ==================== 渲染 ====================
        function renderCards() {
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageCards = filteredCards.slice(start, start + PAGE_SIZE);
            const container = document.getElementById('cardContainer');
            if (!pageCards.length) {
                container.innerHTML = '<div style="color:#e9dbbd;padding:2rem 0;text-align:center;">未找到</div>';
                return;
            }
            container.innerHTML = pageCards.map((card, idx) => {
                const globalIdx = filteredCards.indexOf(card);
                const imgUrl = getCardImageUrl(card.image, "zh-Hans", DEFAULT_VERSION, 20);
                const reserveMark = card.reserved ? '<i class="reserve-icon-sm"></i>' : '';
                const borderColor = factionColor[card.faction] || '#6b6e5c';
                return `<div class="card-item" data-index="${globalIdx}" style="border-color: ${borderColor};">
                            <div class="card-img"><img loading="lazy" src="${imgUrl}" alt="${card.titleZh}"></div>
                            <div class="card-info"><div class="card-name"><span>${card.titleZh}</span>${reserveMark}</div></div>
                        </div>`;
            }).join('');

            document.querySelectorAll('.card-item').forEach(el => {
                el.addEventListener('click', () => {
                    let idx = parseInt(el.dataset.index);
                    if (!isNaN(idx)) openModal(idx);
                });
            });
        }

        function renderPagination() {
            const total = filteredCards.length,
                pages = Math.ceil(total / PAGE_SIZE);
            const pagDiv = document.getElementById('pagination');
            if (pages <= 1) { pagDiv.innerHTML = ''; return; }
            let btns =
                `<button class="page-btn" data-page="prev" ${currentPage===1?'disabled':''}>◀</button>`;
            for (let i = 1; i <= pages; i++) {
                btns +=
                    `<button class="page-btn ${i===currentPage?'active-page':''}" data-page="${i}">${i}</button>`;
            }
            btns +=
                `<button class="page-btn" data-page="next" ${currentPage===pages?'disabled':''}>▶</button>`;
            pagDiv.innerHTML = btns;
            pagDiv.querySelectorAll('.page-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    let p = btn.dataset.page;
                    if (p === 'prev') currentPage = Math.max(1, currentPage - 1);
                    else if (p === 'next') currentPage = Math.min(pages, currentPage + 1);
                    else currentPage = parseInt(p);
                    renderCards();
                    renderPagination();
                });
            });
        }

        // ==================== 模态框 ====================
        function openModal(index) {
            const card = filteredCards[index];
            if (!card) return;
            currentModalCard = card;
            currentModalLang = "zh-Hans";
            currentModalVersion = DEFAULT_VERSION;
            updateModalContentAndImage();
            buildModalVersionSelect();
            buildLangSwitch();
            buildRelatedCards();
            document.getElementById('cardModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('cardModal').style.display = 'none';
        }

        function setModalImgLoading(loading) {
            const img = document.getElementById('modalImg');
            if (loading) img.classList.add('loading');
            else img.classList.remove('loading');
        }

        function updateModalContentAndImage() {
            if (!currentModalCard) return;
            const c = currentModalCard;
            const themeColor = factionColor[c.faction] || '#6b6e5c';
            document.getElementById('modalContent').style.borderColor = themeColor;

            document.getElementById('modalFactionIcon').innerHTML =
                `<img class="faction-icon-lg" src="${c.faction}.svg" onerror="this.style.display='none'">`;
            document.getElementById('modalFaction').textContent = factionNames[c.faction] || c.faction;
            document.getElementById('modalType').textContent = typeMap[c.type] || c.type;
            document.getElementById('modalRarity').textContent = rarityNames[c.rarity] || c.rarity;

            const reserveSpan = c.reserved ? '<span class="reserve-badge"></span>' : '';
            let titleText = c.titleMap ? (c.titleMap[currentModalLang] || c.titleZh) : c.titleZh;
            document.getElementById('modalName').innerHTML = `${titleText} ${reserveSpan}`;

            let textContent = c.textMap ? (c.textMap[currentModalLang] || c.text_zh || "无描述") : (c.text_zh || "无描述");
            document.getElementById('modalText').innerHTML = textContent;

            let statLine = `💰 花费: ${c.cost}`;
            if (c.attack !== undefined) statLine += ` &nbsp; ⚔️ ${c.attack} / 🛡️ ${c.defense}`;
            if (c.operationCost !== undefined) statLine += ` &nbsp; ⚙️ 油费: ${c.operationCost}`;
            document.getElementById('modalCostDefense').innerHTML = statLine;
            document.getElementById('modalCostDefense').style.borderLeftColor = themeColor;

            document.getElementById('modalAttributes').textContent = translateAttributes(c.attributes);
            // 扩展包翻译
            document.getElementById('modalSet').textContent = setTranslation[c.setName] || c.setName;
            document.getElementById('modalEnName').textContent = c.titleEn || '---';
            document.getElementById('modalImportId').textContent = c.importId || '---';

            const imgEl = document.getElementById('modalImg');
            setModalImgLoading(true);
            const imgUrl = getCardImageUrl(c.image, currentModalLang, currentModalVersion, 100);
            imgEl.src = imgUrl;
            imgEl.onload = () => { setModalImgLoading(false); };
            imgEl.onerror = () => { setModalImgLoading(false); };
        }

        function buildModalVersionSelect() {
            const select = document.getElementById('modalVersionSelect');
            select.innerHTML = AVAILABLE_VERSIONS.map(v =>
                `<option value="${v}" ${currentModalVersion===v?'selected':''}>${v.toUpperCase()}</option>`
            ).join('');
            select.onchange = (e) => {
                currentModalVersion = e.target.value;
                updateModalContentAndImage();
            };
        }

        function buildLangSwitch() {
            const container = document.getElementById('modalLangSwitch');
            const languages = ["zh-Hans", "zh-Hant", "en-EN", "fr-FR", "de-DE", "pl-PL", "pt-BR", "ru-RU", "it-IT", "es-ES",
                "ko-KR", "ja-JP"
            ];
            const langNames = { "zh-Hans": "简中", "zh-Hant": "繁中", "en-EN": "EN", "fr-FR": "FR", "de-DE": "DE",
                "pl-PL": "PL", "pt-BR": "PT", "ru-RU": "RU", "it-IT": "IT", "es-ES": "ES", "ko-KR": "KR", "ja-JP": "JP" };
            container.innerHTML = languages.map(l =>
                `<button class="lang-btn ${currentModalLang===l?'active':''}" data-lang="${l}">${langNames[l]}</button>`
            ).join('');
            container.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentModalLang = btn.dataset.lang;
                    updateModalContentAndImage();
                    buildLangSwitch();
                    buildRelatedCards();
                });
            });
        }

        // ==================== 相关卡牌 ====================
        function buildRelatedCards() {
            const section = document.getElementById('relatedSection');
            const container = document.getElementById('relatedContainer');
            if (!currentModalCard) {
                section.classList.remove('visible');
                container.innerHTML = '';
                return;
            }

            const card = currentModalCard;
            const cardId = card.cardId;
            const related = [];

            // 生成
            if (card.canCreate && card.canCreate.length) {
                for (let childId of card.canCreate) {
                    const child = cardIndex[childId];
                    if (child) related.push({ card: child, relation: '生成' });
                }
            }

            // 上级
            const parents = parentOfMap[cardId] || [];
            for (let parentId of parents) {
                const parent = cardIndex[parentId];
                if (parent) related.push({ card: parent, relation: '上级' });
            }

            // 老兵关系
            if (veteranMap[cardId]) {
                const vetId = veteranMap[cardId];
                const vetCard = cardIndex[vetId];
                if (vetCard) related.push({ card: vetCard, relation: '老兵版' });
            }
            if (becomesVeteranMap[cardId]) {
                const origId = becomesVeteranMap[cardId];
                const origCard = cardIndex[origId];
                if (origCard) related.push({ card: origCard, relation: '原版' });
            }

            // 去重
            const seen = new Set();
            const uniqueRelated = [];
            for (let item of related) {
                if (!seen.has(item.card.cardId)) {
                    seen.add(item.card.cardId);
                    uniqueRelated.push(item);
                }
            }

            if (uniqueRelated.length === 0) {
                section.classList.remove('visible');
                container.innerHTML = '';
                return;
            }

            section.classList.add('visible');
            container.innerHTML = `<div class="related-grid">${uniqueRelated.map(item => {
                const c = item.card;
                const imgUrl = getCardImageUrl(c.image, currentModalLang, currentModalVersion, 20);
                const borderColor = factionColor[c.faction] || '#6b6e5c';
                return `<div class="related-card-item" data-cardid="${c.cardId}" style="border-color: ${borderColor};">
                            <div class="card-img"><img loading="lazy" src="${imgUrl}" alt="${c.titleZh}"></div>
                            <div class="card-info"><div class="card-name"><span>${c.titleZh}</span><span style="font-size:0.5rem;color:#c9b06b;">${item.relation}</span></div></div>
                        </div>`;
            }).join('')}</div>`;

            container.querySelectorAll('.related-card-item').forEach(el => {
                el.addEventListener('click', () => {
                    const cid = el.dataset.cardid;
                    const targetCard = cardIndex[cid];
                    if (targetCard) {
                        const idx = filteredCards.indexOf(targetCard);
                        if (idx !== -1) {
                            openModal(idx);
                        } else {
                            currentModalCard = targetCard;
                            currentModalLang = "zh-Hans";
                            currentModalVersion = DEFAULT_VERSION;
                            updateModalContentAndImage();
                            buildModalVersionSelect();
                            buildLangSwitch();
                            buildRelatedCards();
                        }
                    }
                });
            });
        }

        // ==================== 保存图片 ====================
        async function saveCardAsRoundedPng() {
            const imgEl = document.getElementById('modalImg');
            if (!imgEl?.complete || imgEl.naturalWidth === 0) { alert("图片未加载完成"); return; }
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imgEl.src;
            await new Promise((r, j) => { img.onload = r;
                img.onerror = j; });
            const w = img.width,
                h = img.height,
                canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            const rad = 12;
            ctx.beginPath();
            ctx.moveTo(rad, 0);
            ctx.lineTo(w - rad, 0);
            ctx.quadraticCurveTo(w, 0, w, rad);
            ctx.lineTo(w, h - rad);
            ctx.quadraticCurveTo(w, h, w - rad, h);
            ctx.lineTo(rad, h);
            ctx.quadraticCurveTo(0, h, 0, h - rad);
            ctx.lineTo(0, rad);
            ctx.quadraticCurveTo(0, 0, rad, 0);
            ctx.clip();
            ctx.drawImage(img, 0, 0, w, h);
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = `${currentModalCard?.titleZh||'card'}_${currentModalLang}.png`;
            a.click();
        }

        async function copyLink() {
            const url = document.getElementById('modalImg').src;
            try {
                await navigator.clipboard.writeText(url);
                alert('已复制链接');
            } catch (e) {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = url;
                    textarea.style.position = 'fixed';
                    textarea.style.top = '-9999px';
                    textarea.style.left = '-9999px';
                    document.body.appendChild(textarea);
                    textarea.select();
                    textarea.setSelectionRange(0, 99999);
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('已复制链接');
                } catch (e2) {
                    alert(url);
                }
            }
        }

        // ==================== 原神启动 ====================
        window.addEventListener('load', () => {
            loadData();

            document.querySelector('.modal-close').addEventListener('click', closeModal);
            document.getElementById('cardModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('cardModal')) closeModal();
            });
            document.getElementById('saveImgBtn').addEventListener('click', saveCardAsRoundedPng);
            document.getElementById('copyLinkBtn').addEventListener('click', copyLink);

            const menuBtn = document.getElementById('menuToggleBtn'),
                menuDiv = document.getElementById('navMenu');
            menuBtn.onclick = (e) => { e.stopPropagation();
                menuDiv.classList.toggle('open'); };
            document.addEventListener('click', (e) => {
                if (!menuBtn.contains(e.target) && !menuDiv.contains(e.target)) menuDiv.classList.remove('open');
            });
            document.querySelectorAll('.menu-link').forEach(l => l.addEventListener('click', () => menuDiv.classList.remove('open')));
        });
    </script>
</body>
</html>
