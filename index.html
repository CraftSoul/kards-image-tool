<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>KARDS 军械库 · 卡牌收藏馆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #2b2b1f;
            background-image: 
                radial-gradient(circle at 20% 40%, rgba(80, 70, 40, 0.4) 2%, transparent 2.5%),
                radial-gradient(circle at 70% 85%, rgba(60, 50, 30, 0.5) 1.8%, transparent 2.2%),
                radial-gradient(circle at 45% 20%, rgba(110, 90, 50, 0.3) 3%, transparent 3.5%),
                repeating-linear-gradient(45deg, #5e5536 0px, #5e5536 2px, #7e6e48 2px, #7e6e48 8px),
                repeating-linear-gradient(135deg, #3e3a2a 0px, #3e3a2a 3px, #5a4e32 3px, #5a4e32 10px);
            background-blend-mode: overlay, normal;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        /* 阵营主题色变量 (用于点缀) */
        :root {
            --germany: #5A5F55;
            --britain: #857A60;
            --soviet: #4F3826;
            --usa: #434B32;
            --japan: #90723C;
            --france: #283454;
            --italy: #555248;
            --poland: #645633;
            --finland: #C9C8BC;
            --neutral: #6b6e5c;
        }

        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 16px 20px 32px;
        }

        /* 导航栏 (与seek风格一致) */
        .nav-bar {
            background: rgba(20, 20, 15, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid #aa8e4e;
            border-radius: 20px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        }

        .nav-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(170, 142, 78, 0.3);
        }

        .nav-brand {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f9f9fc, #e6dbb0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        .menu-btn {
            background: rgba(210, 210, 225, 0.12);
            border: 1px solid #aa8e4e;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-btn span {
            display: block;
            width: 22px;
            height: 2.5px;
            background-color: #f2e2b0;
            border-radius: 2px;
        }
        .menu-btn:active { transform: scale(0.96); }

        .nav-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
            background: rgba(10, 10, 8, 0.98);
            backdrop-filter: blur(12px);
        }
        .nav-menu.open {
            max-height: 320px;
            transition: max-height 0.4s ease-in;
        }
        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px 20px 20px;
        }
        .menu-link {
            display: block;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 20px;
            border-radius: 60px;
            background: rgba(210, 210, 225, 0.08);
            color: #eef0ff;
            text-align: center;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .menu-link:hover {
            background: rgba(235, 235, 245, 0.2);
            transform: translateX(5px);
            border-color: #c9a53b;
        }
        .menu-link.active {
            background: #c9a53b;
            color: #1e1c10;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* 筛选面板 —— 优雅适应多行 */
        .filter-panel {
            background: rgba(12, 12, 8, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid #aa8e4e;
            border-radius: 28px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 22px rgba(0,0,0,0.4);
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1.5rem;
            margin-bottom: 1rem;
            align-items: flex-start;
        }
        .filter-card {
            background: #1c1910b3;
            border-radius: 24px;
            padding: 0.5rem 1rem;
            min-width: 130px;
            flex: 1 0 auto;
            border-left: 3px solid #d4af6a;
            backdrop-filter: blur(2px);
        }
        .filter-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #e9dbbd;
            margin-bottom: 0.45rem;
            font-weight: 600;
        }
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
            align-items: center;
        }
        .filter-chip {
            background: #2c281c;
            padding: 0.25rem 0.85rem;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #f0e2c5;
            border: 1px solid #8f7a52;
            white-space: nowrap;
        }
        /* 防止chip换行撑爆，但允许换行 */
        .filter-chip.active {
            background: #c9a63b;
            color: #111;
            border-color: #fde096;
            font-weight: 600;
        }
        .range-input {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .range-input input[type="number"] {
            width: 65px;
            background: #252219;
            border: 1px solid #aa8e4e;
            color: #faf2da;
            border-radius: 40px;
            padding: 0.25rem 0.5rem;
            text-align: center;
            font-size: 0.8rem;
        }
        .range-input input[type="range"] {
            width: 120px;
            background: #4d422c;
            height: 3px;
            border-radius: 3px;
            accent-color: #dbb45c;
        }
        .search-box {
            flex: 2;
            min-width: 180px;
        }
        .search-box input {
            width: 100%;
            background: #252219;
            border: 1px solid #aa8e4e;
            border-radius: 60px;
            padding: 0.55rem 1.2rem;
            color: white;
            font-size: 0.9rem;
        }

        /* 卡片网格: 移动端更紧凑 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.2rem;
            margin-top: 1rem;
        }
        @media (max-width: 560px) {
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
                gap: 0.9rem;
            }
        }
        .card-item {
            background: linear-gradient(145deg, #1c231f, #131a16);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.2s;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0,0,0,0.5);
            border: 1px solid #8f7a52;
        }
        .card-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 28px rgba(0,0,0,0.6);
            border-color: #e6c175;
        }
        /* 卡片图片圆角矩形裁剪 (半径12px) */
        .card-img {
            width: 100%;
            aspect-ratio: 300 / 420;
            background: #0e1310;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 12px;
            transition: transform 0.2s;
        }
        .card-info {
            padding: 0.6rem 0.7rem 0.9rem;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }
        .card-name {
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            color: #faf0cf;
        }
        .card-name span:first-child {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reserve-icon {
            width: 20px;
            height: 20px;
            background: url('reserve.png') no-repeat center;
            background-size: contain;
            display: inline-block;
            flex-shrink: 0;
            filter: drop-shadow(0 1px 2px black);
        }

        /* 模态框 (圆角裁剪) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #191f1b;
            max-width: 1100px;
            width: 90%;
            border-radius: 32px;
            display: flex;
            flex-wrap: wrap;
            position: relative;
            border: 1px solid #c6aa6b;
            box-shadow: 0 28px 44px black;
            overflow: hidden;
        }
        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 32px;
            cursor: pointer;
            z-index: 25;
            color: #ddd2b0;
            background: #2d281c;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover { background: #bb7944; color: white; }
        .modal-left {
            flex: 1.3;
            background: #0e120f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 20px;
        }
        .modal-right {
            flex: 1;
            padding: 28px 26px;
            background: #111812;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .modal-img {
            width: 100%;
            max-width: 360px;
            border-radius: 12px;
            box-shadow: 0 10px 22px black;
            background: #1e241f;
        }
        .img-quality-switch {
            margin-top: 16px;
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .qual-btn {
            background: #2e2a1c;
            border: 1px solid #b69654;
            padding: 5px 18px;
            border-radius: 40px;
            color: #f7ebc6;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .qual-btn.active {
            background: #c9a63b;
            color: #161a0c;
        }
        .modal-actions {
            display: flex;
            gap: 18px;
            margin-top: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .action-btn {
            background: #322d1e;
            border: none;
            padding: 6px 16px;
            border-radius: 32px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #f5efdb;
        }
        .action-btn:hover { background: #c9a63b; color: #1e1c0b; }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #ecd68a;
            padding: 6px 14px;
            border-radius: 40px;
            z-index: 20;
        }
        .nav-left { left: 8px; }
        .nav-right { right: 8px; }
        .nav-btn:hover { background: #c9aa4bcc; color: black; }
        .faction-icon {
            width: 28px;
            height: 28px;
            vertical-align: middle;
            margin-right: 8px;
        }
        .badge {
            background: #20281e;
            border-radius: 32px;
            padding: 4px 14px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-left: 2px solid #dbb45c;
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 2.5rem;
            gap: 8px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: #2d2a1d;
            border: 1px solid #a3874b;
            padding: 6px 14px;
            border-radius: 40px;
            color: #f5eaca;
            cursor: pointer;
        }
        .page-btn.active-page {
            background: #dbaa3a;
            color: #171e0c;
        }
        .page-btn:disabled { opacity: 0.4; cursor: default; }
        @media (max-width: 720px) {
            .modal-content { flex-direction: column; max-height: 90vh; overflow-y: auto; }
            .filter-card { min-width: 100px; }
            .filter-options { flex-wrap: wrap; }
        }
        .loading-placeholder { grid-column:1/-1; text-align:center; padding: 3rem; color:#dccfaa; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="nav-bar">
        <div class="nav-header-row">
            <div class="nav-brand">📖 KARDS 军械库 · 收藏馆</div>
            <div class="menu-btn" id="menuToggleBtn">
                <span></span><span></span><span></span>
            </div>
        </div>
        <div class="nav-menu" id="navMenu">
            <div class="menu-links">
                <a class="menu-link active" href="#" data-target="index">卡牌收藏</a>
                <a class="menu-link" href="builder.html" data-target="builder">卡组构筑</a>
                <a class="menu-link" href="seek.html" data-target="seek">英文直检</a>
                <a class="menu-link" href="#" data-target="about">关于军械库</a>
            </div>
        </div>
    </div>

    <!-- 筛选面板 -->
    <div class="filter-panel">
        <div class="filter-group">
            <div class="filter-card search-box">
                <div class="filter-title">🔍 搜索 (卡名/文本/词条)</div>
                <input type="text" id="searchInput" placeholder="输入关键词...">
            </div>
            <div class="filter-card">
                <div class="filter-title">🏷️ 阵营</div>
                <div class="filter-options" id="factionFilter"></div>
            </div>
            <div class="filter-card">
                <div class="filter-title">📦 类型</div>
                <div class="filter-options" id="typeFilter"></div>
            </div>
        </div>
        <div class="filter-group">
            <div class="filter-card">
                <div class="filter-title">💰 花费范围</div>
                <div class="filter-options" id="costFilterGroup"></div>
            </div>
            <div class="filter-card">
                <div class="filter-title">💠 扩展包</div>
                <div class="filter-options" id="setFilter"></div>
            </div>
            <div class="filter-card">
                <div class="filter-title">🗃️ 卡池</div>
                <div class="filter-options" id="statusFilter"></div>
            </div>
        </div>
        <!-- 身材筛选区域 (仅当筛选类型中全是单位时才显示，使用数值输入框) -->
        <div id="statsFilterGroup" style="display: none;">
            <div class="filter-group">
                <div class="filter-card"><div class="filter-title">⚔️ 攻击力</div><div class="range-input"><span>0</span><input type="range" id="attackMin" min="0" max="12" value="0"><input type="number" id="attackMinNum" min="0" max="12" value="0"><span>-</span><input type="number" id="attackMaxNum" min="0" max="12" value="12"><input type="range" id="attackMax" min="0" max="12" value="12"><span>12</span></div></div>
                <div class="filter-card"><div class="filter-title">🛡️ 防御力</div><div class="range-input"><span>0</span><input type="range" id="defenseMin" min="0" max="12" value="0"><input type="number" id="defenseMinNum" min="0" max="12" value="0"><span>-</span><input type="number" id="defenseMaxNum" min="0" max="12" value="12"><input type="range" id="defenseMax" min="0" max="12" value="12"><span>12</span></div></div>
                <div class="filter-card"><div class="filter-title">⚙️ 行动花费</div><div class="range-input"><span>0</span><input type="range" id="opMin" min="0" max="6" value="0"><input type="number" id="opMinNum" min="0" max="6" value="0"><span>-</span><input type="number" id="opMaxNum" min="0" max="6" value="6"><input type="range" id="opMax" min="0" max="6" value="6"><span>6</span></div></div>
            </div>
        </div>
    </div>

    <div id="cardContainer" class="card-grid">加载卡牌中...</div>
    <div class="pagination" id="pagination"></div>
</div>

<!-- 模态框 -->
<div id="cardModal" class="modal">
    <div class="modal-content">
        <span class="modal-close">&times;</span>
        <button class="nav-btn nav-left" id="prevCardBtn">◀</button>
        <button class="nav-btn nav-right" id="nextCardBtn">▶</button>
        <div class="modal-left">
            <img id="modalImg" class="modal-img" alt="card art">
            <div class="img-quality-switch">
                <button class="qual-btn" data-quality="20">预览画质</button>
                <button class="qual-btn active" data-quality="100">高清画质</button>
            </div>
            <div class="modal-actions">
                <button class="action-btn" id="saveImgBtn">💾 保存图片</button>
                <button class="action-btn" id="copyLinkBtn">🔗 复制链接</button>
            </div>
        </div>
        <div class="modal-right">
            <h2 id="modalName" style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;"></h2>
            <div><span id="modalFactionIcon"></span><span id="modalFaction"></span> &nbsp;| <span id="modalType"></span> &nbsp;| <span id="modalRarity"></span></div>
            <div id="modalCostDefense" class="badge"></div>
            <div><strong>📜 卡牌文本</strong><br><span id="modalText"></span></div>
            <div><strong>✨ 词条</strong> <span id="modalAttributes"></span></div>
            <div><strong>📚 扩展包</strong> <span id="modalSet"></span> &nbsp;| <strong>状态</strong> <span id="modalStatus"></span></div>
            <div><strong>🌍 英文名</strong> <span id="modalEnName"></span></div>
        </div>
    </div>
</div>

<script>
    // ---------- 全局数据 ----------
    let allCards = [];
    let filteredCards = [];
    let currentPage = 1;
    const PAGE_SIZE = 20;
    let currentModalIndex = -1;
    let currentQuality = 100;
    let currentModalCard = null;

    const factionsList = ["soviet","usa","poland","neutral","japan","italy","france","britain","finland","germany"];
    const factionNames = { "soviet":"苏联","usa":"美国","poland":"波兰","neutral":"中立","japan":"日本","italy":"意大利","france":"法国","britain":"英国","finland":"芬兰","germany":"德国" };
    const typeMap = { "infantry":"步兵","tank":"坦克","fighter":"战斗机","bomber":"轰炸机","artillery":"炮兵","order":"指令","countermeasure":"反制" };
    const unitTypes = ["infantry","tank","fighter","bomber","artillery"];
    const costRanges = [{label:"0~3费", min:0,max:3},{label:"4~6费", min:4,max:6},{label:"7+费", min:7,max:12}];

    function getCardImageUrl(imgName, quality=20) {
        if(!imgName) return "";
        return `https://images.weserv.nl/?url=ssl:www.kards.com/images/card/v48/zh-Hans/${imgName}&q=${quality}`;
    }

    async function loadData() {
        try {
            const res = await fetch('data.json');
            if(!res.ok) throw new Error("data.json加载失败");
            const data = await res.json();
            allCards = (data.cards || []).map(card => ({
                ...card,
                type: card.json?.type || card.type,
                faction: card.json?.faction || card.faction,
                setName: card.json?.set || card.set || "基础",
                attack: card.json?.attack ?? card.attack,
                defense: card.json?.defense ?? card.defense,
                operationCost: card.json?.operationCost ?? card.operationCost,
                cost: card.json?.kredits ?? (card.json?.cost ?? card.cost ?? 0),
                attributes: card.json?.attributes || [],
                text: card.json?.text?.["zh-Hans"] || "无描述",
                titleZh: card.json?.title?.["zh-Hans"] || card.title?.["zh-Hans"] || "无名",
                titleEn: card.json?.title?.["en-EN"] || "",
                image: card.json?.image || card.image,
                reserved: !!card.reserved,
                isSpawn: card.json?.set === "OnlySpawnable"
            }));
            initFiltersAndRender();
        } catch(e) { console.error(e); document.getElementById('cardContainer').innerHTML = '<div class="loading-placeholder">❌ 数据加载失败，确保 data.json 存在</div>'; }
    }

    function renderChipGroup(containerId, values, key, nameMap) {
        const container = document.getElementById(containerId);
        container.innerHTML = values.map(val => `<div class="filter-chip" data-${key}="${val}">${nameMap?.[val] || val}</div>`).join('');
        container.querySelectorAll(`[data-${key}]`).forEach(el => {
            el.addEventListener('click', (e) => { e.stopPropagation(); el.classList.toggle('active'); applyFiltersAndRender(); });
        });
    }

    function getSelectedMulti(key) {
        const chips = document.querySelectorAll(`.filter-chip[data-${key}]`);
        let selected = [];
        chips.forEach(chip => { if(chip.classList.contains('active')) selected.push(chip.getAttribute(`data-${key}`)); });
        return selected;
    }

    function getSelectedCostRanges() {
        const chips = document.querySelectorAll('[data-cost-range]');
        let ranges = [];
        chips.forEach(chip => { if(chip.classList.contains('active')) { let [min,max] = chip.getAttribute('data-cost-range').split('-').map(Number); ranges.push({min,max}); } });
        return ranges;
    }

    function getSelectedStatus() {
        const activeChip = document.querySelector('.filter-chip[data-status].active');
        return activeChip ? activeChip.getAttribute('data-status') : null;
    }

    function syncNumberInputs() {
        const pairs = [
            ['attackMin','attackMinNum'], ['attackMax','attackMaxNum'],
            ['defenseMin','defenseMinNum'], ['defenseMax','defenseMaxNum'],
            ['opMin','opMinNum'], ['opMax','opMaxNum']
        ];
        pairs.forEach(([rangeId, numId]) => {
            const range = document.getElementById(rangeId);
            const num = document.getElementById(numId);
            if(range && num) {
                num.value = range.value;
                range.addEventListener('input', () => { num.value = range.value; applyFiltersAndRender(); });
                num.addEventListener('input', () => { let v = parseInt(num.value) || 0; if(v>=parseInt(range.min) && v<=parseInt(range.max)) { range.value = v; applyFiltersAndRender(); } });
            }
        });
    }

    function initFiltersAndRender() {
        const factionSet = [...new Set(allCards.map(c=>c.faction))];
        const typeSet = [...new Set(allCards.map(c=>c.type))];
        const setSet = [...new Set(allCards.map(c=>c.setName).filter(Boolean))];
        renderChipGroup('factionFilter', factionSet, 'faction', factionNames);
        renderChipGroup('typeFilter', typeSet, 'type', typeMap);
        renderChipGroup('setFilter', setSet, 'set', null);
        const costDiv = document.getElementById('costFilterGroup');
        costDiv.innerHTML = costRanges.map(range => `<div class="filter-chip" data-cost-range="${range.min}-${range.max}">${range.label}</div>`).join('');
        costDiv.querySelectorAll('[data-cost-range]').forEach(el => el.addEventListener('click', (e) => { e.stopPropagation(); el.classList.toggle('active'); applyFiltersAndRender(); }));
        const statusDiv = document.getElementById('statusFilter');
        statusDiv.innerHTML = `<div class="filter-chip" data-status="active">活跃</div><div class="filter-chip" data-status="reserve">预备</div><div class="filter-chip" data-status="spawn">衍生</div>`;
        statusDiv.querySelectorAll('[data-status]').forEach(el => { el.addEventListener('click', (e) => { e.stopPropagation(); statusDiv.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active')); el.classList.add('active'); applyFiltersAndRender(); }); });
        document.getElementById('searchInput').addEventListener('input', () => applyFiltersAndRender());
        syncNumberInputs();
        applyFiltersAndRender();
    }

    function filterCards() {
        let result = [...allCards];
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        if(search) result = result.filter(c => c.titleZh.toLowerCase().includes(search) || c.text.toLowerCase().includes(search) || (c.attributes && c.attributes.some(attr=>attr.toLowerCase().includes(search))));
        let factionsSel = getSelectedMulti('faction');
        if(factionsSel.length) result = result.filter(c => factionsSel.includes(c.faction));
        let typesSel = getSelectedMulti('type');
        if(typesSel.length) result = result.filter(c => typesSel.includes(c.type));
        let setsSel = getSelectedMulti('set');
        if(setsSel.length) result = result.filter(c => setsSel.includes(c.setName));
        let costRangesSel = getSelectedCostRanges();
        if(costRangesSel.length) result = result.filter(c => costRangesSel.some(r => c.cost >= r.min && c.cost <= r.max));
        let statusSel = getSelectedStatus();
        if(statusSel) {
            if(statusSel === 'active') result = result.filter(c => !c.reserved && !c.isSpawn);
            else if(statusSel === 'reserve') result = result.filter(c => c.reserved);
            else if(statusSel === 'spawn') result = result.filter(c => c.isSpawn);
        }
        // 判断是否显示身材筛选: 当前筛选类型全部为战斗单位才显示 (类型选择不为空时检查)
        let selectedTypesNow = typesSel.length ? typesSel : [...new Set(allCards.map(c=>c.type))];
        let onlyUnits = selectedTypesNow.length > 0 && selectedTypesNow.every(t => unitTypes.includes(t));
        const statsGroup = document.getElementById('statsFilterGroup');
        if(onlyUnits && selectedTypesNow.length>0) statsGroup.style.display = 'flex';
        else statsGroup.style.display = 'none';
        if(onlyUnits && statsGroup.style.display === 'flex') {
            const attMin = parseInt(document.getElementById('attackMin').value);
            const attMax = parseInt(document.getElementById('attackMax').value);
            const defMin = parseInt(document.getElementById('defenseMin').value);
            const defMax = parseInt(document.getElementById('defenseMax').value);
            const opMin = parseInt(document.getElementById('opMin').value);
            const opMax = parseInt(document.getElementById('opMax').value);
            result = result.filter(c => {
                if(!unitTypes.includes(c.type)) return false;  // 仅当筛选中只有单位，非单位应当移除（因为只展示单位）
                let att = c.attack ?? -1, def = c.defense ?? -1, op = c.operationCost ?? 0;
                return (att >= attMin && att <= attMax) && (def >= defMin && def <= defMax) && (op >= opMin && op <= opMax);
            });
        }
        return result;
    }

    function applyFiltersAndRender() {
        filteredCards = filterCards();
        currentPage = 1;
        renderCardGrid();
        renderPagination();
    }

    function renderCardGrid() {
        const start = (currentPage-1)*PAGE_SIZE;
        const pageItems = filteredCards.slice(start, start+PAGE_SIZE);
        const container = document.getElementById('cardContainer');
        if(!pageItems.length) { container.innerHTML = '<div class="loading-placeholder">⚔️ 暂无卡牌，调整筛选⚔️</div>'; return; }
        container.innerHTML = pageItems.map((card, idx) => {
            const globalIdx = filteredCards.indexOf(card);
            const imgUrl = getCardImageUrl(card.image, 20);
            const reserveMark = card.reserved ? '<i class="reserve-icon"></i>' : '';
            return `<div class="card-item" data-index="${globalIdx}">
                        <div class="card-img"><img loading="lazy" src="${imgUrl}" alt="${card.titleZh}" style="border-radius:12px;"></div>
                        <div class="card-info"><div class="card-name"><span>${card.titleZh}</span>${reserveMark}</div></div>
                    </div>`;
        }).join('');
        document.querySelectorAll('.card-item').forEach(el => {
            el.addEventListener('click', () => { let idx = parseInt(el.getAttribute('data-index')); if(!isNaN(idx)) openModal(idx); });
        });
    }

    function renderPagination() {
        const total = filteredCards.length;
        const pages = Math.ceil(total/PAGE_SIZE);
        const pagDiv = document.getElementById('pagination');
        if(pages<=1) { pagDiv.innerHTML = ''; return; }
        let btns = `<button class="page-btn" data-page="prev" ${currentPage===1?'disabled':''}>◀</button>`;
        for(let i=1;i<=pages;i++) btns += `<button class="page-btn ${i===currentPage?'active-page':''}" data-page="${i}">${i}</button>`;
        btns += `<button class="page-btn" data-page="next" ${currentPage===pages?'disabled':''}>▶</button>`;
        pagDiv.innerHTML = btns;
        pagDiv.querySelectorAll('.page-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                let p = btn.getAttribute('data-page');
                if(p === 'prev') currentPage = Math.max(1, currentPage-1);
                else if(p === 'next') currentPage = Math.min(pages, currentPage+1);
                else currentPage = parseInt(p);
                renderCardGrid(); renderPagination();
            });
        });
    }

    function openModal(index) {
        if(index<0 || index>=filteredCards.length) return;
        currentModalIndex = index;
        currentModalCard = filteredCards[index];
        const card = currentModalCard;
        const factionKey = card.faction?.toLowerCase();
        const iconHtml = factionKey && factionsList.includes(factionKey) ? `<img class="faction-icon" src="${factionKey}.svg" onerror="this.style.display='none'">` : '';
        document.getElementById('modalFactionIcon').innerHTML = iconHtml;
        document.getElementById('modalFaction').innerText = factionNames[factionKey] || card.faction || '中立';
        document.getElementById('modalType').innerText = typeMap[card.type] || card.type;
        document.getElementById('modalRarity').innerText = card.json?.rarity || card.rarity || '';
        let statusLabel = card.reserved ? '预备' : (card.isSpawn ? '衍生' : '活跃');
        document.getElementById('modalName').innerHTML = `${card.titleZh} <span style="font-size:0.75rem; background:#332d1c; padding:0.2rem 0.6rem; border-radius:30px;">${statusLabel}</span>`;
        document.getElementById('modalText').innerText = card.text;
        let statLine = `💎 花费: ${card.cost}`;
        if(card.attack !== undefined && card.defense !== undefined) statLine += ` &nbsp; ⚔️ ${card.attack} / 🛡️ ${card.defense}`;
        if(card.operationCost !== undefined) statLine += ` &nbsp; ⚙️ 行动: ${card.operationCost}`;
        document.getElementById('modalCostDefense').innerHTML = statLine;
        document.getElementById('modalAttributes').innerHTML = (card.attributes?.length ? card.attributes.join(', ') : '无');
        document.getElementById('modalSet').innerText = card.setName || '基础';
        document.getElementById('modalStatus').innerHTML = statusLabel;
        document.getElementById('modalEnName').innerText = card.titleEn || '---';
        updateModalImage(card);
        document.getElementById('cardModal').style.display = 'flex';
    }

    function updateModalImage(card) { document.getElementById('modalImg').src = getCardImageUrl(card.image, currentQuality); }
    function closeModal() { document.getElementById('cardModal').style.display = 'none'; }
    function navigateModal(delta) { let newIdx = currentModalIndex + delta; if(newIdx>=0 && newIdx<filteredCards.length) openModal(newIdx); }

    window.addEventListener('load', () => {
        loadData();
        document.querySelector('.modal-close').addEventListener('click', closeModal);
        document.getElementById('prevCardBtn').addEventListener('click', () => navigateModal(-1));
        document.getElementById('nextCardBtn').addEventListener('click', () => navigateModal(1));
        document.getElementById('cardModal').addEventListener('click', (e) => { if(e.target === document.getElementById('cardModal')) closeModal(); });
        document.querySelectorAll('.qual-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.qual-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentQuality = parseInt(btn.getAttribute('data-quality'));
                if(currentModalCard) updateModalImage(currentModalCard);
            });
        });
        document.getElementById('saveImgBtn').addEventListener('click', () => { let img = document.getElementById('modalImg'); let a = document.createElement('a'); a.href = img.src; a.download = 'kards_card.png'; a.click(); });
        document.getElementById('copyLinkBtn').addEventListener('click', () => { navigator.clipboard.writeText(document.getElementById('modalImg').src); alert('链接已复制'); });
        const menuBtn = document.getElementById('menuToggleBtn');
        const navMenuDiv = document.getElementById('navMenu');
        menuBtn.addEventListener('click', (e) => { e.stopPropagation(); navMenuDiv.classList.toggle('open'); });
        document.addEventListener('click', (e) => { if(!menuBtn.contains(e.target) && !navMenuDiv.contains(e.target)) navMenuDiv.classList.remove('open'); });
        document.querySelectorAll('.menu-link').forEach(link => link.addEventListener('click', () => navMenuDiv.classList.remove('open')));
    });
</script>
</body>
</html>
