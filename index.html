<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>KARDS军械库 | 卡牌收藏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #2b2b1f;
            background-image: 
                radial-gradient(circle at 20% 40%, rgba(80, 70, 40, 0.4) 2%, transparent 2.5%),
                radial-gradient(circle at 70% 85%, rgba(60, 50, 30, 0.5) 1.8%, transparent 2.2%),
                radial-gradient(circle at 45% 20%, rgba(110, 90, 50, 0.3) 3%, transparent 3.5%),
                repeating-linear-gradient(45deg, #5e5536 0px, #5e5536 2px, #7e6e48 2px, #7e6e48 8px),
                repeating-linear-gradient(135deg, #3e3a2a 0px, #3e3a2a 3px, #5a4e32 3px, #5a4e32 10px);
            background-blend-mode: overlay, normal;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        :root {
            --germany: #5A5F55;
            --britain: #857A60;
            --soviet: #4F3826;
            --usa: #434B32;
            --japan: #90723C;
            --france: #283454;
            --italy: #555248;
            --poland: #645633;
            --finland: #C9C8BC;
            --neutral: #6b6e5c;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 16px 32px;
        }

        .nav-bar {
            background: rgba(20, 20, 15, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid #aa8e4e;
            border-radius: 20px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
        }

        .nav-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(170, 142, 78, 0.3);
        }

        .nav-brand {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f9f9fc, #e6dbb0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            white-space: nowrap;
        }

        .menu-btn {
            background: rgba(210, 210, 225, 0.12);
            border: 1px solid #aa8e4e;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
        }
        .menu-btn span {
            display: block;
            width: 22px;
            height: 2.5px;
            background-color: #f2e2b0;
            border-radius: 2px;
        }
        .nav-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-out;
            background: rgba(10, 10, 8, 0.98);
        }
        .nav-menu.open { max-height: 320px; }
        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px 20px 20px;
        }
        .menu-link {
            display: block;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 20px;
            border-radius: 60px;
            background: rgba(210, 210, 225, 0.08);
            color: #eef0ff;
            text-align: center;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .menu-link:hover { background: rgba(235, 235, 245, 0.2); border-color: #c9a53b; }
        .menu-link.active {
            background: #c9a53b;
            color: #1e1c10;
            font-weight: 700;
        }

        .filter-panel {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 1.2rem 1.2rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(170, 142, 78, 0.5);
        }
        .filter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }
        .filter-item {
            flex: 1;
            min-width: 130px;
        }
        .filter-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e9dbbd;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }
        select, .search-input {
            width: 100%;
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.55rem 1rem;
            color: #f5efdb;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23dbb45c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 1rem center;
        }
        .search-input { background-image: none; }
        .stats-group {
            margin-top: 0.8rem;
            padding-top: 0.5rem;
            border-top: 1px dashed rgba(170, 142, 78, 0.4);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .stats-item { flex: 1; min-width: 120px; }
        .exact-input {
            background: #1e1c16;
            border: 1px solid #aa8e4e;
            border-radius: 40px;
            padding: 0.4rem 0.8rem;

            color: #f5efdb;

        }
        .stats-note { font-size: 0.7rem; color: #c9b06b; margin-top: 6px; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        @media (max-width: 680px) {
            .card-grid { grid-template-columns: repeat(4, 1fr); gap: 0.7rem; }
        }
        @media (max-width: 480px) {
            .card-grid { gap: 0.6rem; }
        }
        .card-item {
            background: #111812;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.2s;
            cursor: pointer;
            border: 2px solid;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .card-item:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card-img {
            width: 100%;
            aspect-ratio: 500 / 702;
            background: #0a0f0c;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 0;
        }
        .card-info {
            padding: 0.5rem 0.6rem 0.7rem;
            background: rgba(0,0,0,0.75);
        }
        .card-name {
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            color: #faf0cf;
        }
        .card-name span:first-child {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reserve-icon-sm {
            width: 14px;
            height: 14px;
            background: url('reserve.png') no-repeat center;
            background-size: contain;
            display: inline-block;
        }
        @media (max-width: 560px) {
            .card-name { font-size: 0.65rem; }
            .card-info { padding: 0.4rem 0.5rem 0.6rem; }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.94);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: flex-start;
            justify-content: center;
            overflow-y: auto;
            padding: 20px 16px;
        }
        .modal-content {
            background: #121a14;
            max-width: 500px;
            width: 100%;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 3px solid;
            box-shadow: 0 20px 40px black;
            margin: 8px auto;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 28px;
            cursor: pointer;
            z-index: 25;
            color: #f0e6cc;
            background: rgba(0,0,0,0.6);
            width: 36px;
            height: 36px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-left {

            flex-direction: column;
            align-items: center;
            padding: 24px 20px 16px;
            border-top-left-radius: 26px;
            border-top-right-radius: 26px;

        .modal-right {

            gap: 16px;

            border-bottom-left-radius: 26px;
            border-bottom-right-radius: 26px;
        }
        .modal-img {
            width: 100%;
            max-width: 280px;
            border-radius: 12px;
            box-shadow: 0 8px 18px black;
        }
        .modal-actions {
            display: flex;
            gap: 16px;
            margin-top: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .action-btn {
            background: #2a2a1c;
            border: none;
            padding: 6px 18px;
            border-radius: 32px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #f5efdb;
            transition: 0.1s;
        }
        .action-btn:hover { background: #c9a63b; color: #1e1c0b; }
        .lang-switch {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .lang-btn {
            background: #2e2a1c;
            border: 1px solid #b69654;
            padding: 4px 12px;
            border-radius: 40px;
            color: #f7ebc6;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .lang-btn.active { background: #c9a63b; color: #161a0c; }
        .faction-icon-lg {
            width: 30px;
            height: 30px;
            vertical-align: middle;
            margin-right: 10px;
            filter: drop-shadow(0 1px 2px black);
        }
        .reserve-badge {
            width: 22px;
            height: 22px;
            background: url('reserve.png') no-repeat center;
            background-size: contain;
            display: inline-block;
            margin-left: 8px;
            vertical-align: middle;
        }
        .badge-stat {
            background: #1e2a1f;
            border-radius: 32px;
            padding: 6px 14px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid;
        }
        .detail-line {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .detail-line strong { min-width: 70px; color: #e6d5a8; }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
            gap: 6px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: #2d2a1d;
            border: 1px solid #a3874b;
            padding: 5px 12px;
            border-radius: 40px;
            color: #f5eaca;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .page-btn.active-page { background: #dbaa3a; color: #171e0c; }
        .page-btn:disabled { opacity: 0.4; }
        .footer-simple {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #928451;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.2rem 2rem;
            font-size: 0.85rem;
        }
        .footer-simple a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
            color: #f8efcf;
            background: rgba(0,0,0,0.4);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            transition: 0.2s;
        }
        .footer-simple a:hover { background: #b48b3f; color: #181d0e; }
        .footer-simple img { width: 18px; height: 18px; filter: invert(0.95); }
        @media (max-width: 560px) {
            .filter-grid { flex-direction: column; gap: 0.7rem; }
            .filter-item { min-width: 100%; }
            .modal-content { margin: 0 auto; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="nav-bar">
        <div class="nav-header-row">

<div id="cardModal" class="modal">
    <div class="modal-content" id="modalContent">
        <span class="modal-close">&times;</span>

<script>
    // 词条翻译映射
    const attrTranslation = {
        "blitz": "闪击", "fury": "奋战", "smokescreen": "烟幕", "pincer": "钳击", "salvage": "收缴",
        "guard": "守护", "heavyarmor1": "重甲1", "heavyarmor2": "重甲2", "heavyarmor3": "重甲3",
        "alpine": "山地", "mobilize": "动员", "covert": "隐蔽", "shock": "冲击", "bond": "协力", "ambush": "伏击",
        "intel1": "情报1", "intel2": "情报2", "intel3": "情报3"
    };
    
    // 翻译词条，合并 BecomesVeteran 和 OnlySpawnable 为"晋升老兵"
    function translateAttributes(attrs) {
        if (!attrs || !attrs.length) return "无";
        let hasVeteranUpgrade = false;
        const filtered = [];
        for (let a of attrs) {
            if (a === "OnlySpawnable" || a.startsWith("BecomesVeteran:")) {
                hasVeteranUpgrade = true;
                continue;
            }
            if (a.startsWith("VeteranOf:")) {
                filtered.push("老兵");
                continue;
            }
            filtered.push(attrTranslation[a] || a);
        }
        if (hasVeteranUpgrade) filtered.push("晋升老兵");
        const unique = [...new Set(filtered)];
        return unique.join(", ");
    }
    
    const rarityNames = { "Standard":"普通", "Limited":"限定", "Special":"特殊", "Elite":"精英" };

    let allCards = [], filteredCards = [];
    let currentPage = 1, PAGE_SIZE = 20;
    let currentModalCard = null;
    let currentModalLang = "zh-Hans";

    const factionNames = { "soviet":"苏联","usa":"美国","poland":"波兰","neutral":"中立","japan":"日本","italy":"意大利","france":"法国","britain":"英国","finland":"芬兰","germany":"德国" };
    const factionColor = { "germany":"#5A5F55","britain":"#857A60","soviet":"#4F3826","usa":"#434B32","japan":"#90723C","france":"#283454","italy":"#555248","poland":"#645633","finland":"#C9C8BC","neutral":"#6b6e5c" };
    const typeMap = { "infantry":"步兵","tank":"坦克","fighter":"战斗机","bomber":"轰炸机","artillery":"炮兵","order":"指令","countermeasure":"反制" };
    const unitTypes = ["infantry","tank","fighter","bomber","artillery"];

    function getCardImageUrl(imgName, lang = "zh-Hans", quality = 20) {
        if(!imgName) return "";
        return `https://images.weserv.nl/?url=ssl:www.kards.com/images/card/v48/${lang}/${imgName}&q=${quality}`;
    }

    async function loadData() {
        try {
            const res = await fetch('data.json');
            if(!res.ok) throw new Error("data.json failed");
            const data = await res.json();
            allCards = (data.cards || []).map(card => {
                let rawFaction = (card.json?.faction || card.faction || "").toLowerCase();
                let rawRarity = card.json?.rarity || card.rarity || "Standard";
                return {
                    ...card,
                    type: card.json?.type || card.type,
                    faction: rawFaction,
                    rarity: rawRarity,
                    setName: card.json?.set || card.set || "基础",
                    attack: card.json?.attack ?? card.attack,
                    defense: card.json?.defense ?? card.defense,
                    operationCost: card.json?.operationCost ?? card.operationCost,
                    cost: card.json?.kredits ?? (card.json?.cost ?? card.cost ?? 0),
                    attributes: card.json?.attributes || [],
                    text_zh: card.json?.text?.["zh-Hans"] || "无描述",
                    titleZh: card.json?.title?.["zh-Hans"] || card.title?.["zh-Hans"] || "无名",
                    titleEn: card.json?.title?.["en-EN"] || "",
                    image: card.json?.image || card.image,
                    reserved: !!card.reserved,
                    isSpawn: card.json?.set === "OnlySpawnable"
                };
            });
            initFilters();
            applyFilters();
        } catch(e) { console.error(e); document.getElementById('cardContainer').innerHTML = '<div>❌ 数据加载失败</div>'; }
    }

    function initFilters() {
        const factions = [...new Set(allCards.map(c=>c.faction))];
        const typeOpts = [...new Set(allCards.map(c=>c.type))];
        const sets = [...new Set(allCards.map(c=>c.setName).filter(Boolean))];
        document.getElementById('factionSelect').innerHTML = '<option value="all">全部阵营</option>' + factions.map(f => `<option value="${f}">${factionNames[f] || f}</option>`).join('');
        document.getElementById('typeSelect').innerHTML = '<option value="all">全部类型</option>' + typeOpts.map(t => `<option value="${t}">${typeMap[t] || t}</option>`).join('');
        document.getElementById('setSelect').innerHTML = '<option value="all">全部扩展</option>' + sets.map(s => `<option value="${s}">${s}</option>`).join('');
        ['factionSelect','typeSelect','costSelect','raritySelect','setSelect','statusSelect','searchInput'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => applyFilters());
        });
        document.getElementById('searchInput').addEventListener('input', () => applyFilters());
        ['attackExact','defenseExact','opExact'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => applyFilters());
        });
    }

    function searchableText(card) {
        let attrsTrans = card.attributes.map(a => attrTranslation[a] || a).join(" ");
        return `${card.titleZh} ${card.text_zh} ${attrsTrans}`.toLowerCase();
    }

    function filterCardsLogic() {
        let result = [...allCards];
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        if(search) result = result.filter(c => searchableText(c).includes(search));
        const faction = document.getElementById('factionSelect').value;
        if(faction !== 'all') result = result.filter(c => c.faction === faction);
        const typeVal = document.getElementById('typeSelect').value;
        if(typeVal !== 'all') result = result.filter(c => c.type === typeVal);
        const costVal = document.getElementById('costSelect').value;
        if(costVal !== 'all') {
            if(costVal === '7') result = result.filter(c => c.cost >= 7);
            else result = result.filter(c => c.cost === parseInt(costVal));
        }
        const rarityVal = document.getElementById('raritySelect').value;
        if(rarityVal !== 'all') result = result.filter(c => c.rarity === rarityVal);
        const setVal = document.getElementById('setSelect').value;
        if(setVal !== 'all') result = result.filter(c => c.setName === setVal);
        const status = document.getElementById('statusSelect').value;
        if(status === 'active') result = result.filter(c => !c.reserved && !c.isSpawn);
        else if(status === 'reserve') result = result.filter(c => c.reserved);
        else if(status === 'spawn') result = result.filter(c => c.isSpawn);

        const selectedTypes = typeVal !== 'all' ? [typeVal] : [...new Set(allCards.map(c=>c.type))];
        const onlyUnits = selectedTypes.length > 0 && selectedTypes.every(t => unitTypes.includes(t));
        const statsArea = document.getElementById('statsArea');
        if(onlyUnits && typeVal !== 'all') statsArea.style.display = 'block';
        else statsArea.style.display = 'none';
        if(onlyUnits && typeVal !== 'all') {
            let attExact = parseInt(document.getElementById('attackExact').value);
            let defExact = parseInt(document.getElementById('defenseExact').value);
            let opExact = parseInt(document.getElementById('opExact').value);
            result = result.filter(c => {
                if(!unitTypes.includes(c.type)) return false;
                if(attExact !== -1 && (c.attack ?? -2) !== attExact) return false;
                if(defExact !== -1 && (c.defense ?? -2) !== defExact) return false;
                if(opExact !== -1 && (c.operationCost ?? -2) !== opExact) return false;
                return true;
            });
        }
        return result;
    }
    function applyFilters() { filteredCards = filterCardsLogic(); currentPage = 1; renderCards(); renderPagination(); }
    function renderCards() {
        const start = (currentPage-1)*PAGE_SIZE;
        const pageCards = filteredCards.slice(start, start+PAGE_SIZE);
        const container = document.getElementById('cardContainer');
        if(!pageCards.length) { container.innerHTML = '<div class="loading-placeholder">未找到</div>'; return; }
        container.innerHTML = pageCards.map((card, idx) => {
            const globalIdx = filteredCards.indexOf(card);
            const imgUrl = getCardImageUrl(card.image, "zh-Hans", 20);
            const reserveMark = card.reserved ? '<i class="reserve-icon-sm"></i>' : '';
            return `<div class="card-item" data-index="${globalIdx}" style="border-color: ${factionColor[card.faction] || '#6b6e5c'};">
                        <div class="card-img"><img loading="lazy" src="${imgUrl}" alt="${card.titleZh}"></div>
                        <div class="card-info"><div class="card-name"><span>${card.titleZh}</span>${reserveMark}</div></div>
                    </div>`;
        }).join('');
        document.querySelectorAll('.card-item').forEach(el => {
            el.addEventListener('click', () => { let idx = parseInt(el.dataset.index); if(!isNaN(idx)) openModal(idx); });
        });
    }
    function renderPagination() {
        const total = filteredCards.length, pages = Math.ceil(total/PAGE_SIZE);
        const pagDiv = document.getElementById('pagination');
        if(pages<=1) { pagDiv.innerHTML = ''; return; }
        let btns = `<button class="page-btn" data-page="prev" ${currentPage===1?'disabled':''}>◀</button>`;
        for(let i=1;i<=pages;i++) btns += `<button class="page-btn ${i===currentPage?'active-page':''}" data-page="${i}">${i}</button>`;
        btns += `<button class="page-btn" data-page="next" ${currentPage===pages?'disabled':''}>▶</button>`;
        pagDiv.innerHTML = btns;
        pagDiv.querySelectorAll('.page-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                let p = btn.dataset.page;
                if(p === 'prev') currentPage = Math.max(1, currentPage-1);
                else if(p === 'next') currentPage = Math.min(pages, currentPage+1);
                else currentPage = parseInt(p);
                renderCards(); renderPagination();
            });
        });
    }

    function openModal(index) {
        const card = filteredCards[index];
        if(!card) return;
        currentModalCard = card;
        currentModalLang = "zh-Hans";
        updateModalContent();
        updateModalImage();
        document.getElementById('cardModal').style.display = 'flex';
        buildLangSwitch();
    }
    
    function updateModalContent() {
        const c = currentModalCard;
        const themeColor = factionColor[c.faction] || '#6b6e5c';
        document.getElementById('modalContent').style.borderColor = themeColor;
        document.getElementById('modalFactionIcon').innerHTML = `<img class="faction-icon-lg" src="${c.faction}.svg" onerror="this.style.display='none'">`;
        document.getElementById('modalFaction').innerHTML = factionNames[c.faction] || c.faction;
        document.getElementById('modalType').innerHTML = typeMap[c.type] || c.type;
        document.getElementById('modalRarity').innerHTML = rarityNames[c.rarity] || c.rarity;
        const reserveSpan = c.reserved ? '<span class="reserve-badge"></span>' : '';
        document.getElementById('modalName').innerHTML = `${c.titleZh} ${reserveSpan}`;
        document.getElementById('modalText').innerHTML = c.text_zh;
        let statLine = `💰 花费: ${c.cost}`;
        if(c.attack !== undefined && c.defense !== undefined) statLine += ` &nbsp; ⚔️ ${c.attack} / 🛡️ ${c.defense}`;
        if(c.operationCost !== undefined) statLine += ` &nbsp; ⚙️ 油费: ${c.operationCost}`;
        const badgeDiv = document.getElementById('modalCostDefense');
        badgeDiv.innerHTML = statLine;
        badgeDiv.style.borderLeftColor = themeColor;
        document.getElementById('modalAttributes').innerHTML = translateAttributes(c.attributes);
        document.getElementById('modalSet').innerHTML = c.setName;
        document.getElementById('modalEnName').innerHTML = c.titleEn || '---';
    }
    
    function updateModalImage() {
        if (!currentModalCard) return;
        document.getElementById('modalImg').src = getCardImageUrl(currentModalCard.image, currentModalLang, 100);
    }
    
    function buildLangSwitch() {
        const container = document.getElementById('modalLangSwitch');
        const languages = ["zh-Hans", "zh-Hant", "en-EN", "fr-FR", "de-DE", "pl-PL", "pt-BR", "ru-RU", "it-IT", "es-ES", "ko-KR", "ja-JP"];
        const langNames = { "zh-Hans":"简中","zh-Hant":"繁中","en-EN":"EN","fr-FR":"FR","de-DE":"DE","pl-PL":"PL","pt-BR":"PT","ru-RU":"RU","it-IT":"IT","es-ES":"ES","ko-KR":"KR","ja-JP":"JP" };
        container.innerHTML = languages.map(l => `<button class="lang-btn ${currentModalLang === l ? 'active' : ''}" data-lang="${l}">${langNames[l]}</button>`).join('');
        container.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentModalLang = btn.dataset.lang;
                updateModalImage();
                buildLangSwitch();
            });
        });
    }
    
    function closeModal() { document.getElementById('cardModal').style.display = 'none'; }

    window.addEventListener('load', () => {
        loadData();
        document.querySelector('.modal-close').addEventListener('click', closeModal);
        document.getElementById('cardModal').addEventListener('click', (e) => { if(e.target === document.getElementById('cardModal')) closeModal(); });
        document.getElementById('saveImgBtn').onclick = () => { let a = document.createElement('a'); a.href = document.getElementById('modalImg').src; a.download = 'kards_card.png'; a.click(); };
        document.getElementById('copyLinkBtn').onclick = () => { navigator.clipboard.writeText(document.getElementById('modalImg').src); alert('图片链接已复制'); };
        const menuBtn = document.getElementById('menuToggleBtn'), menuDiv = document.getElementById('navMenu');
        menuBtn.onclick = (e) => { e.stopPropagation(); menuDiv.classList.toggle('open'); };
        document.addEventListener('click', (e) => { if(!menuBtn.contains(e.target) && !menuDiv.contains(e.target)) menuDiv.classList.remove('open'); });
        document.querySelectorAll('.menu-link').forEach(l => l.addEventListener('click', () => menuDiv.classList.remove('open')));
    });
</script>
</body>
</html>
